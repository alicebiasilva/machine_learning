const ADVANCED = {"agrupamento":{"visual":"kmeans","cards":[]},"random_forest":{"visual":"forest","cards":[["Como o Random Forest reduz a correlação entre árvores?","Usa bootstrap para variar os dados e seleção aleatória de features em cada split, produzindo árvores menos semelhantes."],["Por que árvores muito correlacionadas reduzem o ganho do ensemble?","Se os modelos cometem os mesmos erros, a agregação tem pouca capacidade de cancelá-los; diversidade é essencial para reduzir variância."],["Como escolher n_estimators no Random Forest?","Aumente até que o ganho de desempenho/estabilidade sature, considerando também custo de memória, treinamento e inferência."],["O que acontece se max_features ficar muito baixo?","As árvores ficam mais diversas, mas cada split vê menos informação e pode aumentar o viés; o efeito deve ser validado."],["Como o desbalanceamento afeta o Random Forest?","A classe majoritária pode dominar a votação. class_weight, amostragem e threshold podem ser usados conforme o objetivo e o custo dos erros."],["Por que permutation importance pode ser enganosa com features correlacionadas?","Features correlacionadas podem compartilhar informação; permutar uma delas isoladamente pode indicar pouca importância mesmo quando o conjunto é relevante."],["Por que Random Forest não é ideal para extrapolação?","Na regressão, as previsões são agregações de valores das regiões observadas; o modelo não impõe uma tendência funcional fora do domínio do treino."],["Como eu validaria um Random Forest em séries temporais?","Usaria divisão temporal ou validação walk-forward, evitando que observações futuras influenciem o treinamento."],["Qual é a principal vantagem do Random Forest sobre uma árvore única?","Maior estabilidade e menor variância por combinar muitas árvores diversificadas em vez de depender de uma única árvore."]]},"neural_networks":{"visual":"nn","cards":[["Tipo de dado","Supervisionado para classificação e regressão. Inputs são normalmente numéricos; categóricas precisam ser codificadas, frequentemente one-hot ou embeddings. Arquiteturas específicas lidam com imagem, texto e séries."],["Por que o scaling é importante no KNN?","Muito recomendado para features numéricas. Escalas comparáveis ajudam otimização por gradiente e evitam que uma feature domine os updates. Scaling deve ser aprendido apenas no treino."],["Outliers & missing","Outliers podem gerar gradientes grandes e prejudicar treinamento; considere robust scaling, clipping ou tratamento contextual. Redes não lidam automaticamente com missing arbitrário sem estratégia explícita."],["Assumptions","Não exige linearidade nem normalidade. Exige escolhas adequadas de arquitetura, função de ativação, inicialização, loss e dados suficientes. Independência das observações pode continuar sendo relevante dependendo da aplicação."],["Ativações & gradientes","ReLU/GELU são comuns em hidden layers; sigmoid/softmax aparecem em outputs de classificação. Backpropagation usa regra da cadeia. Vanishing/exploding gradients são mitigados por ativações, inicialização, normalization e arquiteturas adequadas."],["Regularização","L1/L2/weight decay, dropout, early stopping, data augmentation e redução de arquitetura. Batch normalization pode estabilizar treinamento, mas não é sinônimo de regularização."],["Quais são os principais hiperparâmetros do KNN e como eles afetam o modelo?","Learning rate, batch size, número de camadas/neurônios, epochs, optimizer, activation, weight decay/dropout. Learning rate costuma ser um dos parâmetros mais sensíveis."],["Vantagens / limitações","Vantagens: alta capacidade e excelente para relações complexas/dados não estruturados. Limitações: custo computacional, necessidade de tuning, interpretabilidade menor e risco de overfitting."],["Custo computacional","Treino pode ser alto e beneficiar-se de GPU. Custo depende de parâmetros, operações por camada, número de amostras/epochs e batch size. Inferência é geralmente mais barata que treinamento."]]},"linear_regression":{"visual":"linear","cards":[["Tipo de dado / target","Supervisionado para regressão contínua. Relação modelada é linear nos parâmetros: y = β₀ + Σβⱼxⱼ + ε. Pode representar não linearidade por engenharia de features."],["Assumptions","Linearidade nos parâmetros, independência dos erros, homocedasticidade e ausência de multicolinearidade perfeita. Normalidade dos erros é importante principalmente para inferência clássica, não para obter estimativas OLS em si."],["Por que o scaling é importante no KNN?","Não é necessário para OLS em termos de previsão/solução fechada, mas pode ajudar otimização por gradiente e comparabilidade dos coeficientes. Para regularização, scaling é importante."],["Outliers & influência","OLS minimiza erros quadráticos, então outliers podem ter influência desproporcional e deslocar coeficientes. Avalie leverage, Cook's distance e resíduos; considere transformação, robust regression ou tratamento contextual."],["Missing & categóricas","OLS não aceita NaN diretamente. Categóricas precisam de encoding. Imputação e encoding devem estar dentro do pipeline."],["Multicolinearidade","Não necessariamente prejudica previsão, mas torna coeficientes instáveis e aumenta variâncias dos estimadores. VIF é um diagnóstico comum; Ridge é uma estratégia de mitigação."],["Regularização","Ridge penaliza soma dos quadrados dos coeficientes; Lasso usa soma dos valores absolutos e pode zerar coeficientes; Elastic Net combina ambas. Regularização introduz viés em troca de menor variância."],["Métricas & diagnóstico","MAE, MSE, RMSE e R²/Adjusted R². Analise resíduos versus fitted, heterocedasticidade, autocorrelação e pontos influentes."],["Custo computacional","OLS pode ser resolvido por QR/SVD e é eficiente para muitos problemas tabulares; gradiente é útil em datasets grandes. Predição é muito barata."]]},"regularization":{"visual":"regularization","cards":[["Ridge (L2)","Adiciona λΣβⱼ² à loss. Shrinkage contínuo: reduz coeficientes, mas normalmente não os zera. Útil com multicolinearidade e muitos preditores correlacionados."],["Lasso (L1)","Adiciona λΣ|βⱼ|. Pode levar coeficientes exatamente a zero, funcionando como seleção de features. Com features altamente correlacionadas, a escolha entre elas pode ser instável."],["Elastic Net","Combina L1 e L2. Útil quando há grupos de features correlacionadas e se deseja alguma esparsidade."],["Por que o scaling é importante no KNN?","Essencial antes da regularização para que a penalização seja comparável entre coeficientes. StandardScaler é uma escolha comum; faça fit no treino."],["Bias–variance","λ maior aumenta regularização: reduz variância e tende a aumentar viés. λ deve ser escolhido por validação cruzada."],["Interpretação","Coeficientes regularizados não têm exatamente a mesma interpretação dos OLS não regularizados. Compare magnitudes após scaling quando fizer sentido."],["Custo computacional","Problemas convexos de Ridge/Lasso/Elastic Net têm otimização eficiente; Lasso pode exigir métodos iterativos como coordinate descent. O custo depende de n, d e solver."]]},"regularizacao":{"visual":"regularizacao","cards":[["O que é regularização em Machine Learning?","É uma técnica que adiciona uma penalização à função objetivo para controlar a complexidade do modelo e reduzir overfitting, aceitando algum aumento de viés em troca de menor variância."],["Por que a regularização pode reduzir overfitting?","Ela restringe soluções excessivamente complexas, reduzindo a sensibilidade do modelo ao ruído e a particularidades da amostra de treinamento."],["O que é a Ridge Regression?","É uma regressão linear regularizada com penalização L2. Ela adiciona ao erro de treinamento a soma dos quadrados dos coeficientes, fazendo com que sejam encolhidos em direção a zero."],["Qual é a fórmula da Ridge Regression?","β̂ = argminβ [ Σᵢ(yᵢ − xᵢᵀβ)² + λΣⱼβⱼ² ]. O primeiro termo mede o erro de ajuste e o segundo penaliza a magnitude dos coeficientes. λ controla a força da regularização."],["Como interpretar o parâmetro λ na Ridge?","λ = 0 recupera a regressão sem regularização. À medida que λ aumenta, os coeficientes sofrem maior shrinkage."],["O que acontece com os coeficientes quando λ aumenta na Ridge?","Eles tendem a se aproximar de zero, mas normalmente não são exatamente zerados. Por isso, Ridge não é um método de seleção esparsa de variáveis."],["O que é a Lasso Regression?","É uma regressão linear regularizada com penalização L1. A penalização usa o valor absoluto dos coeficientes e pode fazer alguns deles chegarem exatamente a zero."],["Qual é a fórmula da Lasso Regression?","β̂ = argminβ [ Σᵢ(yᵢ − xᵢᵀβ)² + λΣⱼ|βⱼ| ]. O termo Σ|βⱼ| é a penalização L1 e λ determina sua intensidade."],["Por que a Lasso pode fazer seleção de variáveis?","A penalização L1 favorece soluções esparsas. Alguns coeficientes podem ser exatamente iguais a zero, fazendo com que essas features deixem de contribuir diretamente para o modelo."],["Qual é a diferença entre Ridge e Lasso?","Ridge usa uma penalização L2, cuja derivada é proporcional ao próprio coeficiente e tende suavemente a zero. Já o Lasso usa L1, que possui uma não diferenciabilidade em zero e um subgradiente que permite que o ótimo ocorra exatamente em β = 0. Por isso, Lasso pode realizar seleção de variáveis, enquanto Ridge normalmente apenas reduz os coeficientes."],["Como a geometria explica a diferença entre Ridge e Lasso?","Na formulação equivalente com restrição, Ridge possui uma região aproximadamente circular, enquanto Lasso possui uma região com cantos. Esses cantos favorecem soluções em que alguns coeficientes ficam exatamente em zero."],["O que o gráfico de Ridge e Lasso representa?","Ridge é representada por uma fronteira arredondada associada à penalização L2, favorecendo shrinkage contínuo. Lasso possui cantos associados à penalização L1, favorecendo soluções esparsas com coeficientes zerados."],["Por que o scaling é importante em Ridge e Lasso?","A penalização atua sobre os coeficientes. Se as features estiverem em escalas muito diferentes, a regularização pode afetá-las de forma desigual. Por isso, é comum padronizar as features antes do modelo."],["O intercepto deve ser regularizado?","Normalmente não. Em implementações usuais, o intercepto não entra no termo de penalização."],["Como Ridge e Lasso lidam com multicolinearidade?","Ridge tende a ser útil porque reduz conjuntamente coeficientes de variáveis correlacionadas. Lasso pode selecionar uma variável e zerar outras correlacionadas, e essa seleção pode ser instável."],["Como escolher λ?","λ é um hiperparâmetro e deve ser escolhido usando validação, normalmente cross-validation, com uma métrica alinhada ao objetivo."],["O que acontece se λ for muito pequeno?","A penalização terá pouca influência e o modelo se aproxima da solução sem regularização, podendo não controlar suficientemente a variância."],["O que acontece se λ for muito grande?","Os coeficientes são fortemente encolhidos e o modelo pode ficar simples demais, levando a underfitting."],["Qual é a relação entre regularização e o trade-off entre viés e variância?","A regularização normalmente aumenta o viés e reduz a variância. O objetivo é encontrar um nível de complexidade que minimize o erro de generalização, não o erro de treino."],["Quando usar Elastic Net?","Quando queremos combinar características de Ridge e Lasso. Ele utiliza uma combinação das penalizações L1 e L2 e pode ser útil com muitas features correlacionadas."],["Qual é a fórmula do Elastic Net?","Uma forma de escrever é: β̂ = argminβ [ Loss(β) + λ(αΣⱼ|βⱼ| + (1−α)Σⱼβⱼ²) ]. α controla a mistura entre L1 e L2."],["Regularização é a mesma coisa que reduzir features?","Não. Regularização modifica a função objetivo para controlar os parâmetros. Lasso pode produzir seleção de features como consequência de zerar coeficientes, mas isso é diferente de remover variáveis antes do treinamento."],["Como a regularização afeta a interpretabilidade?","Ridge mantém mais variáveis, mas reduz a magnitude dos coeficientes. Lasso pode produzir modelos mais esparsos, embora a seleção possa ser instável quando existem features fortemente correlacionadas."],["Como implementar Ridge e Lasso de forma segura?","Use um Pipeline com o pré-processamento, como StandardScaler, seguido do estimador regularizado. A escolha de λ deve ocorrer dentro da validação para evitar leakage."],["Como escolher entre Ridge, Lasso e Elastic Net?","Ridge é uma opção natural quando queremos shrinkage e estabilidade diante de multicolinearidade; Lasso quando esparsidade é desejada; Elastic Net quando queremos combinar L1 e L2. A decisão final deve ser validada empiricamente."],["O que é shrinkage?", "É o processo de reduzir (“encolher”) os valores dos coeficientes de um modelo em direção a zero, geralmente por meio de regularização."]]},
"evaluation":{"visual":"roc","cards":[["Como o modelo faz a previsão no caso de classificação?","Accuracy pode mascarar desbalanceamento. Precision mede TP/(TP+FP), recall mede TP/(TP+FN), F1 é média harmônica. ROC-AUC mede ranking; PR-AUC é especialmente informativa quando a classe positiva é rara."],["Como o modelo faz a previsão no caso de regressão?","MAE é linear no erro e robusto em relação a grandes erros comparado ao MSE; MSE/RMSE penalizam mais erros grandes. R² mede proporção relativa de variabilidade explicada em relação ao baseline da média."],["Threshold","Probabilidade prevista não é decisão. Threshold deve ser escolhido com custo de negócio, matriz de confusão, precision/recall e calibração."],["Leakage","Qualquer transformação que aprende dos dados — imputação, scaling, seleção de features, target encoding — deve ser ajustada apenas no treino dentro de CV/pipeline."],["Calibração","Um modelo pode ter bom ranking e probabilidades mal calibradas. Reliability curve, Brier score e calibration methods ajudam quando probabilidade tem significado operacional."],["Intervalos / incerteza","Métrica pontual não basta: use cross-validation, bootstrap ou intervalos apropriados para quantificar variabilidade do desempenho."]]},"data_prep":{"visual":"pipeline","cards":[["Missing values","Diagnostique mecanismo e padrão de ausência antes de imputar. Média/mediana são baselines; KNN/MICE/model-based podem preservar mais estrutura, mas aumentam complexidade. Indicadores de missing podem ser úteis quando a ausência tem sinal."],["Outliers","Distinga erro de medição de observação rara real. Use IQR/z-score apenas como diagnóstico, não como regra automática de remoção. Considere winsorization, transformação, robust scaling ou modelos robustos."],["Categóricas","One-hot para categorias nominais; ordinal encoding quando existe ordem real; target/frequency encoding exigem cuidado com leakage. Alta cardinalidade pode exigir embeddings ou estratégias específicas."],["Por que o scaling é importante no KNN?","Standardização: (x−μ)/σ. Min-Max leva a intervalo definido. RobustScaler usa mediana/IQR. Modelos baseados em distância/gradiente costumam se beneficiar mais; árvores geralmente não precisam."],["Data leakage","Split antes de aprender preprocessing. Nunca calcule média, escala, seleção ou target encoding usando todo o dataset antes da validação."],["Desbalanceamento","Class weights, undersampling, oversampling/SMOTE e threshold tuning são opções. Avalie no espaço original de validação; não gere sintéticos antes do split."]]},"validation":{"visual":"cv","cards":[["Holdout","Train/validation/test separa papéis: treino ajusta parâmetros, validation escolhe modelo/hiperparâmetros, test estima desempenho final. Não use test repetidamente para tuning."],["K-fold","Divide treino em K partes; cada fold serve como validação uma vez. Média reduz dependência de um único split, mas aumenta custo aproximadamente K vezes."],["Stratified / Group / TimeSeries","Stratified preserva proporção de classes; Group evita que o mesmo grupo apareça em treino e validação; séries temporais exigem respeitar ordem temporal."],["Nested CV","Outer loop estima generalização; inner loop faz tuning. Reduz viés otimista quando há seleção intensa de hiperparâmetros."],["Pipeline","Pré-processamento deve estar dentro do pipeline para ser refit em cada fold. Esse detalhe é uma pergunta clássica de entrevista sênior."],["Trade-off","Mais folds → menor viés do estimador de desempenho em muitos cenários, mas maior custo e possível correlação entre estimativas. Escolha estratégia conforme estrutura dos dados."]]},"topicos_introdutorios":{"cards":[["O que é Inteligência Artificial (IA)?","É o campo que desenvolve sistemas capazes de executar tarefas que normalmente exigiriam capacidades associadas à inteligência humana, como percepção, raciocínio, planejamento, linguagem e tomada de decisão, usando regras lógicas e matemáticas, que pode envolver desde automações até modelos sofisticados."],["O que é Machine Learning?","É uma subárea da IA em que algoritmos aprendem padrões a partir de dados para fazer previsões, classificações, decisões ou descobrir estruturas, em vez de depender apenas de regras explicitamente programadas."],["Qual é a diferença entre IA, Machine Learning e Deep Learning?","IA é o campo mais amplo. Machine Learning é uma abordagem dentro de IA baseada em aprendizado a partir de dados. Deep Learning é uma subárea de ML que usa redes neurais com múltiplas camadas para aprender representações hierárquicas."],["Quais tipos de problemas existem em Machine Learning?","Os principais paradigmas são aprendizado supervisionado, não supervisionado e por reforço. Em supervisionado temos principalmente classificação e regressão; em não supervisionado, tarefas como clusterização e redução de dimensionalidade. Também existem problemas de detecção de anomalias, recomendação e previsão temporal, entre outros."],["Qual é a diferença entre aprendizado supervisionado e não supervisionado?","No supervisionado existe uma variável-alvo conhecida durante o treinamento. No não supervisionado não há target explícito; o objetivo é descobrir estrutura, como grupos, componentes ou padrões de densidade."],["O que caracteriza um problema de classificação?","O target é categórico. O modelo aprende uma função que atribui uma classe a cada observação. Pode ser binário, quando há duas classes, ou multiclasse, quando há mais de duas."],["O que caracteriza um problema de regressão?","O target é quantitativo e o objetivo é estimar um valor numérico contínuo, como receita, preço ou demanda."],["O que é aprendizado não supervisionado na prática?","É quando não temos um target rotulado e buscamos estrutura nos dados. Exemplos incluem K-means para clusterização, PCA para redução de dimensionalidade e métodos de detecção de anomalias."],["O que é overfitting?","É quando o modelo aprende não apenas o padrão generalizável, mas também ruído ou particularidades da amostra de treinamento. O resultado costuma ser desempenho muito melhor no treino do que em dados não vistos."],["O que é underfitting?","É quando o modelo é simples ou restrito demais para capturar a estrutura relevante dos dados. Nesse caso, o desempenho tende a ser ruim tanto no treinamento quanto na validação."],["O que significa generalização em Machine Learning?","É a capacidade de o modelo manter bom desempenho em dados novos, não utilizados no treinamento. O objetivo de ML não é memorizar a amostra, mas aprender padrões que se mantenham fora dela."],["Por que separar treino, validação e teste?","Treino é usado para ajustar parâmetros; validação é usada para selecionar modelo e hiperparâmetros; teste deve permanecer separado até a avaliação final para fornecer uma estimativa mais honesta da generalização."],["O que são parâmetros e hiperparâmetros?","Parâmetros são aprendidos pelo modelo durante o treinamento, como os coeficientes da regressão. Hiperparâmetros são definidos antes ou durante o processo de seleção, como profundidade de uma árvore, número de vizinhos ou força de regularização."],["O que é uma feature e o que é o target?","Features são as variáveis de entrada usadas para gerar a previsão. Target, ou variável-alvo, é aquilo que queremos prever ou explicar no aprendizado supervisionado."],["O que é uma baseline e por que ela é importante?","É uma referência simples de desempenho, como prever a classe majoritária ou a média. Ela permite verificar se um modelo sofisticado realmente agrega valor e ajuda a contextualizar métricas."],["Por que o problema de negócio deve ser definido antes do modelo?","Porque a escolha do target, horizonte, métrica, threshold e custo dos erros depende do objetivo. Um modelo tecnicamente bom pode não gerar valor se estiver otimizando a variável ou métrica errada."],["O que é data leakage?","É quando informações que não estariam disponíveis no momento real da previsão entram no treinamento ou no processo de validação. Pode ser gerado tanto por colunas que estão naturalmente relacionadas com o evento resposta ou com colunas criadas via feature engineering a partir do target. Isso produz uma estimativa de desempenho artificialmente otimista e pode comprometer o poder de generalização do modelo em produção."],["Por que a métrica precisa estar alinhada ao negócio?","Porque diferentes erros têm custos diferentes. Em fraude, por exemplo, perder uma fraude pode ser muito mais caro que gerar um falso positivo; em outros problemas, precisão ou custo operacional podem ser prioritários. A métrica deve refletir o objetivo real."],["O que significa colocar um modelo em produção?","Significa integrar o modelo a um processo real para gerar previsões de forma reproduzível, observável e sustentável, considerando versionamento, dados de entrada, latência, monitoramento, drift, segurança e re-treinamento quando necessário."],["Como funciona o trade-off entre viés e variância?","Viés é o erro sistemático introduzido por um modelo excessivamente simples; variância é a sensibilidade do modelo às particularidades da amostra de treinamento. Em geral, aumentar a complexidade reduz viés e aumenta variância, enquanto reduzir a complexidade faz o contrário. O objetivo é encontrar um ponto de equilíbrio que minimize o erro de generalização. Na prática, esse trade-off é avaliado com validação e teste: underfitting costuma estar associado a viés alto, e overfitting a variância alta."]]},"prob":{"cards":[["O que é estatística descritiva?","É o conjunto de técnicas para organizar, resumir e descrever dados observados, usando tabelas, gráficos e medidas como média, mediana, moda, quartis e dispersão."],["O que é estatística inferencial?","É o conjunto de métodos para tirar conclusões sobre uma população a partir de uma amostra, quantificando a incerteza por meio de estimação, intervalos de confiança e testes de hipóteses."],["Quais são as principais medidas descritivas?","Média, mediana e moda são medidas de tendência central; quartis e percentis são medidas de posição."],["Quais são as principais medidas de variabilidade?","Variância, desvio padrão, amplitude, amplitude interquartil (IQR) e coeficiente de variação. Variância e desvio padrão são sensíveis a extremos; o IQR é mais robusto."],["O que é um teste de hipóteses e quando usar?","É um procedimento para avaliar evidência contra uma hipótese nula H0 em favor de H1. É usado para testar afirmações sobre uma população ou comparar grupos."],["Como estruturar um teste de hipóteses?","Defino H0 e H1, escolho a estatística de teste e α, verifico as condições, calculo a estatística e o p-valor e tomo a decisão. A conclusão deve ser contextualizada."],["O que é um intervalo de confiança e quando usar?","É um intervalo produzido por um procedimento que, em repetidas amostragens, captura o parâmetro verdadeiro em uma proporção determinada de amostras. Serve para estimar parâmetros e comunicar incerteza."],["O que significa um intervalo de confiança de 95%?","Em interpretação frequentista, se o procedimento fosse repetido muitas vezes, aproximadamente 95% dos intervalos conteriam o parâmetro verdadeiro. Não significa 95% de probabilidade para o parâmetro neste intervalo específico."],["O que é um p-valor?","É a probabilidade, assumindo H0 verdadeira, de observar uma estatística tão extrema quanto ou mais extrema que a observada, segundo a distribuição do teste. Não é a probabilidade de H0 ser verdadeira."],["O que é nível de significância?","É o limite α definido antes do teste para controlar o erro tipo I no procedimento. Valores como 5% são comuns, mas a escolha deve considerar o contexto."],["O que são erro tipo I e erro tipo II?","Erro tipo I é rejeitar H0 quando ela é verdadeira. Erro tipo II é não rejeitar H0 quando ela é falsa. O poder do teste é 1−β."],["O que é poder estatístico?","É a probabilidade de rejeitar H0 quando uma alternativa específica é verdadeira. Em geral aumenta com tamanho amostral e tamanho do efeito e diminui com maior variabilidade."],["O que é máxima verossimilhança e quando usar?","É um método de estimação que escolhe os parâmetros que maximizam a verossimilhança dos dados observados sob o modelo. É muito usado na estimação de distribuições e em modelos como regressão logística."],["Qual é a diferença entre probabilidade e verossimilhança?","Na probabilidade, os parâmetros são fixos e descrevemos a chance dos dados. Na verossimilhança, os dados observados são fixos e avaliamos quais parâmetros tornam esses dados mais plausíveis."],["O que é uma distribuição de probabilidade?","É uma função que descreve como a probabilidade ou densidade se distribui sobre os possíveis valores de uma variável aleatória. Variáveis discretas usam função de massa; contínuas usam função densidade."],["Quais tipos de variáveis existem?","Categóricas podem ser nominais ou ordinais; quantitativas podem ser discretas ou contínuas."],["Quais são as principais distribuições de probabilidade?","Normal, Bernoulli, Binomial, Poisson, Exponencial, Uniforme, t de Student, Qui-quadrado e F são algumas das principais em ciência de dados e inferência."],["Quais são as suposições da distribuição Normal?","É contínua e simétrica em torno da média, definida por μ e σ². Em inferência, a normalidade pode ser uma hipótese sobre dados ou erros; não é uma exigência universal de machine learning."],["Quando usar a distribuição Bernoulli?","Quando cada experimento tem exatamente dois resultados possíveis, como sucesso/fracasso ou 0/1, com probabilidade de sucesso p."],["Quando usar a distribuição Binomial?","Quando contamos sucessos em n ensaios Bernoulli independentes e com a mesma probabilidade p de sucesso."],["Quando usar a distribuição Poisson?","Para modelar contagens de eventos em um intervalo quando os eventos são aproximadamente independentes e a taxa média λ é estável. Na Poisson clássica, média e variância são iguais."],["Quando usar a distribuição Exponencial?","Para modelar tempos de espera entre eventos em um processo de Poisson sob taxa constante. Possui a propriedade de falta de memória."],["Quando usar a distribuição t de Student?","Principalmente para inferência sobre médias quando a variância populacional é desconhecida, especialmente em amostras pequenas sob condições adequadas."],["Quando usar as distribuições Qui-quadrado e F?","A Qui-quadrado aparece em inferência para variâncias e testes de independência/homogeneidade. A F aparece em comparações de variâncias, ANOVA e testes conjuntos em regressão."],["O que é um teste paramétrico?","É um teste que assume uma forma paramétrica para a distribuição dos dados ou dos erros e testa parâmetros dessa distribuição. Exemplos são teste t e ANOVA sob suas condições."],["O que é um teste não paramétrico?","É um teste que exige menos suposições distribucionais e frequentemente trabalha com postos. Exemplos incluem Mann-Whitney, Wilcoxon e Kruskal-Wallis."],["Quando escolher um teste paramétrico ou não paramétrico?","Depende da pergunta, desenho do estudo, escala dos dados, tamanho da amostra e plausibilidade das suposições. Não paramétrico não significa ausência de suposições."],["O que é correlação e qual a diferença entre Pearson e Spearman?","Correlação mede associação, não causalidade. Pearson mede principalmente associação linear e é sensível a outliers; Spearman usa postos e mede associação monotônica."], ["Quais os principais métodos de amostragem?", "Os quatro probabilísticos mais importantes são aleatória simples, estratificada, sistemática e por conglomerados. Entre os não probabilísticos, temos amostragem por conveniência, por julgamento, por quotas, bola de neve e autoseleção. A principal diferença é que, nos métodos não probabilísticos, a probabilidade de cada elemento ser selecionado não é conhecida. "], ["Quais os principais métodos de amostragem?", "Os quatro probabilísticos mais importantes são aleatória simples, estratificada, sistemática e por conglomerados. Entre os não probabilísticos, temos amostragem por conveniência, por julgamento, por quotas, bola de neve e autoseleção. A principal diferença é que, nos métodos não probabilísticos, a probabilidade de cada elemento ser selecionado não é conhecida. "], ["O que é o Teorema Central do Limite?","Sob condições apropriadas, a distribuição da média amostral tende a uma Normal quando o tamanho da amostra cresce, mesmo que a população original não seja Normal."],["Qual é a diferença entre população, amostra e parâmetro?","População é o conjunto de interesse; amostra é o subconjunto observado; parâmetro é uma característica numérica da população. Uma estatística é calculada na amostra e usada para estimar o parâmetro."],["Por que a amostragem importa em ciência de dados?","Porque uma amostra enviesada pode produzir estimativas e modelos que não generalizam para a população de interesse. O processo de coleta determina quais conclusões são justificáveis."],  ["O que é Boostrap?", "É uma técnica de reamostragem com reposição que cria várias amostras a partir da amostra original para estimar a distribuição de uma estatística e, consequentemente, sua incerteza, como erro padrão e intervalo de confiança."]]},"gradient_descendente":{"visual":"gradient","cards":[["O que é Gradient Descent?","É um algoritmo iterativo de otimização que busca minimizar uma função objetivo atualizando os parâmetros na direção oposta ao gradiente."],["Como funciona a atualização dos parâmetros no Gradient Descent?","Em cada iteração, calculamos o gradiente da função de perda em relação aos parâmetros e fazemos θ ← θ − η∇J(θ), em que η é a taxa de aprendizado."],["O que é o gradiente de uma função?","É o vetor formado pelas derivadas parciais da função em relação aos parâmetros. Ele aponta para a direção de maior crescimento local da função; por isso usamos o sentido oposto para buscar redução da loss."],["Por que a atualização usa o gradiente negativo?","Porque o gradiente aponta para a direção de maior aumento local da função. Caminhar na direção oposta tende a reduzir a função quando o passo é adequado."],["O que é learning rate?","É o tamanho do passo dado a cada atualização. Um learning rate muito pequeno pode tornar a convergência lenta; um muito grande pode causar oscilações ou divergência."],["O que acontece se o learning rate for muito pequeno?","As atualizações ficam pequenas, tornando o treinamento lento e podendo exigir muitas iterações para chegar a uma região próxima do mínimo."],["O que acontece se o learning rate for muito grande?","O algoritmo pode ultrapassar repetidamente o mínimo, oscilar ou divergir em vez de convergir para uma solução adequada."],["O que significa convergência no Gradient Descent?","Significa que as atualizações deixam de produzir mudanças relevantes na função objetivo ou nos parâmetros, segundo o critério de parada adotado."],["O que é Batch Gradient Descent?","É a versão que calcula o gradiente usando todas as observações do conjunto de treinamento antes de cada atualização. Produz um gradiente mais estável, mas cada passo pode ser caro em bases grandes."],["O que é Stochastic Gradient Descent (SGD)?","É a versão que atualiza os parâmetros usando uma única observação por vez. As atualizações são rápidas e ruidosas, tornando a trajetória mais instável."],["O que é Mini-Batch Gradient Descent?","É a abordagem intermediária: cada atualização usa um pequeno lote de observações. É muito usada na prática porque equilibra eficiência, estabilidade e paralelismo."],["Qual é a diferença entre Batch, SGD e Mini-Batch Gradient Descent?","Batch usa todo o dataset por atualização; SGD usa uma observação; Mini-Batch usa pequenos subconjuntos. A diferença afeta custo, ruído do gradiente e eficiência computacional."],["Qual é o papel do scaling no Gradient Descent?","Scaling pode ser importante porque features em escalas muito diferentes podem deixar a superfície de otimização mal condicionada. Padronização costuma tornar os passos mais equilibrados e acelerar a convergência."],["O Gradient Descent sempre encontra o mínimo global?","Não. Em funções convexas, sob condições adequadas, pode-se chegar ao mínimo global. Em funções não convexas, como as de redes neurais, não há essa garantia em geral."],["Qual é a diferença entre mínimo local e mínimo global?","Mínimo local é uma região em que pequenas perturbações não reduzem a função. Mínimo global é o menor valor da função em todo o domínio."],["O que é uma função convexa e por que isso importa?","Em uma função convexa, qualquer mínimo local também é global. Isso torna a otimização mais previsível."],["Como o Gradient Descent é usado na regressão linear?","A loss, normalmente MSE, é definida em função dos coeficientes. O algoritmo calcula as derivadas da loss em relação aos coeficientes e os atualiza iterativamente."],["Como o Gradient Descent aparece na regressão logística?","Os coeficientes são ajustados para minimizar uma loss de classificação, normalmente log-loss/cross-entropy. O gradiente indica como cada coeficiente deve ser alterado para reduzir a perda."],["Como o Gradient Descent aparece nas redes neurais?","A backpropagation calcula os gradientes da loss em relação aos pesos usando a regra da cadeia. O otimizador usa esses gradientes para atualizar os pesos."],["O que é a regra da cadeia no contexto do Gradient Descent?","É a regra de cálculo diferencial que permite propagar derivadas através de funções compostas. Em redes neurais, ela permite calcular como cada peso influencia a loss."],["Quais são critérios de parada comuns no Gradient Descent?","Número máximo de iterações/épocas, redução da loss abaixo de um limite, norma do gradiente pequena ou ausência de melhora na validação."],["O que é early stopping?","É interromper o treinamento quando o desempenho em validação deixa de melhorar por determinado número de iterações. Pode reduzir custo e ajudar a controlar overfitting."],["O que são vanishing e exploding gradients?","Vanishing gradients ocorrem quando os gradientes ficam muito pequenos; exploding gradients ocorrem quando ficam muito grandes, causando atualizações instáveis."],["Como podemos melhorar a convergência do Gradient Descent?","Podemos ajustar o learning rate, fazer scaling, escolher mini-batches adequados e usar técnicas como Momentum, RMSProp ou Adam, dependendo do problema."],["O que é Momentum no Gradient Descent?","É uma técnica que acumula parte do movimento das atualizações anteriores, ajudando a acelerar a trajetória em direções consistentes e reduzir oscilações."],["O que é Adam?","Adam é um otimizador que combina ideias de momentum e adaptação da taxa de aprendizado por parâmetro, usando estimativas dos primeiros e segundos momentos dos gradientes."],["Qual é o custo computacional do Gradient Descent?","Depende do número de observações, features, parâmetros e tamanho dos batches. Mini-Batch costuma oferecer um compromisso eficiente entre custo por atualização e número de atualizações."],["Como escolher o learning rate na prática?","Pode-se testar uma faixa de valores em validação, usar um scheduler ou estratégias de busca. O valor adequado depende da escala dos dados, modelo, loss e otimizador."],["Como explicar o que é Gradient Descent de forma simples?","É um algoritmo de otimização que ajusta os parâmetros iterativamente na direção oposta ao gradiente da loss. O learning rate controla o tamanho do passo e influencia velocidade, estabilidade e convergência."], ["O que é Model Drift?", "É a degradação do desempenho de um modelo ao longo do tempo, geralmente porque os dados ou as relações entre as variáveis mudaram em relação ao cenário em que o modelo foi treinado."], ["O que é Data Drift?", "Data drift é a mudança na distribuição das variáveis de entrada dos dados ao longo do tempo em relação aos dados usados para treinar o modelo. Exemplo: um modelo foi treinado com clientes cuja idade média era 35 anos, mas meses depois a idade média passou para 45 anos. Isso é data drift e pode prejudicar a performance do modelo."]] }}

function makeMindmap(t){
  const concepts = t.concepts || [];
  const branches = t.branches || t.cards || [];
  const extra = (ADVANCED[t.id] && ADVANCED[t.id].cards) || [];

  // A mesma pergunta pode existir em branches/cards e também em ADVANCED.
  // Mantemos apenas a primeira ocorrência, preservando a fonte principal do tópico.
  const seen = new Set();
  const normalizeQuestion = q => String(q || "")
    .normalize("NFD")
    .replace(/[\\u0300-\\u036f]/g, "")
    .replace(/\\s+/g, " ")
    .trim()
    .toLowerCase();

  const uniqueCards = items => items.filter(card => {
    const key = normalizeQuestion(card.title);
    if(!key || seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  const cards = uniqueCards([
    ...branches.map((b,i)=>({title:b[0], body:b[1], kind:"topic", color:i%5, visual:(b[0]==="Como funciona o K-Fold Cross-Validation?" ? "cv" : null)})),
    ...concepts.map((c,i)=>({title:c[0], body:c[1], kind:"concept", color:(i+2)%5})),
    ...extra.map((c,i)=>({title:c[0], body:c[1], kind:"advanced", color:(i+3)%5, visual:(()=>{
      const q=c[0];
      if(q==="Como funciona o trade-off entre viés e variância?") return "biasvariance";
      if(q==="O que é Regressão Linear?") return "linear";
      if(q==="O que é regularização em Machine Learning?") return "regularizacao";
      if(q==="Quais são as suposições da distribuição Normal?") return "normal";
      if(q==="Como funciona o K-Fold Cross-Validation?") return "cv";
      if(q==="O que é data leakage durante a validação cruzada?") return "leakage";
      if(q==="Como evitar leakage ao fazer scaling?") return "pipeline";
      if(q==="Qual é a diferença entre validação cruzada e bootstrap?") return "cv";
      if(q==="O que é Time Series Cross-Validation?") return "timeseries";
      if(q==="Como o KNN trabalha com os dados?") return "knn";
      if(q==="Como o K afeta o comportamento do modelo?") return "knn";
      if(q==="Por que não devo usar K-Fold aleatório tradicional em séries temporais?") return "timeseries";
      if(q==="O que é matriz de confusão?") return "confusion";
      if(q==="Como interpretar TP, TN, FP e FN?") return "confusion";
      if(q==="O que é a curva ROC e quando usar?") return "roc";
      if(q==="Qual é a diferença entre ROC-AUC e PR-AUC?") return "pr";
      return null;
    })()}))
  ]);

  const cols = [[],[],[]];
  cards.forEach((card,i)=>cols[i%3].push(card));

  const cardHtml = card => `
    <article class="map-card ${card.kind} tone-${card.color}" tabindex="0" role="button"
             aria-label="${escapeHtml(card.title)}">
      <div class="map-card-title">${escapeHtml(card.title)}</div>
      <div class="map-card-body">${card.visual ? visualSVG(card.visual) : ""}${escapeHtml(card.body)}</div>
      <div class="quiz-feedback">
        <span class="feedback-label">Acertei?</span>
        <button type="button" class="thumb-up" title="Acertei" aria-label="Marcar como acertei">👍</button>
        <button type="button" class="thumb-down" title="Errei" aria-label="Marcar como errei">👎</button>
      </div>
    </article>`;

  return `
    <div class="mindmap-board">
<div class="map-columns">
        ${cols.map((col,ci)=>`
          <div class="map-column" data-column="${ci}">
            ${col.map(cardHtml).join("")}
          </div>
        `).join("")}
      </div>
    </div>`;
}





let quizMode = false;
let reviewWrong = false;
let quizFeedback = {};

function feedbackKey(card){
  const title = card.querySelector(".map-card-title");
  return title ? title.textContent.trim() : Math.random().toString(36);
}

function updateWrongCounter(){
  const wrong = Object.values(quizFeedback).filter(v=>v==="wrong").length;
  const el = document.getElementById("wrongCount");
  const btn = document.getElementById("reviewWrongBtn");
  if(el) el.textContent = wrong;
  if(btn) btn.classList.toggle("has-errors", wrong > 0);
}

function applyFeedback(card, value){
  const key = feedbackKey(card);
  quizFeedback[key] = value;

  card.classList.remove("feedback-correct","feedback-wrong");
  const up = card.querySelector(".thumb-up");
  const down = card.querySelector(".thumb-down");
  if(up) up.classList.remove("selected-correct");
  if(down) down.classList.remove("selected-wrong");

  if(value === "correct"){
    card.classList.add("feedback-correct");
    if(up) up.classList.add("selected-correct");
  }else{
    card.classList.add("feedback-wrong");
    if(down) down.classList.add("selected-wrong");
  }

  updateWrongCounter();
}

function wireQuizAfterRender(){
  const cards = document.querySelectorAll(".mindmap-board .map-card");

  cards.forEach(card=>{
    card.classList.remove("quiz-revealed");
    card.onclick = null;
    card.onkeydown = null;

    // Restore feedback for this card if it was already answered in this topic.
    const saved = quizFeedback[feedbackKey(card)];
    card.classList.remove("feedback-correct","feedback-wrong");
    const up = card.querySelector(".thumb-up");
    const down = card.querySelector(".thumb-down");
    if(up) up.classList.remove("selected-correct");
    if(down) down.classList.remove("selected-wrong");

    if(saved === "correct"){
      card.classList.add("feedback-correct");
      if(up) up.classList.add("selected-correct");
    }else if(saved === "wrong"){
      card.classList.add("feedback-wrong");
      if(down) down.classList.add("selected-wrong");
    }

    if(quizMode){
      card.onclick = (e)=>{
        if(e.target.closest(".quiz-feedback")) return;
        e.stopPropagation();
        card.classList.toggle("quiz-revealed");
      };

      card.onkeydown = (e)=>{
        if(e.target.closest(".quiz-feedback")) return;
        if(e.key==="Enter" || e.key===" "){
          e.preventDefault();
          card.classList.toggle("quiz-revealed");
        }
      };

      if(up) up.onclick = (e)=>{
        e.stopPropagation();
        // The answer can be evaluated only after revealing the card.
        if(!card.classList.contains("quiz-revealed")) return;
        applyFeedback(card,"correct");
      };
      if(down) down.onclick = (e)=>{
        e.stopPropagation();
        if(!card.classList.contains("quiz-revealed")) return;
        applyFeedback(card,"wrong");
      };
    }else{
      // Feedback buttons are inert outside quiz mode.
      if(up) up.onclick = null;
      if(down) down.onclick = null;
    }
  });

  const map = document.querySelector(".mindmap-board");
  if(map){
    map.classList.toggle("quiz-active", quizMode);
    map.classList.toggle("review-wrong", quizMode && reviewWrong);
  }
  updateWrongCounter();

  const reviewBtn = document.getElementById("reviewWrongBtn");
  if(reviewBtn) reviewBtn.classList.toggle("reviewing", reviewWrong);
}

function toggleQuiz(){
  quizMode = !quizMode;
  if(!quizMode) reviewWrong = false;

  const btn = document.getElementById("quizBtn");
  if(btn) btn.classList.toggle("quiz-on", quizMode);
  wireQuizAfterRender();
}

function toggleWrongReview(){
  if(!quizMode) {
    quizMode = true;
    const btn = document.getElementById("quizBtn");
    if(btn) btn.classList.add("quiz-on");
  }
  reviewWrong = !reviewWrong;
  wireQuizAfterRender();
}

function openReviewImage(){
  const t = topics[current];
  const modal = document.getElementById("reviewImageModal");
  const title = document.getElementById("reviewImageTitle");
  const body = document.getElementById("reviewImageBody");
  if(!modal || !title || !body) return;

  title.textContent = "Resumo visual — " + t.title;
  const src = REVIEW_IMAGES[t.id];
  if(src){
    body.innerHTML = `<img src="${src}" alt="Resumo visual de ${escapeHtml(t.title)}">`;
  }else{
    body.innerHTML = `<div class="review-image-empty">O resumo visual deste tema ainda não foi cadastrado.</div>`;
  }
  modal.classList.add("open");
  modal.setAttribute("aria-hidden","false");
}

function closeReviewImage(){
  const modal = document.getElementById("reviewImageModal");
  if(!modal) return;
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden","true");
}

function handleReviewImageBackdrop(e){
  if(e.target && e.target.id === "reviewImageModal") closeReviewImage();
}

document.addEventListener("keydown", e=>{
  if(e.key === "Escape"){ closeReviewImage(); closeEmenta(); }
});

function openEmenta(){
  const t = topics[current];
  const e = EMENTAS[t.id];
  const modal = document.getElementById("ementaModal");
  const body = document.getElementById("ementaBody");
  const title = document.getElementById("ementaTitle");
  const subtitle = document.getElementById("ementaSubtitle");
  if(!modal || !body || !title || !subtitle) return;

  title.textContent = t.title;
  subtitle.textContent = e?.foco || "Roteiro de estudo da sessão.";
  if(!e){
    body.innerHTML = `<div class="ementa-section study"><h4>O que revisar</h4><ul><li>Revise os cards e conceitos apresentados nesta sessão.</li></ul></div>`;
  }else{
    body.innerHTML = `
      <section class="ementa-section study">
        <h4>O que você deve saber</h4>
        <ul>${e.saber.map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ul>
      </section>
      <section class="ementa-section">
        <h4>Indicações de materiais</h4>
        <ul>${e.pratica.map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ul>
      </section>
      </section>`;
  }
  modal.classList.add("open");
  modal.setAttribute("aria-hidden","false");
}

function closeEmenta(){
  const modal = document.getElementById("ementaModal");
  if(!modal) return;
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden","true");
}

function handleEmentaBackdrop(e){
  if(e.target && e.target.id === "ementaModal") closeEmenta();
}

function render(){
  const t = topics[current];
  buildNav();
  document.getElementById("pageTitle").textContent = t.title;
  const content = document.getElementById("content");
  content.innerHTML = `<div class="study-canvas">${makeMindmap(t)}</div>`;
  updateProgress();
  wireQuizAfterRender();
}


function showTab(id){
 document.querySelectorAll(".tabpane").forEach(x=>x.classList.add("hide"));
 document.getElementById(id).classList.remove("hide");
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 [...document.querySelectorAll(".tab")].find(x=>x.textContent.toLowerCase().includes(id==="concepts"?"conceitos":id==="formula"?"fórmulas":"sabatina")).classList.add("active");
}
function loadChecks(t){
 document.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
   cb.checked=localStorage.getItem("study-"+cb.dataset.key)==="1";
   cb.addEventListener("change",()=>{
     localStorage.setItem("study-"+cb.dataset.key,cb.checked?"1":"0");
     updateProgress();
   });
 });
 updateProgress();
}

function updateProgress(){
  const total = topics.length;
  const done = topics.reduce((sum,_,i)=>sum + (isTopicReviewed(i) ? 1 : 0), 0);
  const pct = total ? Math.round(done / total * 100) : 0;

  const text = document.getElementById("progressText");
  const bar = document.getElementById("progressBar");
  if(text) text.textContent = pct + "%";
  if(bar) bar.style.width = pct + "%";
}


function toggleMenu(){
  const app = document.querySelector(".app");
  const sidebar = document.getElementById("sidebar");
  if(window.innerWidth <= 800){
    sidebar.classList.toggle("open");
  }else{
    app.classList.toggle("menu-collapsed");
  }
}
function toggleTheme(){
 const dark=document.body.dataset.dark==="1";
 document.body.dataset.dark=dark?"0":"1";
 if(!dark){
  document.documentElement.style.setProperty("--bg","#0e1220");
  document.documentElement.style.setProperty("--panel","#151a2a");
  document.documentElement.style.setProperty("--text","#eef1f8");
  document.documentElement.style.setProperty("--muted","#a8b0c2");
  document.documentElement.style.setProperty("--line","#293149");
 }else location.reload();
}
render();
updateProgress();
