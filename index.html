  ["Quando PCA é útil no Data Prep?","PCA pode ser útil quando existem muitas features numéricas correlacionadas e se deseja uma representação de menor dimensão. Ele cria componentes ortogonais que capturam progressivamente a variância dos dados. É comum fazer scaling antes do PCA quando as variáveis estão em escalas diferentes. A principal desvantagem é a perda de interpretabilidade, pois os componentes são combinações das variáveis originais."],
  ["PCA deve ser aplicado antes ou depois do scaling?","Em geral, depois do scaling quando as variáveis possuem escalas diferentes. Sem isso, uma variável com variância numericamente maior pode dominar os primeiros componentes mesmo sem carregar mais informação relevante. Tanto o scaler quanto o PCA devem ser ajustados apenas no conjunto de treino e, durante cross-validation, dentro do Pipeline de cada fold."],
  ["Como evitar data leakage durante o Data Prep?","Qualquer transformação que aprenda parâmetros com os dados deve ser ajustada somente no treino. Isso inclui imputação, scaling, seleção de features, PCA, target encoding e outras transformações baseadas em estatísticas dos dados. Em cross-validation, o ideal é encapsular essas etapas em um Pipeline, fazendo com que cada fold ajuste o pré-processamento apenas com sua parte de treino."],
  ["O que deve ficar dentro de um Pipeline de machine learning?","Devem ficar dentro do Pipeline as etapas que precisam ser aprendidas a partir dos dados, como imputação, encoding, scaling, PCA, seleção de features e o próprio estimador. Isso garante que Grid Search, Random Search e cross-validation refaçam corretamente o fit dessas etapas em cada fold. Também reduz diferenças entre treinamento e inferência em produção."],
  ["Como você estruturaria o Data Prep para um problema real de fraude?","Eu começaria entendendo a unidade de análise e o momento em que cada informação fica disponível. Depois faria diagnóstico de missing, duplicidades, outliers e distribuição das classes. Evitaria features que usam eventos posteriores à transação, faria encoding e scaling apenas quando necessários e escolheria uma validação compatível com o tempo e possíveis grupos. Por fim, colocaria o pré-processamento em Pipeline e avaliaria o impacto das transformações nas métricas relevantes ao negócio."],
  ["Quando usar padronização e quando usar normalização?", "A padronização transforma os dados para terem média 0 e desvio padrão 1, sendo útil quando as variáveis possuem escalas diferentes e não há necessidade de limitar seus valores. Já a normalização, geralmente pelo Min-Max, transforma os valores para um intervalo definido, como [0, 1], sendo adequada quando o modelo se beneficia de uma escala limitada e os dados não possuem muitos outliers."],
  ["Qual a diferença entre métodos de normalização lineares e não lineares e qual o impacto na distribuição dos dados?", "Os métodos de normalização lineares, como Min-Max Scaling e padronização Z-score, alteram a escala dos dados por meio de transformações lineares ou afins, preservando a ordem e, em geral, a forma da distribuição, sem eliminar sua assimetria. Já os métodos não lineares, como a transformação logarítmica, Box-Cox e Yeo-Johnson, transformam os valores de maneira desigual, comprimindo algumas regiões e expandindo outras, podendo reduzir a assimetria e a influência de valores extremos. A escolha depende da distribuição dos dados e do algoritmo utilizado: métodos baseados em distâncias, como KNN e K-Means, são sensíveis à escala, enquanto árvores de decisão geralmente não precisam de normalização. É importante lembrar que nenhuma transformação garante, por si só, que os dados se tornem normalmente distribuídos."],
  ["O que é Weight of Evidence?", "O Weight of Evidence (WoE) é uma técnica de encoding supervisionado que transforma categorias em valores numéricos com base na relação entre cada categoria e a variável-alvo. É muito utilizado em modelos de risco de crédito para comparar a proporção de bons pagadores e inadimplentes em cada categoria. Assim, o WoE representa o quanto uma categoria está associada a cada classe, sendo frequentemente utilizado com regressão logística."],
  ["Por que não ajustar o encoder no teste?", "Porque isso pode gerar inconsistências entre treino e teste e, dependendo do método, causar vazamento de informação (data leakage). No conjunto de treino, utilizamos o fit para aprender as categorias e o transform para codificá-las. No conjunto de teste, aplicamos apenas o transform usando o encoder já ajustado no treino, garantindo consistência entre os conjuntos e evitando data leakage."]
 ],
},

{
 id:"gd", 
 num:"06", 
 title:"Gradient Descendente", 
 branches:[
  ["O que é Gradient Descent?","É um algoritmo iterativo de otimização que busca minimizar uma função objetivo atualizando os parâmetros na direção oposta ao gradiente. A ideia central é mover os parâmetros para uma região de menor perda."],
  ["Qual é a ideia matemática do Gradient Descent?","Em cada iteração, calculamos o gradiente da função de perda em relação aos parâmetros e fazemos uma atualização na direção oposta à derivada: θ ← θ − η∇J(θ), já que a derivada aponta para a direção de crescimento da função e queremos a queda. η é a taxa de aprendizado."],
  ["O que é o gradiente de uma função?","É o vetor formado pelas derivadas parciais da função em relação aos parâmetros. Ele aponta para a direção de maior crescimento local da função; por isso, usamos o sentido oposto para buscar redução da loss."],
  ["Por que a atualização usa o gradiente negativo?","Porque o gradiente aponta para a direção de maior aumento local da função. Caminhar na direção oposta tende a reduzir a função, desde que o passo seja adequado."],
  ["O que é learning rate?","É o tamanho do passo dado a cada atualização. Um learning rate muito pequeno pode tornar a convergência lenta; um muito grande pode fazer o algoritmo oscilar ou até divergir."],
  ["O que acontece se o learning rate for muito pequeno?","As atualizações ficam pequenas, tornando o treinamento lento e podendo exigir muitas iterações para chegar a uma região próxima do mínimo."],
  ["O que acontece se o learning rate for muito grande?","O algoritmo pode ultrapassar repetidamente o mínimo, oscilar ou divergir em vez de convergir para uma solução adequada."],
  ["O que significa convergência no Gradient Descent?","Significa que as atualizações deixam de produzir mudanças relevantes na função objetivo ou nos parâmetros, indicando que o algoritmo chegou a uma região estável segundo o critério de parada adotado."],
  ["O que é Batch Gradient Descent?","É a versão que calcula o gradiente usando todas as observações do conjunto de treinamento antes de cada atualização. Produz um gradiente mais estável, mas cada passo pode ser computacionalmente caro em bases grandes."],
  ["O que é Stochastic Gradient Descent (SGD)?","É a versão que atualiza os parâmetros usando uma única observação por vez. As atualizações são mais rápidas e ruidosas, podendo ajudar a escapar de regiões problemáticas, mas a trajetória é mais instável."],
  ["O que é Mini-Batch Gradient Descent?","É a abordagem intermediária: cada atualização usa um pequeno lote de observações. É muito usada na prática porque equilibra eficiência computacional, estabilidade do gradiente e uso de hardware paralelo."],
  ["Qual é a diferença entre Batch, Stochastic e Mini-Batch Gradient Descent?","Batch usa todo o dataset por atualização; SGD usa uma observação; Mini-Batch usa pequenos subconjuntos. A principal diferença está no custo, no ruído do gradiente e na eficiência computacional."],
  ["Qual é o papel do scaling no Gradient Descent?","Scaling pode ser muito importante porque features em escalas muito diferentes podem deixar a superfície de otimização mal condicionada. Padronização costuma tornar os passos mais equilibrados e acelerar a convergência."],
  ["O Gradient Descent sempre encontra o mínimo global?","Não. Em funções convexas, como a perda quadrática sob condições adequadas, um mínimo global pode ser encontrado. Em funções não convexas, como as de redes neurais, o algoritmo pode encontrar mínimos locais ou pontos de sela, e a garantia global não existe em geral."],
  ["Qual é a diferença entre mínimo local e mínimo global?","Mínimo local é uma região em que pequenas perturbações não reduzem a função. Mínimo global é o menor valor da função em todo o domínio."],
  ["O que é uma função convexa e por que isso importa?","Em uma função convexa, qualquer mínimo local também é global. Isso torna a otimização mais previsível. Em problemas convexos, a escolha adequada do passo pode levar ao mínimo global."],
  ["Como o Gradient Descent é usado na regressão linear?","A loss, normalmente MSE, é definida em função dos coeficientes. O algoritmo calcula as derivadas da loss em relação aos coeficientes e os atualiza iterativamente até atingir um critério de convergência."],
  ["Como o Gradient Descent aparece na regressão logística?","Os coeficientes são ajustados para minimizar uma loss de classificação, normalmente a log-loss/cross-entropy. O gradiente indica como cada coeficiente deve ser alterado para reduzir essa perda."],
  ["Como o Gradient Descent aparece nas redes neurais?","A backpropagation calcula os gradientes da loss em relação aos pesos usando a regra da cadeia. O Gradient Descent ou uma variante usa esses gradientes para atualizar os pesos."],
  ["Quais são critérios de parada comuns no Gradient Descent?","Pode-se parar após um número máximo de épocas/iterações, quando a redução da loss fica abaixo de um limite, quando a norma do gradiente fica pequena ou quando uma métrica de validação deixa de melhorar."],
  ["O que é early stopping?","É interromper o treinamento quando o desempenho em um conjunto de validação deixa de melhorar por determinado número de iterações. Pode reduzir custo computacional e ajudar a evitar overfitting."],
  ["Quais problemas podem ocorrer durante a otimização?","Learning rate inadequado, gradientes muito pequenos ou grandes, superfície mal condicionada, oscilações, convergência lenta e, em problemas não convexos, pontos de sela ou mínimos locais são exemplos de dificuldades."],
  ["O que são vanishing e exploding gradients?","Vanishing gradients ocorrem quando os gradientes ficam muito pequenos e as atualizações se tornam lentas ou praticamente param. Exploding gradients ocorrem quando os gradientes ficam muito grandes, causando atualizações instáveis."],
  ["Como podemos melhorar a convergência do Gradient Descent?","Podemos ajustar o learning rate, fazer scaling, escolher mini-batches adequados e usar otimizadores adaptativos ou com momentum, como Momentum, RMSProp e Adam, dependendo do problema."],
  ["O que é Momentum no Gradient Descent?","É uma técnica que acumula parte do movimento das atualizações anteriores, ajudando a acelerar a trajetória em direções consistentes e reduzir oscilações em direções com gradientes conflitantes."],
  ["O que é Adam?","Adam é um otimizador que combina ideias de momentum e adaptação da taxa de aprendizado por parâmetro, usando estimativas dos primeiros e segundos momentos dos gradientes. É muito usado no treinamento de redes neurais."],
  ["Como escolher o learning rate na prática?","Pode-se testar uma faixa de valores em validação, usar um learning-rate scheduler ou estratégias de busca. O valor adequado depende da escala dos dados, arquitetura/modelo, loss e otimizador."],
  ["Como validar se o Gradient Descent encontrou o mínimo global?","Não é possível garantir apenas pela convergência que o Gradient Descent encontrou o mínimo global. Para verificar, podemos analisar a convergência da função de custo, observar se o gradiente se aproxima de zero e repetir o treinamento com diferentes valores iniciais e taxas de aprendizado, comparando os resultados. "]
],
},

{id:"regularizacao",
num:"07",
title:"Regularização",
branches:[
  ["O que é regularização em Machine Learning?","É uma técnica que adiciona uma penalização à função objetivo para controlar a complexidade do modelo e reduzir overfitting, aceitando algum aumento de viés em troca de menor variância."],
  ["Por que a regularização pode reduzir overfitting?","Ela restringe soluções excessivamente complexas, reduzindo a sensibilidade do modelo ao ruído e a particularidades da amostra de treinamento."],
  ["O que é a Ridge Regression?","A Ridge Regression é uma regressão linear regularizada que utiliza a penalização L2, adicionando à função de custo a soma dos quadrados dos coeficientes do modelo multiplicada por um parâmetro \(\lambda\). Dessa forma, o algoritmo busca minimizar tanto o erro das previsões quanto a magnitude dos coeficientes, fazendo com que eles sejam reduzidos em direção a zero, mas geralmente sem se tornarem exatamente zero. Essa penalização ajuda a reduzir o overfitting, controlar a variância e lidar com multicolinearidade, especialmente quando existem variáveis explicativas altamente correlacionadas. Quanto maior o \(\lambda\), maior a penalização aplicada aos coeficientes, podendo aumentar o viés do modelo."],
  ["Qual é a fórmula da Ridge Regression?","β̂ = argminβ [ Σᵢ(yᵢ − xᵢᵀβ)² + λΣⱼβⱼ² ]. O primeiro termo mede o erro de ajuste e o segundo penaliza a magnitude dos coeficientes. λ controla a força da regularização, λ = 0 recupera a regressão sem regularização. À medida que λ aumenta, os coeficientes sofrem maior shrinkage."],
  ["O que é a Lasso Regression?","A Lasso Regression é uma regressão linear regularizada que utiliza a penalização L1, adicionando à função de custo a soma dos valores absolutos dos coeficientes do modelo multiplicada por um parâmetro \(\lambda\). Essa penalização reduz a magnitude dos coeficientes e pode fazer com que alguns se tornem exatamente zero, eliminando efetivamente variáveis do modelo. Por isso, além de ajudar a reduzir o overfitting, a Lasso realiza seleção automática de atributos (feature selection). Quanto maior o \(\lambda\), maior a penalização e maior a tendência de o modelo manter menos variáveis, embora isso possa aumentar o viés."],
  ["Qual é a fórmula da Lasso Regression?","β̂ = argminβ [ Σᵢ(yᵢ − xᵢᵀβ)² + λΣⱼ|βⱼ| ]. O termo Σ|βⱼ| é a penalização L1 e λ determina sua intensidade."],
  ["Qual é a diferença entre Ridge e Lasso?","Ridge usa uma penalização L2, cuja derivada é proporcional ao próprio coeficiente e tende suavemente a zero. Já o Lasso usa L1, que possui uma não diferenciabilidade em zero e um subgradiente que permite que o ótimo ocorra exatamente em β = 0. Por isso, Lasso pode realizar seleção de variáveis, enquanto Ridge normalmente apenas reduz os coeficientes."],
  ["Como a geometria explica a diferença entre Ridge e Lasso?","Na formulação equivalente com restrição, Ridge possui uma região aproximadamente circular, enquanto Lasso possui uma região com cantos. Esses cantos favorecem soluções em que alguns coeficientes ficam exatamente em zero."],
  ["Por que o scaling é importante em Ridge e Lasso?","A penalização atua sobre os coeficientes. Se as features estiverem em escalas muito diferentes, a regularização pode afetá-las de forma desigual. Por isso, é comum padronizar as features antes do modelo."],
  ["O intercepto deve ser regularizado?","Não. Em geral, o intercepto não é regularizado, tanto na Ridge quanto na Lasso Regression. A penalização é aplicada aos coeficientes das variáveis explicativas, pois o objetivo é controlar sua magnitude ou selecionar variáveis, sem penalizar o valor-base da previsão. O intercepto representa o valor previsto de y quando todas as variáveis explicativas são iguais a zero. Regularizá-lo poderia deslocar esse valor-base sem trazer o benefício desejado."],
  ["Como Ridge e Lasso lidam com multicolinearidade?","Ridge tende a ser útil porque reduz conjuntamente coeficientes de variáveis correlacionadas. Lasso pode selecionar uma variável e zerar outras correlacionadas, e essa seleção pode ser instável."],
  ["Como escolher λ?","λ é um hiperparâmetro e deve ser escolhido usando validação, normalmente cross-validation, com uma métrica alinhada ao objetivo."],
  ["O que acontece se λ for muito pequeno?","A penalização terá pouca influência e o modelo se aproxima da solução sem regularização, podendo não controlar suficientemente a variância."],
  ["O que acontece se λ for muito grande?","Os coeficientes são fortemente encolhidos e o modelo pode ficar simples demais, levando a underfitting."],
  ["Qual é a relação entre regularização e o trade-off entre viés e variância?","A regularização normalmente aumenta o viés e reduz a variância. O objetivo é encontrar um nível de complexidade que minimize o erro de generalização, não o erro de treino."],
  ["Quando usar Elastic Net?","Quando queremos combinar características de Ridge e Lasso. Ele utiliza uma combinação das penalizações L1 e L2 e pode ser útil com muitas features correlacionadas."],
  ["Qual é a fórmula do Elastic Net?","Uma forma de escrever é: β̂ = argminβ [ Loss(β) + λ(αΣⱼ|βⱼ| + (1−α)Σⱼβⱼ²) ]. α controla a mistura entre L1 e L2."],
  ["Regularização é a mesma coisa que reduzir features?","Não. Regularização modifica a função objetivo para controlar os parâmetros. Lasso pode produzir seleção de features como consequência de zerar coeficientes, mas isso é diferente de remover variáveis antes do treinamento."],
  ["Como a regularização afeta a interpretabilidade?","Ridge mantém mais variáveis, mas reduz a magnitude dos coeficientes. Lasso pode produzir modelos mais esparsos, embora a seleção possa ser instável quando existem features fortemente correlacionadas."],
  ["Como implementar Ridge e Lasso de forma segura?","Use um Pipeline com o pré-processamento, como StandardScaler, seguido do estimador regularizado. A escolha de λ deve ocorrer dentro da validação para evitar leakage."],
  ["Como escolher entre Ridge, Lasso e Elastic Net?","Ridge é uma opção natural quando queremos shrinkage e estabilidade diante de multicolinearidade; Lasso quando esparsidade é desejada; Elastic Net quando queremos combinar L1 e L2. A decisão final deve ser validada empiricamente."],
  ["O que é shrinkage?", "É o processo de reduzir (“encolher”) os valores dos coeficientes de um modelo em direção a zero, geralmente por meio de regularização."]
],
},

{
 id:"naivebayes", 
 num:"08", 
 title:"Naive Bayes",
 branches:[
  ["O que é o Naive Bayes e em que tipo de problema ele é usado?","É um modelo probabilístico de classificação. Para cada classe, estima a probabilidade posterior P(y|x) e escolhe a classe com maior probabilidade."],
  ["O que é o Teorema de Bayes?","É uma forma de atualizar uma probabilidade após observar evidências: P(A|B)=P(B|A)P(A)/P(B). No modelo, usamos evidências das features para atualizar a probabilidade das classes."],
  ["Qual é a lógica do Naive Bayes?","Para cada classe, combina o prior P(y) com as probabilidades das features condicionadas à classe. A classe escolhida é a que maximiza P(y|x)."],
  ["Por que o modelo é chamado de 'Naive'?","Porque assume que as features são condicionalmente independentes entre si dado o target: P(x₁,...,xₚ|y)=ΠⱼP(xⱼ|y). É uma simplificação forte, mas torna o cálculo muito mais simples."],
  ["O que são prior, likelihood e posterior no Naive Bayes?","Prior é P(y), a probabilidade da classe antes das features. Likelihood é P(x|y), a compatibilidade das features com a classe. Posterior é P(y|x), a probabilidade atualizada após observar as features."],
  ["Por que a hipótese de independência pode funcionar mesmo sendo irrealista?","A hipótese de independência do Naive Bayes pode funcionar mesmo sendo irrealista porque o objetivo principal da classificação é identificar a classe mais provável, e não necessariamente estimar probabilidades perfeitamente. Mesmo quando as variáveis são correlacionadas, a suposição de independência pode preservar a ordem relativa das probabilidades entre as classes e levar à classificação correta."],
  ["Quais são as principais variações do Naive Bayes?","GaussianNB, para features contínuas modeladas por distribuição Normal; MultinomialNB, para contagens ou frequências; BernoulliNB, para features binárias. Há ainda variantes para outros tipos de distribuição."],
  ["Quando usar Gaussian Naive Bayes?","Quando as features são contínuas e a hipótese de uma distribuição aproximadamente Normal dentro de cada classe é razoável. É uma opção rápida para dados numéricos."],
  ["Quando usar Multinomial Naive Bayes?","É muito usado com contagens ou frequências não negativas, especialmente classificação de texto com bag-of-words ou TF-IDF, dependendo da representação adotada."],
  ["Quando usar Bernoulli Naive Bayes?","Quando cada feature representa presença/ausência ou outro indicador binário. Em texto, pode representar se uma palavra apareceu ou não no documento."],
  ["Qual é a fórmula central do Naive Bayes?","Sob a hipótese de independência condicional, P(y|x) ∝ P(y) × ΠⱼP(xⱼ|y). O termo P(x) é comum às classes e pode ser omitido na comparação."],
  ["O que é Laplace smoothing e por que ele é importante?","É uma técnica de suavização que adiciona uma pequena quantidade às contagens. Evita probabilidades zero quando uma combinação feature-classe não apareceu no treino."],
  ["Como a máxima verossimilhança aparece no Naive Bayes?","No treinamento, estimamos os parâmetros das distribuições condicionais P(xⱼ|y) por máxima verossimilhança. Em outras palavras, escolhemos os parâmetros que tornam os dados observados mais prováveis sob cada classe. Por exemplo, no GaussianNB estimamos média e variância de cada feature dentro de cada classe; no MultinomialNB, as probabilidades das categorias/termos a partir das contagens."] ,
  ["O Naive Bayes precisa de tratamento de dados?","Sim. O tratamento depende da variante: verificar tipos, valores ausentes, representação das categóricas, valores negativos quando a variante não os aceita e escala/distribuição quando relevante. Não é correto assumir que o modelo dispensa preparação."],
  ["Como o Naive Bayes lida com valores faltantes?","Em geral, não se deve simplesmente passar NaNs sem verificar a implementação. Pode ser necessário imputar, remover observações ou usar uma estratégia compatível com a variante. A imputação deve ser aprendida apenas no treino para evitar leakage."],
  ["Como o Naive Bayes lida com outliers?","Depende da variante. GaussianNB pode ser afetado porque a estimativa de média e variância por classe pode sofrer influência de valores extremos. Vale investigar outliers e, quando fizer sentido, tratá-los ou usar transformações robustas."],
  ["Como o Naive Bayes lida com dados categóricos?","Categóricas precisam ser representadas de forma compatível com o modelo. One-Hot pode ser usado em algumas variantes, enquanto categorias discretas podem ser tratadas diretamente por modelos como CategoricalNB."],
  ["O que é Categorical Naive Bayes e quando usar?","CategoricalNB é apropriado quando as features são categóricas discretas. Ele estima a distribuição das categorias por classe, evitando transformar necessariamente cada categoria em uma coluna binária."],
  ["O Naive Bayes precisa de scaling?","Normalmente não. Como o modelo não calcula distâncias, não existe a mesma necessidade de padronização que há em KNN ou SVM. Entretanto, transformações podem ser úteis conforme a distribuição e a variante utilizada."],
  ["Como o Naive Bayes lida com dados desbalanceados?","Ele incorpora as frequências das classes no prior, portanto uma classe majoritária pode receber maior probabilidade inicial. Em cenários desbalanceados, é importante avaliar métricas adequadas e, se necessário, ajustar priors, amostragem ou estratégia de decisão."],
  ["O Naive Bayes tende a overfitting ou underfitting?","Por ter uma estrutura simples e uma hipótese forte de independência, frequentemente apresenta baixo custo computacional e boa capacidade de generalização, mas pode sofrer underfitting quando as dependências entre features são importantes. Overfitting pode ocorrer, embora seja menos comum que em modelos muito flexíveis."],
  ["Quais são as principais vantagens do Naive Bayes?","É simples, rápido para treinar e prever, funciona bem com alta dimensionalidade, requer poucos dados para estimar parâmetros e costuma ser uma ótima baseline. Também é especialmente eficiente em algumas aplicações de texto."],
  ["Quais são as principais desvantagens do Naive Bayes?","A hipótese de independência pode ser inadequada, probabilidades podem ser mal calibradas e o modelo pode perder desempenho quando interações entre features são essenciais. A qualidade também depende da distribuição assumida pela variante."],
  ["Quando o Naive Bayes é uma boa escolha?","Quando há alta dimensionalidade, necessidade de treinamento rápido, poucos recursos computacionais, dados de texto ou uma baseline probabilística simples. É útil quando a simplicidade e a velocidade são importantes."],
  ["Quando evitar o Naive Bayes?","Quando as relações entre features são fortemente dependentes e essas interações são essenciais para a decisão, ou quando probabilidades muito bem calibradas são requisito sem uma etapa adicional de calibração."],
  ["Como o Naive Bayes se comporta em alta dimensionalidade?","Costuma lidar bem com muitas features porque estima distribuições de forma relativamente simples e não precisa estimar interações entre todas elas. Por isso é tradicionalmente forte em classificação de texto."],
  ["Qual seria um exemplo de aplicação do Naive Bayes?","Classificação de spam, categorização de documentos, análise de texto e classificação rápida de tickets. Em texto, as variantes Multinomial e Bernoulli são especialmente conhecidas."],
  ["Qual é a principal diferença entre Naive Bayes e regressão logística?","Naive Bayes modela a distribuição das features condicionada à classe e aplica Bayes. A regressão logística modela diretamente o log-odds da classe como função das features. Ambos podem ser fortes em classificação, mas fazem suposições diferentes."],
  ["O que é Complement Naive Bayes?", "O Complement Naive Bayes (CNB) é uma variação do Naive Bayes desenvolvida especialmente para melhorar a classificação de textos, principalmente em conjuntos de dados desbalanceados. Em vez de estimar as características de uma classe usando apenas os documentos que pertencem a ela, o CNB utiliza as estatísticas dos documentos das outras classes (o complemento) para calcular os pesos das palavras. Isso ajuda a reduzir o viés causado por classes com frequências muito diferentes."],
  ["O que é o problema do Estouro Negativo?", "O estouro negativo (underflow) ocorre quando o computador calcula um número tão pequeno que sua representação numérica fica próxima de zero e acaba sendo arredondada para zero. No Naive Bayes, isso pode acontecer porque multiplicamos muitas probabilidades pequenas para calcular a verossimilhança de uma observação. Para evitar esse problema, utilizamos o logaritmo das probabilidades, que transforma multiplicações em somas e permite realizar os cálculos numericamente de forma mais estável."],
  ["Naive Bayes é ruim de calibragem?", "Sim, o Naive Bayes costuma apresentar problemas de calibração, especialmente porque sua hipótese de independência entre as features pode levar a probabilidades previstas excessivamente confiantes. Isso acontece porque o Naive Bayes calcula probabilidades a partir da hipótese de independência condicional entre as features. Quando elas são correlacionadas, o modelo pode contabilizar evidências relacionadas mais de uma vez, tornando as probabilidades extremas. Para melhorar a calibração, podemos usar técnicas como Platt Scaling ou Isotonic Regression, ajustadas com dados de validação independentes dos usados para treinar o modelo."]
 ],
},

{
  id:"linear",
  num:"09",
  title:"Regressão Linear",
  branches:[
    ["O que é Regressão Linear?","É um modelo supervisionado que estima uma variável-alvo contínua como uma combinação linear dos preditores. Na regressão linear múltipla, a previsão pode ser escrita como ŷ = β₀ + β₁x₁ + ... + βₚxₚ."],
    ["Qual é o formato da função de Regressão Linear?","A função assume a forma ŷ = β₀ + β₁x₁ + ... + βₚxₚ. O modelo é linear nos parâmetros β, mesmo que seja possível incluir transformações das features, como x² ou log(x), desde que os parâmetros continuem entrando linearmente."],
    ["O que representam β₀ e βⱼ na Regressão Linear?","β₀ é o intercepto: o valor esperado de y quando os preditores são zero. βⱼ representa a variação esperada de y associada a uma unidade adicional em xⱼ, mantendo os demais preditores constantes."],
    ["Como os coeficientes são estimados pelo método dos mínimos quadrados?","O Ordinary Least Squares (OLS) escolhe os coeficientes que minimizam a soma dos quadrados dos resíduos: Σᵢ(yᵢ − ŷᵢ)². A ideia é encontrar a reta que produz o menor erro quadrático total no conjunto de treino."],
    ["Por que o erro é elevado ao quadrado no OLS?","O quadrado torna erros positivos e negativos comparáveis, penaliza mais fortemente erros grandes e produz uma função objetivo diferenciável e convexa no caso linear, permitindo uma solução ótima global sob as condições usuais."],
    ["Quais são as principais premissas da Regressão Linear?","Para o modelo e, principalmente, para a inferência clássica, é importante avaliar: relação linear nos parâmetros, independência das observações/erros, ausência de multicolinearidade perfeita, homoscedasticidade e, para inferência exata em pequenas amostras, normalidade dos erros."],
    ["O que significa linearidade na Regressão Linear?","Significa que a esperança condicional de y pode ser representada linearmente nos parâmetros. Não significa necessariamente que cada relação individual precise ser uma reta: transformações e termos polinomiais podem representar relações curvas mantendo o modelo linear nos coeficientes."],
    ["O que significa independência dos erros?","Os resíduos de uma observação não devem depender sistematicamente dos resíduos de outras observações. Dependências podem invalidar erros-padrão usuais e prejudicar a generalização."],
    ["O que é homoscedasticidade?","É a condição em que a variância dos erros é aproximadamente constante ao longo dos valores previstos ou das features. Heteroscedasticidade não necessariamente torna os coeficientes OLS enviesados sob condições adequadas, mas pode tornar os erros-padrão e testes de hipótese usuais incorretos."],
    ["O que é normalidade dos resíduos e quando ela é necessária?","A normalidade dos erros é uma suposição útil para inferência exata de coeficientes, especialmente em amostras pequenas. Ela não é uma exigência para usar OLS como método preditivo, e grandes amostras podem permitir inferência aproximada por resultados assintóticos."],
    ["O que é multicolinearidade e por que ela é um problema?","É a presença de forte dependência linear entre preditores. Ela aumenta a variância das estimativas dos coeficientes, pode torná-las instáveis e dificulta a interpretação individual das features. Correlação entre features e VIF podem ajudar no diagnóstico."],
    ["O que acontece quando há multicolinearidade perfeita?","A matriz de desenho deixa de ter posto completo e os coeficientes não são identificáveis de forma única pelo OLS. É necessário remover, combinar ou transformar variáveis, ou utilizar métodos regularizados."],
    ["Como os outliers afetam a Regressão Linear?","Como o OLS minimiza erros ao quadrado, observações com resíduos muito grandes podem exercer influência desproporcional sobre a estimação. Um outlier em x também pode ter alta alavancagem. É importante distinguir erro de medição de observação legítima."],
    ["Qual é a diferença entre outlier, leverage e ponto influente?","Outlier é uma observação com valor atípico, frequentemente no eixo da resposta. Leverage é uma observação com valores de preditores muito afastados do centro dos demais. Um ponto influente é aquele cuja presença pode alterar significativamente os coeficientes ou as previsões."],
    ["Como fazer análise de resíduos em uma Regressão Linear?","Eu avaliaria resíduos versus valores ajustados, resíduos versus cada preditor, distribuição dos resíduos e, quando necessário, autocorrelação. Procuro padrões, curvatura, variância crescente e pontos influentes. O objetivo é verificar se há estrutura que o modelo deixou de explicar."],
    ["O que um gráfico de resíduos versus valores ajustados pode revelar?","Uma nuvem aproximadamente aleatória em torno de zero é compatível com um bom ajuste estrutural. Curvatura sugere não linearidade; formato de funil sugere heteroscedasticidade; grupos ou padrões podem indicar variáveis omitidas, dependência ou especificação inadequada."],
    ["O que significa alto viés em uma Regressão Linear?","Um modelo linear pode apresentar alto viés quando a relação real é mais complexa do que a estrutura que ele consegue representar. Isso aparece como erro elevado tanto no treino quanto na validação. Transformações, interações ou um modelo mais flexível podem reduzir esse viés."],
    ["Como identificar underfitting em Regressão Linear?","Um sinal é desempenho ruim no treino e também em validação/teste. Pode ocorrer quando a relação real é não linear, faltam features relevantes ou o modelo está excessivamente restrito."],
    ["A Regressão Linear pode sofrer overfitting?","Sim. Apesar de ser simples, pode overfit quando há muitas features em relação ao número de observações, features muito flexíveis/derivadas, interações ou alta dimensionalidade. Regularização pode ajudar."],
    ["Como a regularização é aplicada à Regressão Linear?","Ridge adiciona uma penalização L2 aos coeficientes; Lasso adiciona L1; Elastic Net combina as duas. Essas penalizações restringem a magnitude dos coeficientes e podem melhorar a generalização."],
    ["Qual é a diferença entre Ridge e Lasso na Regressão Linear?","Ridge tende a encolher os coeficientes sem zerá-los, sendo útil em presença de multicolinearidade. Lasso pode zerar coeficientes e produzir um modelo esparso, funcionando também como seleção de variáveis."],
    ["A Regressão Linear precisa de scaling?","OLS sem regularização não exige scaling para produzir as mesmas previsões, embora a escala altere a magnitude e a interpretação dos coeficientes. Scaling é especialmente importante quando usamos regularização, porque a penalização depende da escala dos coeficientes."],
    ["Como tratar variáveis categóricas na Regressão Linear?","Variáveis categóricas precisam ser representadas numericamente. Para categorias nominais, One-Hot Encoding é uma opção comum, escolhendo uma referência para evitar redundância perfeita. O encoding deve ser ajustado apenas no treino."],
    ["Como tratar valores ausentes?","O OLS tradicional não aceita missing values diretamente. É necessário remover ou imputar os valores de acordo com o contexto, ajustando qualquer imputador somente no treino para evitar leakage."],
    ["Qual é a diferença entre correlação e coeficiente da regressão?","Correlação mede associação entre duas variáveis em uma escala padronizada. O coeficiente de regressão representa o efeito estimado de uma feature sobre o target mantendo as demais constantes. Nenhum deles, por si só, estabelece causalidade."],
    ["Como validar uma Regressão Linear corretamente?","Separaria um conjunto de teste final e usaria validação cruzada no conjunto de desenvolvimento quando apropriado."],
    ["Como interpretar um modelo com bom R² no treino e ruim no teste?","É um sinal de possível overfitting, leakage no processo de desenvolvimento, mudança de distribuição ou amostra de teste pouco representativa. Eu investigaria a separação dos dados, a estabilidade das features e a estratégia de validação."],
    ["Quando a Regressão Linear é uma boa escolha?","Quando a relação pode ser aproximada adequadamente por uma função linear nos parâmetros, quando interpretabilidade é importante e quando o custo computacional baixo é uma vantagem. Também é um excelente baseline."],
    ["Quais são as principais vantagens da Regressão Linear?","É simples, rápida, interpretável, possui solução bem estudada, permite inferência sob hipóteses adequadas e funciona muito bem como baseline quando a estrutura linear é razoável."],
    ["Quais são as principais limitações da Regressão Linear?","Pode apresentar alto viés quando a relação é não linear, é sensível a outliers, sofre com multicolinearidade e depende de cuidados com a estrutura dos resíduos para inferência. Também pode exigir engenharia de features para representar interações e não linearidades."],
    ["Como saber a importância de uma variável em Regressão Linear?", "A importância de uma variável pode ser avaliada pelos coeficientes, pelos coeficientes padronizados e pelos testes estatísticos. O coeficiente β indica quanto a variável dependente tende a variar quando a variável explicativa aumenta uma unidade, mantendo as demais constantes. Para comparar a importância entre variáveis com escalas diferentes, podemos padronizar as variáveis e comparar os coeficientes padronizados em valor absoluto. Também podemos analisar os p-valores e os intervalos de confiança para avaliar a evidência estatística de cada coeficiente. Quando há multicolinearidade, métodos como Permutation Importance podem complementar a análise."],
    ["Como o teste de hipóteses é usado para validar importância da variável?", "Para avaliar se existe evidência estatística de que o coeficiente de uma variável é diferente de zero, considerando as demais variáveis do modelo. Para isso, testamos a hipótese nula H0:β=0, que indica ausência de efeito linear daquela variável, contra a hipótese alternativa H1:β <> 0. Se o p-valor for menor que o nível de significância adotado, rejeitamos a H0 e concluímos que há evidência estatística de associação entre a variável e o target, controlando pelas demais variáveis."],
    ["Regressão Linear é um modelo paramétrico?", "Regressão Linear é um modelo paramétrico, pois assume uma estrutura matemática definida e aprende um conjunto finito de parâmetros, como os coeficientes β, a partir dos dados. Esses parâmetros representam os interceptos e os efeitos lineares das variáveis explicativas sobre o target"],
    ["Qual o custo computacional do modelo de Regressão Linear?", "Depende do método utilizado para estimar os coeficientes. Pelo método dos mínimos quadrados com solução analítica o custo é aproximadamente O(np^2+p^3), em que n = núm. de observações e p = núm. variáveis explicativas; quando p é muito grande, a decomposição da matriz pode se tornar custosa. Já o Gradient Descent tem custo aproximado de O(np) por iteração, considerando uma atualização para todas as observações, e o custo total depende da quantidade de iterações necessárias para convergir."]
  ],
},

{
 id:"logistica", 
 num:"10", 
 title:"Regressão Logística",
 branches:[
  ["O que é regressão logística e qual problema ela resolve?","É um modelo supervisionado usado principalmente para classificação. Na versão binária, estima P(y=1|x) entre 0 e 1 e depois um threshold transforma a probabilidade em classe."],
  ["O modelo lida com problemas de classificação ou regressão?","Classificação. Pode ser usada para classificação binária e, por extensões como multinomial/softmax ou estratégias one-vs-rest, para múltiplas classes. Ela parte de uma regressão linear, mas aplica uma transformação na saída para que o resultado seja uma classe."],
  ["Como funciona matematicamente a regressão logística?","Primeiro calcula z = β₀ + βᵀx. Depois aplica a função sigmoide σ(z)=1/(1+e^(−z)), obtendo uma probabilidade entre 0 e 1 para a classe positiva."],
  ["Qual é o papel da função sigmoide na regressão logística?","A sigmoide transforma o valor linear z = β₀ + βᵀx em um número entre 0 e 1, permitindo interpretá-lo como probabilidade da classe positiva."],
  ["Por que não podemos modelar as probabilidades diretamente com uma regressão linear?","Porque uma regressão linear pode produzir valores menores que 0 ou maiores que 1, que não são probabilidades válidas. Por isso, calcula-se as odds, que vão de 0 a infinito, e aplica o logaritmo log(odds) para que o intervalo fique entre −∞ a +∞ e, portanto, linearmente modelável."],
  ["O que são log-odds?","Odds são p/(1−p), isto é, a razão entre a chance do evento ocorrer e não ocorrer. Log-odds, ou logit, é log(p/(1−p)). Na regressão logística, o logit é modelado linearmente pelas features."],
  ["Como interpretar um coeficiente βⱼ?","Mantendo as demais variáveis constantes, βⱼ representa a variação esperada nos log-odds quando xⱼ aumenta uma unidade. βⱼ positivo aumenta a chance da classe positiva; βⱼ negativo reduz."],
  ["Como interpretar exp(βⱼ) em regressão logística?","exp(βⱼ) é a razão de chances (odds ratio) associada ao aumento de uma unidade em xⱼ, mantendo as demais variáveis constantes. Valor >1 aumenta as odds; <1 reduz; =1 indica ausência de efeito nas odds."],
  ["Quais são as premissas da regressão logística sobre os dados?","Não exige normalidade dos preditores nem homocedasticidade como a regressão linear. Pressupõe observações independentes, relação aproximadamente linear entre cada preditor contínuo e o logit, ausência de multicolinearidade severa e ausência de pontos excessivamente influentes."],
  ["O que significa linearidade no logit?","A relação que precisa ser aproximadamente linear não é entre x e a probabilidade diretamente, mas entre os preditores e o logit: log(p/(1−p)) = β₀ + βᵀx. Relações não lineares podem exigir transformações, splines ou termos polinomiais."],
  ["Há necessidade de tratamento de dados antes da regressão logística?","Sim. É necessário avaliar missing values, categorias, outliers, duplicidades, escalas, multicolinearidade e qualidade das variáveis. Também é importante separar treino e teste antes de ajustar transformações para evitar leakage."],
  ["A regressão logística precisa de scaling?","Não é matematicamente obrigatório, mas frequentemente é recomendado, principalmente quando as features estão em escalas muito diferentes, há regularização ou se deseja melhorar a estabilidade numérica e tornar a comparação dos coeficientes mais coerente."],
  ["Como a regressão logística lida com variáveis categóricas?","Não recebe categorias nominais diretamente. É necessário codificá-las, normalmente com One-Hot Encoding. Para categorias ordinais, uma codificação ordinal pode ser adequada quando a ordem tem significado real. O encoding deve ser ajustado somente no treino."],
  ["Como o modelo lida com valores faltantes?","A regressão logística não trata missing values automaticamente. É necessário imputar ou tratar esses valores antes do treinamento."],
  ["Como a regressão logística lida com outliers?","Pode ser sensível a outliers e principalmente a pontos de alta alavancagem/influência, porque eles podem alterar significativamente os coeficientes. É necessário investigar se são erros, casos raros legítimos ou sinais importantes; não se deve removê-los automaticamente."],
  ["Existe problema de underfitting ou overfitting na regressão logística?","Sim. Por ser um modelo relativamente simples, pode sofrer underfitting quando a fronteira real é muito complexa. Também pode sofrer overfitting, especialmente com muitas features, poucos dados, multicolinearidade ou classes separáveis, situação em que a regularização ajuda."],
  ["A regressão logística precisa de regularização?","Não obrigatoriamente, mas regularização é muito útil para controlar complexidade e melhorar generalização. L2 reduz os coeficientes e é uma escolha comum; L1 pode zerar coeficientes e produzir seleção esparsa de features. A intensidade deve ser ajustada por validação."],
  ["Como a regressão logística é treinada?","Tipicamente por máxima verossimilhança, que equivale a minimizar a log-loss ou cross-entropy. Métodos baseados em gradiente podem ser usados para encontrar os coeficientes."],
  ["O que é o threshold e qual seu impacto?","É o limite usado para transformar a probabilidade estimada em classe. Com threshold 0,5, probabilidades acima desse valor são classificadas como positivas. Reduzi-lo tende a aumentar recall e FP; aumentá-lo tende a reduzir FP e aumentar FN, dependendo dos dados."],
  ["Como escolher o threshold em um problema de negócio?","Não deveria ser escolhido automaticamente como 0,5. Deve considerar custos de falsos positivos e falsos negativos, capacidade operacional e objetivo do negócio. Pode ser definido usando uma métrica ou função de custo validada em dados que não participaram do treinamento."],
  ["Como avaliar uma regressão logística em dados desbalanceados?","Acurácia isolada pode ser enganosa. É importante analisar matriz de confusão, precision, recall, F1, PR-AUC e ROC-AUC, escolhendo as métricas conforme o custo de FP e FN. O threshold também deve ser avaliado explicitamente."],
  ["O que é separação perfeita e por que ela é um problema?","Acontece quando uma combinação das features separa perfeitamente as classes. Os coeficientes podem crescer muito em magnitude e a estimativa por máxima verossimilhança não converge para valores finitos. Regularização ou revisão das features pode ajudar."],
  ["Como a multicolinearidade afeta a regressão logística?","Features muito correlacionadas tornam os coeficientes instáveis, aumentam sua variância e dificultam a interpretação individual. O modelo pode ter dificuldade em escolher qual feature tem mais peso no efeito aprendido."],
  ["Quais são as principais vantagens da regressão logística?","É interpretável, estima probabilidades, treina rapidamente, funciona bem como baseline, permite regularização e tem boa transparência para explicar decisões. Seus coeficientes também permitem analisar a associação entre features e o log-odds da classe positiva."],
  ["Quais são as principais desvantagens da regressão logística?","A fronteira de decisão é linear no espaço das features e o modelo depende de uma relação aproximadamente linear entre as features e o logit. Também pode sofrer com multicolinearidade, outliers influentes, separação perfeita e necessidade de engenharia de features para relações não lineares."],
  ["Em que situação você escolheria regressão logística em vez de um modelo mais complexo?","Quando interpretabilidade, transparência, velocidade e uma relação aproximadamente linear no logit são importantes. É um excelente baseline e pode ser preferível quando o ganho de modelos mais complexos não compensa a perda de interpretabilidade ou o custo operacional."],
  ["Qual o custo computacional da Regressão Logística?", "O custo aproximado é O(np) por iteração, em que \(n\) é o número de observações e \(p\) o número de variáveis explicativas; portanto, o custo total depende também da quantidade de iterações necessárias para convergir."],
  ["Por que Regressão Logística usa verossimilhança?", "Porque seu objetivo é estimar os coeficientes que tornam os resultados observados mais prováveis, considerando as probabilidades previstas pelo modelo."],
  ["Como a máxima verossimilhança é calculada?", "Ela é calculada multiplicando as probabilidades que o modelo atribui aos resultados realmente observados. Primeiro, o modelo estima a probabilidade de cada observação pertencer à classe positiva usando a função sigmoide. Para cada observação, se o resultado real for 1, usamos a probabilidade prevista pi; se for 0, usamos 1-pi. Multiplicamos essas probabilidades para obter a verossimilhança total e, em seguida, o algoritmo ajusta os coeficientes para maximizar esse produto. Como multiplicar muitas probabilidades pequenas pode causar problemas numéricos, geralmente usamos o logaritmo da verossimilhança, transformando o produto em uma soma. Na prática, o algoritmo minimiza a log loss, que é o negativo da log-verossimilhança. Ela penaliza o modelo quando ele atribuiu alta probabilidade (estava confiante) e errou. O modelo faz iterações até encontrar o melhor valor para aquela amostra."]
],
},

{
 id:"arvore", 
 num:"11", 
 title:"Árvore de Decisão", 
 branches:[
  ["O que é uma Árvore de Decisão e como ela faz previsões?","É um modelo que particiona recursivamente o espaço de features por regras do tipo feature ≤ limiar. Cada observação percorre os nós até uma folha, e a folha fornece a previsão: classe/probabilidade em classificação ou um valor numérico, normalmente a média dos alvos, em regressão."],
  ["Como a árvore escolhe o primeiro split?","Ela avalia candidatos de feature e ponto de corte e escolhe aquele que mais melhora um critério de divisão. Em classificação, busca reduzir a impureza; em regressão, busca reduzir o erro ou a variância dentro dos nós."],
  ["Qual é a diferença entre uma árvore para classificação e uma para regressão?","A estrutura é semelhante, mas o critério de split e a previsão da folha mudam. Classificação busca separar classes usando medidas como Gini ou entropia e prevê classes/probabilidades; regressão reduz erro ou variância e prevê valores numéricos."],
  ["Como uma árvore testa os pontos de corte do split?", "Para variável numérica, ordena os valores observados e avalia cortes entre valores consecutivos distintos (ponto médio) entre eles, calcula a impureza ponderada dos nós filhos e compara o resultado com os demais cortes, escolhendo o corte que proporciona a maior redução da impureza. Para variáveis categóricas, a lógica depende do algoritmo: no CART, a árvore testa divisões que separam as categorias em dois grupo e verifica qual separação reduziu a impureza (para uma variável com k categorias, existem 2^{k-1}-1 divisões binárias possíveis)."],
  ["O que é impureza em uma Árvore de Decisão?","É uma medida de quão misturadas estão as classes em um nó. Um nó puro contém essencialmente uma única classe. Critérios comuns são Gini e entropia."],
  ["Como funciona o índice Gini?","Gini é uma medida de impureza e para um nó com proporções pk das classes, Gini = 1 − Σ p_k². Quando igual a zero indica um nó puro, com todas as observações pertencendo à mesma classe; quanto maior o Gini, maior a mistura entre as classes. Em uma classificação binária, o valor máximo é 0,5, quando as duas classes estão igualmente distribuídas. Durante a construção da árvore, o algoritmo busca divisões que reduzam a impureza ponderada dos nós filhos em relação ao nó pai, favorecendo grupos mais homogêneos."],
  ["Como funciona a entropia em uma Árvore de Decisão?","Entropia = −Σ p_k log₂(p_k). Ela mede a incerteza do nó: é zero quando o nó é puro e aumenta quando as classes ficam mais misturadas. O ganho de informação é a redução da entropia causada por um split. O algoritmo compara a impureza antes da divisão com a impureza média ponderada dos filhos e prefere divisões que produzam maior redução."],
  ["Qual é a diferença entre Gini e entropia?","Ambas medem impureza e geralmente produzem splits semelhantes. Gini tende a ser um pouco mais simples computacionalmente; entropia usa logaritmos."],
  ["Como a Árvore de Decisão funciona em problemas de regressão?","Em cada split, procura reduzir uma medida de erro, frequentemente a soma dos erros quadráticos ou a variância dentro dos nós. Na folha, a previsão usual é a média dos valores-alvo das observações que chegaram ali."],
  ["Como a profundidade da árvore afeta o modelo?","Maior profundidade permite regras mais específicas e maior complexidade, reduzindo o viés mas aumentando o risco de overfitting. Profundidade muito pequena pode gerar underfitting."],
  ["Quais são os principais hiperparâmetros de uma Árvore de Decisão?","max_depth limita a profundidade; min_samples_split define o mínimo de amostras para dividir um nó; min_samples_leaf define o mínimo por folha; max_features limita as features consideradas; criterion define o critério de divisão; e ccp_alpha controla poda por complexidade."],
  ["Como controlar overfitting em uma Árvore de Decisão?","Posso limitar max_depth, aumentar min_samples_leaf ou min_samples_split, limitar max_features e usar pruning, como cost-complexity pruning com ccp_alpha. A escolha deve ser validada em dados não vistos."],
  ["O que é pruning e por que ele é importante?","Pruning remove partes da árvore que agregam pouco poder preditivo em relação à complexidade adicionada. Isso reduz a capacidade de memorizar ruído e pode melhorar a generalização."],
  ["Árvores de Decisão precisam de scaling?","Em geral, não. Como a árvore toma decisões por limiares de uma feature, transformar a escala de uma variável normalmente não altera a ordem dos valores nem os splits possíveis. Por isso, StandardScaler ou MinMaxScaler não são necessários por causa do algoritmo."],
  ["Como uma Árvore de Decisão lida com variáveis categóricas?","Depende da implementação. Algumas bibliotecas suportam categorias diretamente; em outras, é necessário codificá-las. One-Hot Encoding pode funcionar, mas deve ser aplicado dentro do Pipeline para evitar inconsistências e leakage."],
  ["Como uma Árvore de Decisão lida com valores ausentes?","Depende da implementação. Algumas árvores suportam missing values diretamente; outras exigem imputação. Quando imputar, a estratégia deve ser aprendida apenas no treino para evitar leakage."],
  ["Como uma Árvore de Decisão lida com outliers?","É relativamente robusta a outliers nas features porque trabalha com pontos de corte, e não com distâncias ou médias globais para definir a escala. Porém, outliers podem influenciar splits e, principalmente em regressão, podem afetar fortemente a média prevista nas folhas."],
  ["Como uma Árvore de Decisão lida com dados desbalanceados?","O critério de impureza pode favorecer a classe majoritária, fazendo a árvore produzir folhas com pouca representação da classe rara. Posso usar class_weight, amostragem, critérios e métricas adequadas, além de ajustar o threshold quando a saída probabilística permitir."],
  ["Como interpretar as probabilidades de uma Árvore de Decisão de classificação?","Em uma implementação típica, a probabilidade de uma classe em uma folha é a proporção de observações daquela classe na folha. Essas probabilidades podem ser pouco calibradas, especialmente em árvores muito pequenas ou muito profundas, então calibração deve ser avaliada quando probabilidades forem usadas para decisão."],
  ["Como avaliar a importância das features em uma Árvore de Decisão?","A feature importance por redução de impureza soma a contribuição dos splits daquela variável, ponderada pelo tamanho dos nós. Ela é útil, mas pode favorecer variáveis contínuas ou de alta cardinalidade. Permutation importance e SHAP podem complementar a interpretação."],
  ["Qual é a complexidade computacional de treinar uma Árvore de Decisão?","Depende de n, número de features, profundidade e estratégia de busca dos splits. De forma aproximada, o custo cresce com o número de amostras e features, e árvores profundas ou dados de alta dimensão podem ficar mais caras. A implementação concreta determina a complexidade exata."],
  ["Quais são as principais vantagens das Árvores de Decisão?","Capturam relações não lineares e interações, exigem pouco pré-processamento, são fáceis de visualizar e interpretar em árvores pequenas e funcionam para classificação e regressão. Também não dependem de scaling."],
  ["Quais são as principais desvantagens das Árvores de Decisão?","Árvores individuais podem ter alta variância, sofrer overfitting e ser instáveis: pequenas mudanças nos dados podem gerar estruturas diferentes. Também podem produzir fronteiras em degraus e ficar difíceis de interpretar quando muito profundas."],
  ["Uma Árvore de Decisão faz seleção de features automaticamente?","Sim, porque somente features escolhidas para splits aparecem na árvore. Isso pode gerar uma forma de seleção implícita, mas não significa que as features não escolhidas sejam irrelevantes: elas podem ser redundantes, ter pouco ganho marginal ou não terem sido selecionadas naquela amostra."],
  ["Como a Árvore de Decisão captura interações entre variáveis?","As próprias divisões sequenciais criam interações. Por exemplo, depois de dividir por renda, a árvore pode fazer uma segunda divisão por idade somente dentro de uma determinada faixa de renda, representando uma regra condicional entre as duas features."],
  ["Como eu escolheria os hiperparâmetros de uma Árvore de Decisão em um projeto real?","Definiria uma métrica alinhada ao objetivo, criaria uma validação adequada ao processo de geração dos dados e buscaria hiperparâmetros como max_depth, min_samples_leaf e ccp_alpha. Também compararia a complexidade e a estabilidade do modelo, não apenas o melhor score médio."],
  ["Em um problema de fraude, como eu usaria uma Árvore de Decisão?","Primeiro trataria o desbalanceamento e definiria custos para falso positivo e falso negativo. Avaliaria precision, recall, PR-AUC e a matriz de confusão, ajustaria o threshold se necessário e controlaria a profundidade para evitar uma árvore que memorize transações do treino."],
  ["Quando uma Árvore de Decisão é uma boa escolha e quando eu consideraria outro modelo?","É uma boa opção quando interpretabilidade, regras condicionais e pouca necessidade de preprocessing são importantes. Se uma única árvore apresentar alta variância ou desempenho instável, ensembles como Random Forest ou Gradient Boosting podem ser considerados, comparando desempenho, custo e interpretabilidade."],
  ["Dê um exemplo de como Gini é calculado.", "Para calcular o Gini em uma árvore de decisão, imagine um nó com 10 clientes, dos quais 6 contrataram um produto bancário e 4 não contrataram. Primeiro, calculamos o Gini do nó pai pela fórmula 1 − Σ p_k², obtendo 1-(0,6)^2-(0,4)^2=0,48. Em seguida, suponha que um split divida os clientes em dois nós: o primeiro com 5 clientes que contrataram e 1 que não contratou, e o segundo com 1 que contratou e 3 que não contrataram. Calculamos o Gini de cada filho, obtendo aproximadamente 0,278 e 0,375, respectivamente. Depois, calculamos a impureza ponderada dos filhos, considerando a proporção de observações em cada nó: (6/10)*0,278+(4/10)*0,375 = 0,317. Por fim, subtraímos esse valor do Gini do pai, obtendo uma redução de aproximadamente 0,163. A árvore compara essa redução com a dos demais splits candidatos e escolhe aquele que proporciona a maior redução da impureza ponderada."],
],
