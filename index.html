  {
  id:"gmm",
  num:"21",
  title:"GMM",
  branches:[
  ["O que é o GMM?","Gaussian Mixture Model é um modelo probabilístico que representa os dados como uma mistura de distribuições Gaussianas, em que cada componente pode representar um cluster."],
  ["O que caracteriza o algoritmo GMM?","Ele modela a distribuição dos dados por componentes Gaussianos e estima parâmetros como médias, covariâncias e pesos de mistura, permitindo atribuições probabilísticas."],
  ["O que é a estratégia de agrupamento baseada em distribuições?","Em vez de definir grupos apenas pela proximidade a um centróide, o modelo estima distribuições de probabilidade e atribui cada observação conforme sua probabilidade de pertencer a cada componente."],
  ["O GMM é um algoritmo paramétrico?","Sim. O GMM assume uma família paramétrica de distribuições, normalmente Gaussianas, e estima seus parâmetros a partir dos dados."],
  ["O GMM é um algoritmo de soft clustering?","Sim. O GMM fornece probabilidades ou responsabilidades de uma observação pertencer a cada componente, permitindo pertencimento probabilístico a vários clusters."],
  ["Como funciona o conceito de soft clustering no GMM?","Cada ponto recebe uma probabilidade de pertencimento a cada gaussiana. Em vez de apenas dizer 'cluster 1', podemos ter, por exemplo, 70% para um componente e 30% para outro."],
  ["Como funciona o GMM?","Inicializa parâmetros, alterna E-step e M-step do EM, atualizando responsabilidades e parâmetros das Gaussianas até atingir um critério de convergência."],
  ["O que são gaussianas?","São distribuições de probabilidade contínuas caracterizadas por uma média e uma medida de dispersão; em várias dimensões, a covariância também define forma e orientação."],
  ["Quais são os parâmetros de uma gaussiana?","Em uma dimensão, média e variância. Em várias dimensões, vetor de médias e matriz de covariância."],
  ["Como representar uma gaussiana em mais de duas dimensões?","Usa-se um vetor de médias para posicionar o centro e uma matriz de covariância para representar variâncias e correlações entre as dimensões."],
  ["Como mover uma gaussiana em um espaço com mais de duas dimensões?","Altera-se o vetor de médias. Ele determina a posição do centro da distribuição no espaço multidimensional."],
  ["Quais são os parâmetros importantes de uma mistura de gaussianas?","Para cada componente: média, matriz de covariância e peso de mistura. Os pesos são não negativos e somam 1."],
  ["O que é covariância?","É uma medida de como duas variáveis variam conjuntamente. Covariância positiva indica tendência de crescerem juntas; negativa, de variarem em sentidos opostos."],
  ["O que é uma matriz de covariância?","É a matriz que reúne variâncias na diagonal e covariâncias fora da diagonal, descrevendo dispersão e relações entre as dimensões."],
  ["Como a matriz de covariância influencia a forma de um cluster no GMM?","Ela controla escala, orientação e correlação. Por isso, uma componente pode assumir uma forma elíptica e não apenas esférica."],
  ["Como encontrar os melhores parâmetros para as gaussianas no GMM?","Normalmente usa-se Expectation-Maximization, que alterna a estimativa das responsabilidades e a atualização dos parâmetros para aumentar a verossimilhança dos dados."],
  ["O que é o algoritmo Expectation-Maximization (EM)?","É um algoritmo iterativo para estimar parâmetros quando há variáveis latentes. No GMM, as atribuições dos pontos aos componentes são latentes."],
  ["Quais são os dois passos principais do algoritmo EM?","E-step, que calcula responsabilidades; e M-step, que atualiza médias, covariâncias e pesos usando essas responsabilidades."],
  ["O que acontece no E-step?","Mantendo os parâmetros atuais, calcula-se a responsabilidade de cada componente por cada observação, ou seja, a probabilidade posterior de pertencimento."],
  ["O que acontece no M-step?","Mantendo as responsabilidades calculadas, recalculam-se médias, covariâncias e pesos de mistura para maximizar a verossimilhança esperada."],
  ["O que é a responsabilidade de um ponto em relação a uma gaussiana?","É o grau probabilístico com que aquele componente explica a observação, condicionado aos parâmetros atuais e aos demais componentes."],
  ["Como são atualizadas as médias das gaussianas no M-step?","A média de cada componente é uma média ponderada dos pontos, usando as responsabilidades como pesos."],
  ["Como são atualizadas as matrizes de covariância no M-step?","São estimadas a partir dos desvios dos pontos em relação à média do componente, ponderados pelas responsabilidades."],
  ["Como são atualizados os pesos de mistura no M-step?","Cada peso é proporcional à soma das responsabilidades daquele componente, normalizada pelo número total de observações."],
  ["Quando o algoritmo EM para?","Quando a mudança na log-verossimilhança ou nos parâmetros fica abaixo de uma tolerância, quando as responsabilidades estabilizam ou quando o número máximo de iterações é atingido."],
  ["Como determinar o número ideal de gaussianas?","Treinam-se modelos com diferentes números de componentes e comparam-se critérios como BIC e AIC, além de estabilidade, interpretação e qualidade dos clusters."],
  ["O que é AIC?","Akaike Information Criterion é um critério que combina qualidade de ajuste e penalização pela complexidade do modelo. Em geral, valores menores são preferíveis entre modelos comparáveis."],
  ["O que é BIC?","Bayesian Information Criterion combina ajuste e penalização de complexidade, com penalização dependente do tamanho da amostra. Em geral, valores menores são preferíveis entre modelos comparáveis."],
  ["Qual é a diferença entre AIC e BIC?","Ambos penalizam complexidade, mas o BIC aplica uma penalização mais forte à medida que o tamanho da amostra cresce. A escolha depende do objetivo e do contexto de modelagem."],
  ["Como utilizar AIC para escolher o número de gaussianas?","Treina-se o GMM para diferentes números de componentes e compara-se o AIC; entre modelos comparáveis, valores menores indicam melhor compromisso entre ajuste e complexidade segundo esse critério."],
  ["Como utilizar BIC para escolher o número de gaussianas?","Treina-se o GMM para diferentes números de componentes e escolhe-se, como regra prática, o modelo com menor BIC entre os candidatos comparáveis."],
  ["Como a distância ou separação entre as gaussianas pode ajudar na escolha do número de clusters?","Componentes muito sobrepostos podem indicar que separar os dados em mais grupos não traz ganho interpretável. A separação deve ser analisada junto com probabilidades, ajuste e critérios como BIC/AIC."],
  ["Qual é o custo computacional do GMM?","Depende de n, k, d, número de iterações e estrutura das covariâncias. O custo aumenta bastante com a dimensionalidade quando covariâncias completas são usadas."],
  ["Qual é a complexidade computacional do GMM em função de n, k e d?","Para covariâncias completas, uma aproximação comum por iteração é O(n·k·d²), além do custo de operações matriciais; o total depende do número de iterações até convergir."],
  ["Para quais tipos ou formas de distribuição de grupos o GMM funciona bem?","Funciona bem quando os grupos podem ser razoavelmente aproximados por distribuições Gaussianas, inclusive grupos elípticos e sobrepostos."],
  ["Por que o GMM consegue modelar clusters de forma elíptica?","Porque a matriz de covariância permite diferentes variâncias e correlações entre dimensões, controlando a orientação e a forma da distribuição."],
  ["Quais são as desvantagens do GMM?","Pode ser sensível à inicialização, apresentar máximos locais, exigir escolha do número de componentes, sofrer com outliers e ter custo elevado em alta dimensionalidade com covariância completa."],
  ["Por que o GMM é sensível à inicialização dos parâmetros?","O EM otimiza iterativamente uma função que pode ter múltiplas soluções locais. Inicializações diferentes podem levar a soluções diferentes."],
  ["O que significa o GMM convergir para um mínimo local?","Na prática, significa que o processo iterativo pode parar em uma solução que não é a melhor solução global possível para o objetivo otimizado. Em GMM/EM, fala-se mais precisamente em máximo local da verossimilhança."],
  ["Como lidar com efeitos de escala no GMM?","Como a covariância e as distâncias probabilísticas dependem da escala, é comum padronizar as features quando suas unidades e magnitudes são muito diferentes, avaliando o impacto no problema."],
  ["Como lidar com outliers no GMM?","Outliers podem distorcer médias e covariâncias. Deve-se investigá-los antes do ajuste e considerar tratamento robusto ou modelos/distribuições mais adequados ao contexto."],
  ["Como deixar o custo computacional do GMM menor?","Reduzir dimensionalidade ou features, limitar o número de componentes e iterações, usar estruturas de covariância mais simples e inicializações eficientes pode reduzir o custo."],
  ["Quais são as vantagens do GMM?","Permite soft clustering, modela clusters elípticos, fornece probabilidades de pertencimento, representa sobreposição entre grupos e oferece uma interpretação probabilística."],
  ["Como o GMM se diferencia do K-Means?","K-means atribui pontos ao centróide mais próximo e tende a formar clusters compactos. GMM modela distribuições, usa covariâncias e fornece probabilidades de pertencimento."],
  ["Qual é a diferença entre hard clustering e soft clustering no contexto do GMM?","Hard clustering força cada ponto a um único grupo. Soft clustering permite probabilidades para vários grupos; o GMM naturalmente produz esse tipo de atribuição."],
  ["Como o GMM pode ser utilizado em aprendizado semi-supervisionado?","As componentes e suas probabilidades podem ajudar a modelar a estrutura dos dados não rotulados e, quando há rótulos disponíveis, eles podem ser incorporados para orientar a associação entre componentes e classes."]
]
},

{
 id:"genai", 
 num:"22",
 title:"IA Generativa e Agentes de IA",
 branches:[
  ["O que é Inteligência Artificial Generativa?","É a área de IA voltada a aprender padrões dos dados para gerar novos conteúdos, como texto, imagem, áudio, vídeo ou código."],
  ["Quais são as aplicações práticas da IA Generativa?","Geração de texto, imagens, áudio, vídeo e código; sumarização; assistentes; síntese de dados; criação de conteúdo; automação e explicabilidade assistida."],
  ["O que é um Agente de IA e qual a diferença de um agente para um chatbot?", "Um agente de IA é um sistema que utiliza um modelo de IA para interpretar um objetivo, planejar etapas e executar ações para alcançá-lo, podendo utilizar ferramentas externas, como APIs, bancos de dados e mecanismos de busca. Diferentemente de um chatbot tradicional, que normalmente responde às solicitações do usuário, um agente pode decidir qual ferramenta utilizar, observar os resultados, ajustar sua estratégia e executar novas etapas até concluir a tarefa ou atingir uma condição de parada."],
  ["O que é um Token?","É uma unidade de texto processada pelo modelo de linguagem; pode corresponder a uma palavra, parte de uma palavra, pontuação ou outro fragmento."],
  ["Qual é a relação entre tokens e custo de utilização de modelos como GPT?","Em APIs que precificam por tokens, a quantidade de tokens de entrada e saída influencia diretamente o consumo e o custo da chamada. Prompts menores, contexto relevante e saídas controladas reduzem tokens processados, diminuindo consumo quando a cobrança depende deles."],
  ["O que é Embedding?", "Embedding é a representação de textos, imagens ou outros dados em vetores numéricos que capturam características semânticas, permitindo comparar conteúdos por similaridade. Por exemplo, em um sistema RAG, um modelo de embedding transforma documentos e perguntas em vetores para recuperar os trechos mais relevantes, mesmo quando utilizam palavras diferentes. Exemplos de modelos de embedding para texto incluem OpenAI text-embedding-3-small e text-embedding-3-large, Sentence-BERT (SBERT), BGE (BAAI General Embedding), E5 e GTE."],
  ["O que é a dimensão de um modelo de Embedding?", "A dimensão de um modelo de embedding é a quantidade de números que compõem o vetor gerado para representar um texto, uma imagem ou outro dado. Por exemplo, se um modelo produz embeddings de dimensão 768, cada texto será representado por um vetor com 768 valores numéricos. Essa dimensão é definida pela arquitetura ou configuração do modelo e determina o tamanho do vetor, mas não significa que cada número corresponda a uma característica humana específica e interpretável. Modelos com dimensões maiores podem ter maior capacidade de representar relações semânticas, mas isso não garante que sejam melhores: a qualidade depende do treinamento e da tarefa. A dimensão também afeta o armazenamento e o custo computacional das buscas vetoriais. Por exemplo, se armazenarmos um milhão de embeddings de 768 dimensões em formato float32, precisaremos de aproximadamente 3,07 GB apenas para os valores dos vetores, sem contar índices e metadados. Exemplos de modelos com diferentes dimensões incluem o text-embedding-3-small, da OpenAI, que produz 1.536 dimensões por padrão, e o text-embedding-3-large, que produz 3.072 por padrão; esses modelos permitem reduzir a dimensão em configurações compatíveis."],
  ["O que é Prompt Engineering?","Prompt Engineering é a construção sistemática de instruções, contexto, exemplos e restrições para orientar o comportamento de uma LLM e aumentar a qualidade, a consistência e a adequação das respostas à tarefa solicitada. É importante porque o resultado gerado depende não apenas da capacidade do modelo, mas também de como o problema é apresentado, das informações fornecidas e do formato esperado para a saída."],
  ["Quais as técnicas de Prompt Engineering?","Entre as principais técnicas estão o Zero-shot Prompting, que solicita uma tarefa sem fornecer exemplos; o Few-shot Prompting, que apresenta exemplos de entradas e saídas esperadas para orientar o modelo; o Role Prompting, que define um papel ou perspectiva para a resposta, como “atue como um especialista em ciência de dados”; e o Structured Prompting, que organiza a instrução em objetivo, contexto, restrições e formato de saída. Também é possível utilizar Chain-of-Thought Prompting, que incentiva o modelo a decompor problemas complexos em etapas de raciocínio, e Prompt Chaining, que divide uma tarefa em etapas encadeadas, utilizando a saída de uma etapa como entrada da seguinte."],
  ["Como escrever um bom prompt?","Defina claramente a tarefa, forneça contexto relevante, especifique restrições e formato de saída e, quando necessário, inclua exemplos; contexto relevante reduz ambiguidades e orienta a resposta."],
  ["O que é Harness?", "Harness é a estrutura que envolve um modelo de IA para que ele funcione dentro de uma aplicação, já que o modelo de LLM por si apenas retorna palavras prováveis, mas não tem memória ou capacidade de decisão. Ele conecta a LLM às instruções, ao contexto, às ferramentas, à memória, aos mecanismos de controle e às regras de execução necessárias para realizar uma tarefa."],
  ["O que é In Context Learning?", "In-Context Learning (ICL) é a capacidade de uma LLM realizar uma tarefa a partir de instruções e exemplos fornecidos diretamente no prompt, sem precisar atualizar os pesos do modelo ou realizar um novo treinamento. Por exemplo, podemos fornecer alguns exemplos de avaliações de clientes classificadas como positivas ou negativas e, em seguida, apresentar uma nova avaliação para que o modelo identifique sua categoria com base nos exemplos anteriores. O ICL pode ocorrer em formato zero-shot, quando fornecemos apenas a instrução, ou few-shot, quando incluímos exemplos. Diferentemente do fine-tuning, que modifica os parâmetros do modelo durante o treinamento, o ICL utiliza o contexto temporário da entrada para orientar a resposta, sem alterar os parâmetros aprendidos."],
  ["O que é RAG?", "RAG (Retrieval-Augmented Generation) é uma técnica que combina a recuperação de informações externas (Retrieval) com a geração de respostas por uma LLM (Generation). O objetivo é fornecer ao modelo informações relevantes e atualizadas para responder a uma pergunta, reduzindo a dependência exclusiva do conhecimento adquirido durante o treinamento e ajudando a diminuir alucinações. O processo geralmente envolve dividir documentos em chunks, gerar embeddings desses fragmentos e armazená-los em um banco vetorial. Quando o usuário faz uma pergunta, ela também é convertida em embedding, e o sistema recupera os trechos mais relevantes por similaridade semântica. Esses trechos são adicionados ao prompt como contexto, e a LLM utiliza as informações recuperadas para gerar a resposta. Diferentemente do fine-tuning, o RAG não precisa modificar os pesos do modelo para incorporar novos documentos: basta atualizar a base de conhecimento e o mecanismo de recuperação."],
  ["O que é fine-tuning?", "Fine-tuning é uma técnica de treinamento que adapta um modelo de IA pré-treinado a uma tarefa ou domínio específico, utilizando um conjunto de dados adicional para atualizar seus parâmetros (pesos). O objetivo é especializar o comportamento do modelo, por exemplo, para classificar documentos financeiros, responder perguntas em um estilo específico ou interpretar terminologia de uma área. Durante o processo, o modelo recebe exemplos e seus parâmetros são ajustados por meio da otimização de uma função de perda. Em modelos grandes, é possível utilizar técnicas como LoRA e PEFT, que adaptam o modelo treinando apenas uma pequena parte dos parâmetros ou adicionando parâmetros específicos, reduzindo o custo computacional. Diferentemente do In-Context Learning, que utiliza exemplos no prompt sem alterar os pesos do modelo, o fine-tuning modifica os parâmetros treináveis; já o RAG fornece informações externas durante a inferência, sem exigir que o modelo seja retreinado para cada atualização da base de conhecimento."],
  ["Quando usar In Context Learning, RAG ou Fine-tuning?", "O In-Context Learning é indicado quando queremos orientar a LLM por meio de instruções e exemplos fornecidos diretamente no prompt, sem modificar os pesos do modelo. É útil para tarefas rápidas, classificação e experimentação com poucos exemplos. O RAG (Retrieval-Augmented Generation) é indicado quando o modelo precisa consultar informações externas, como documentos internos, políticas corporativas ou bases de conhecimento atualizadas. Nesse caso, o sistema recupera os trechos relevantes e os fornece como contexto para a geração da resposta, sem precisar retreinar o modelo a cada atualização dos documentos. Já o Fine-tuning é utilizado quando precisamos adaptar o comportamento do modelo a uma tarefa específica, atualizando seus parâmetros treináveis com exemplos de treinamento, por exemplo, para melhorar uma classificação especializada ou padronizar o formato das respostas."],
  ["O que é janela de contexto (context window)?", "A janela de contexto (context window) é a quantidade máxima de tokens que uma LLM consegue considerar em uma interação durante o processamento, incluindo o prompt, as instruções de sistema, o histórico da conversa, os documentos fornecidos e, conforme a arquitetura e a implementação, os tokens gerados na resposta. Por exemplo, se um modelo possui uma janela de contexto de 128 mil tokens, ele pode processar até esse limite total de tokens na combinação permitida de entrada e saída. Quanto maior a janela, mais informações o modelo pode considerar simultaneamente, o que é útil para analisar documentos extensos ou manter conversas longas. Entretanto, uma janela maior não garante que o modelo utilizará todas as informações com a mesma precisão, e seu uso pode aumentar o custo e a latência. Se o limite for ultrapassado, a aplicação pode precisar reduzir o histórico, resumir informações ou dividir o conteúdo em partes."],
  ["O que é um banco de dados vetorial?", "Um banco de dados vetorial (Vector Database) é um banco especializado em armazenar e consultar vetores numéricos, geralmente embeddings que representam o significado semântico de textos, imagens, áudios ou outros dados. Ele permite recuperar informações semelhantes com base na proximidade entre os vetores, em vez de depender apenas da correspondência exata de palavras. Exemplos de bancos de dados vetoriais incluem Pinecone, Milvus, Weaviate e Chroma."],
  ["Quais são os tipos de busca que RAG pode fazer?", "Em sistemas RAG (Retrieval-Augmented Generation), existem diferentes estratégias de busca para recuperar os documentos ou trechos mais relevantes para uma pergunta. As principais são a busca por palavras-chave, a busca vetorial semântica e a busca híbrida."],
  ["O que é Busca por palavras-chave (Keyword Search)?", "Estratégia RAG que procura correspondências entre os termos da pergunta e os termos presentes nos documentos. Uma técnica comum é o BM25, que considera fatores como frequência dos termos e relevância do documento. É útil quando os termos exatos importam, como códigos de produtos, nomes ou identificadores."],
  ["O que é Busca vetorial (Vector Search)", "Estratégia RAG que transforma a pergunta e os documentos em embeddings e compara seus vetores usando métricas como similaridade do cosseno. Assim, consegue recuperar conteúdos semanticamente semelhantes mesmo quando utilizam palavras diferentes. Por exemplo, uma pergunta sobre “tirar férias” pode recuperar um documento que fala sobre “período de descanso dos funcionários”."],
  ["O que é Busca híbrida (Hybrid Search)", "Estratégia RAG que combina busca por palavras-chave com busca vetorial, aproveitando tanto a correspondência lexical quanto a similaridade semântica. É útil quando precisamos encontrar documentos que contenham conceitos semelhantes, mas também termos específicos."],
  ["O que são Chunks?", "Chunks são fragmentos menores de um documento, utilizados para dividir conteúdos extensos em partes que possam ser processadas e recuperadas individualmente em sistemas RAG (Retrieval-Augmented Generation). Como uma LLM possui um limite de contexto, dividir documentos em chunks permite buscar apenas os trechos relevantes para cada pergunta, em vez de enviar o documento inteiro. Por exemplo, um manual de crédito de 100 páginas pode ser dividido em chunks por parágrafos, seções ou grupos de tokens. Cada fragmento pode ser convertido em um embedding e armazenado em um banco vetorial, junto com metadados que identificam sua origem. Quando o usuário faz uma pergunta, o sistema recupera os chunks mais relevantes e os fornece à LLM como contexto para gerar a resposta. O tamanho dos chunks influencia a qualidade da recuperação: fragmentos muito pequenos podem perder contexto, enquanto fragmentos muito grandes podem incluir informações irrelevantes e dificultar a busca. Por isso, técnicas como chunking por tamanho de tokens, divisão por parágrafos ou seções e overlapping — sobreposição entre fragmentos consecutivos — são utilizadas para preservar o contexto e melhorar a recuperação."],
  ["Quais as técnicas para definir Chunks?", "As principais técnicas para definir chunks em sistemas RAG são a divisão por tamanho fixo (fixed-size chunking), que separa o texto em fragmentos com uma quantidade predefinida de tokens; a divisão com sobreposição (overlap), que repete parte do conteúdo entre chunks consecutivos para preservar o contexto; a divisão recursiva (recursive splitting), que prioriza separadores como parágrafos, frases e caracteres; a divisão semântica (semantic chunking), que identifica mudanças de assunto para agrupar informações relacionadas; a divisão baseada na estrutura do documento, que respeita títulos, seções, parágrafos e tabelas; e a divisão hierárquica (hierarchical chunking), que organiza o conteúdo em diferentes níveis de granularidade. A escolha depende do tipo de documento e da tarefa: chunks muito pequenos podem perder contexto, enquanto chunks muito grandes podem incluir informações irrelevantes. Por isso, é importante testar diferentes tamanhos e níveis de sobreposição e avaliar a qualidade da recuperação e das respostas geradas pelo RAG."],
  ["O que é overlap?", "Overlap é a sobreposição de uma parte do conteúdo entre dois chunks consecutivos, utilizada para preservar o contexto quando um documento é dividido em fragmentos para um sistema RAG."],
  ["O que é Quantização?", "É uma técnica de otimização de modelos de Machine Learning e, principalmente, de modelos de linguagem (LLMs), que reduz a precisão numérica utilizada para representar os pesos do modelo, por exemplo, de 32 bits (FP32) para 16 bits (FP16) ou 8 bits (INT8), podendo chegar a 4 bits (INT4). Isso reduz o consumo de memória e pode acelerar a inferência, permitindo executar modelos grandes em hardwares com menos recursos. A desvantagem é que a redução de precisão pode causar perda de qualidade nas respostas, embora isso dependa do modelo e do método de quantização."],
  ["O que é Prompt Injection?", "Prompt Injection é um tipo de ataque contra sistemas de IA generativa em que um usuário ou conteúdo externo contém instruções maliciosas que tentam manipular o comportamento da LLM, fazendo-a ignorar as instruções originais ou executar ações não autorizadas."],
  ["O que é alucinação no contexto de LLM?", "Alucinação em LLMs ocorre quando um modelo de linguagem gera informações falsas, imprecisas ou inventadas, apresentando-as como se fossem verdadeiras. Isso acontece porque a LLM aprende padrões estatísticos da linguagem e gera sequências de tokens com base nesses padrões, mas não possui, por si só, uma garantia de verificação factual de tudo o que afirma. Por exemplo, uma LLM pode inventar uma referência bibliográfica, citar um artigo que não existe ou fornecer um valor incorreto para uma métrica estatística com bastante confiança. As alucinações podem ocorrer quando o modelo não possui conhecimento suficiente, quando o prompt é ambíguo, quando o contexto fornecido é inadequado ou quando a pergunta exige informações muito específicas ou atualizadas. Para reduzir esse risco, podemos utilizar RAG, fornecendo documentos confiáveis como contexto; exigir citações e verificar as fontes; instruir o modelo a admitir quando não sabe; e implementar avaliações e validações das respostas. Entretanto, essas técnicas não eliminam completamente as alucinações: mesmo com RAG, o modelo pode interpretar incorretamente os documentos ou gerar conclusões que não são sustentadas por eles." ],
  ["Quais as técnicas de validação de um LLM?", "A validação de uma LLM (Large Language Model) envolve técnicas para avaliar a qualidade, a precisão, a consistência e a segurança das respostas geradas. Diferentemente dos modelos tradicionais de classificação, nem sempre existe uma única resposta correta, por isso combinamos diferentes métodos de avaliação. As principais técnicas são a avaliação humana, em que especialistas analisam critérios como relevância, coerência e factualidade; as métricas automáticas, como BLEU e ROUGE, que comparam a resposta gerada com referências, e métricas baseadas em embeddings, como BERTScore, que avaliam similaridade semântica; o LLM-as-a-Judge, em que outro modelo avalia as respostas segundo critérios definidos; e os testes baseados em conjuntos de perguntas e respostas (benchmarks), utilizados para medir capacidades específicas, como raciocínio, compreensão e conhecimento. Em aplicações com RAG, também avaliamos a qualidade da recuperação dos documentos, a relevância do contexto recuperado e a fidelidade da resposta às fontes. Além disso, realizamos testes de robustez, segurança e alucinação, verificando se o modelo resiste a entradas adversariais, evita informações inventadas e respeita as restrições definidas. Por fim, podemos acompanhar métricas em produção, como latência, custo por requisição, taxa de erros e satisfação dos usuários."],
  ["O que são Safeguards e Guardrails?", "Safeguards e Guardrails são mecanismos de segurança utilizados em aplicações de IA generativa para reduzir riscos, impedir comportamentos inadequados e garantir que o modelo opere dentro de limites definidos. Embora os termos sejam frequentemente usados como sinônimos, guardrails geralmente se referem às regras e aos controles que restringem o comportamento do sistema, enquanto safeguards é um termo mais amplo, que abrange as medidas de proteção como um todo. As principais técnicas incluem a validação de entradas (input filtering), que identifica solicitações maliciosas, tentativas de prompt injection e conteúdos proibidos; a validação de saídas (output filtering), que verifica se a resposta contém informações sensíveis, conteúdo inadequado ou violações de políticas; a proteção contra vazamento de dados, utilizando mascaramento de informações pessoais e controle de acesso; e o controle de ferramentas e permissões, que limita as ações que um agente pode executar, como consultar bancos de dados ou enviar e-mails. Também podemos utilizar classificadores de segurança, que identificam categorias de risco, restrições de formato, que garantem respostas estruturadas em JSON ou dentro de um esquema definido, e human-in-the-loop, que exige aprovação humana antes de ações críticas. Por exemplo, em um agente bancário, guardrails podem impedir que o sistema aprove automaticamente uma operação de crédito sem autorização, enquanto safeguards adicionais podem monitorar acessos, registrar ações e detectar comportamentos suspeitos."],
  ["Como personalizar um agente? Fale sobre temperatura, top-p, top-k e max-token.", "A personalização de um agente de IA pode ser feita por meio de instruções de sistema, ferramentas disponíveis, memória, contexto e parâmetros de geração da LLM. Entre os principais parâmetros estão temperature, top-p, top-k e max-token, que controlam como o modelo seleciona o próximo token durante a geração de texto. A temperature controla o grau de aleatoriedade: valores baixos tornam as respostas mais previsíveis e consistentes, sendo úteis para tarefas analíticas e estruturadas, enquanto valores altos aumentam a diversidade das respostas, sendo úteis para brainstorming e criação. O top-k limita a seleção aos k tokens mais prováveis em cada etapa; por exemplo, com k=5, o modelo considera apenas os cinco candidatos mais prováveis. Já o top-p, também chamado de nucleus sampling, seleciona o menor conjunto de tokens cuja probabilidade acumulada atinge um determinado limite p, como 0,9, permitindo que a quantidade de candidatos varie conforme a distribuição de probabilidades. Em geral, valores menores de top-p restringem as opções, enquanto valores maiores permitem mais diversidade. Já Max Tokens é o limite máximo de tokens que um modelo pode gerar em uma resposta ou, dependendo da configuração, utilizar em uma operação. Esses parâmetros podem ser combinados, dependendo da implementação, mas nem todos os modelos ou APIs oferecem os três, e alguns sistemas recomendam ajustar temperature ou top-p, em vez de ambos simultaneamente. Importante: esses parâmetros influenciam a geração de respostas, mas não alteram o conhecimento aprendido pelo modelo nem garantem, por si só, maior precisão."],
  ["O que é um Transformer e porque ele foi revolucionário?","O Transformer é uma arquitetura de rede neural apresentada no artigo Attention Is All You Need, publicado em 2017, que revolucionou o processamento de linguagem natural ao utilizar o mecanismo de self-attention para identificar relações entre os tokens de uma sequência. Diferentemente das arquiteturas recorrentes, como RNNs e LSTMs, que processam os tokens sequencialmente, o Transformer permite processar os tokens de entrada em paralelo durante o treinamento, aproveitando melhor o poder computacional e facilitando o treinamento de modelos em larga escala. Seu mecanismo de atenção calcula relações entre os tokens por meio de matrizes de Query (Q), Key (K) e Value (V), permitindo que cada token atribua diferentes pesos de importância aos demais tokens para construir representações contextualizadas. A arquitetura original possui um encoder, responsável por construir representações da entrada, e um decoder, responsável por gerar a saída; posteriormente, surgiram modelos baseados apenas no encoder, como BERT, e apenas no decoder, como GPT. O Transformer foi revolucionário porque permitiu capturar dependências de longo alcance com maior eficiência de treinamento, escalar para grandes quantidades de dados e parâmetros e servir de base para avanços em tradução automática, geração de texto, sistemas de perguntas e respostas e modelos multimodais. Uma ressalva importante é que, embora o processamento dos tokens de entrada possa ser paralelo durante o treinamento, a geração de texto em modelos autoregressivos como GPT ocorre token a token durante a inferência."],
  ["O que são encoder e decoder?", "O encoder e o decoder são componentes da arquitetura Transformer que desempenham funções diferentes: o encoder processa a entrada para construir representações contextualizadas, enquanto o decoder utiliza informações disponíveis para gerar uma sequência de saída, geralmente token por token. No Transformer original, o encoder recebe os tokens de entrada, transforma-os em embeddings com informação posicional e utiliza camadas de self-attention e feed-forward para representar o contexto de cada token, considerando sua relação com os demais tokens da entrada. O decoder, por sua vez, utiliza masked self-attention para considerar apenas os tokens anteriores da sequência que está gerando e, na arquitetura original, também utiliza cross-attention para consultar as representações produzidas pelo encoder. Por exemplo, em uma tarefa de tradução, o encoder processa “The house is beautiful” e constrói representações contextualizadas; o decoder utiliza essas representações para gerar “A casa é bonita”. Existem também arquiteturas que utilizam apenas um desses componentes: o BERT é baseado em encoder e é utilizado principalmente para compreensão de texto, enquanto o GPT é baseado em decoder e é utilizado principalmente para geração de texto. Assim, a principal diferença é que o encoder constrói representações contextualizadas da entrada, enquanto o decoder é projetado para produzir uma sequência de saída."],
  ["O que é o mecanismo de atenção?","O mecanismo de atenção (Attention) permite que um Transformer identifique quais tokens de uma sequência são mais relevantes para interpretar cada token, considerando o contexto. Para isso, cada token gera três vetores: Query (Q), que representa o que ele procura; Key (K), que representa as características usadas para avaliar sua relevância; e Value (V), que contém a informação que será combinada. O modelo calcula a similaridade entre Q e K por meio do produto escalar, divide o resultado por \(\sqrt{d_k}\), aplica softmax para obter pesos de atenção e utiliza esses pesos para combinar os vetores V. Assim, cada token recebe uma representação contextualizada. Por exemplo, na frase “O banco aprovou o crédito”, a atenção ajuda o modelo a relacionar “banco” com “aprovou” e “crédito”, contribuindo para interpretar o significado da palavra no contexto."],
  ["O que é positional encoding?", "Já o Positional Encoding é o mecanismo que fornece informação sobre a posição dos tokens na sequência, pois o mecanismo de atenção, por si só, não representa explicitamente a ordem das palavras. Essa informação posicional é combinada com os embeddings dos tokens antes do processamento pelas camadas do Transformer. Na arquitetura original, eram utilizadas funções senoidais e cossenoidais para representar as posições; em outras arquiteturas, podem ser utilizados embeddings posicionais aprendidos ou métodos como RoPE (Rotary Positional Embeddings). Por exemplo, “O cachorro mordeu o homem” e “O homem mordeu o cachorro” contêm as mesmas palavras, mas a ordem altera o significado. A informação posicional ajuda o modelo a distinguir essas sequências. Em resumo: a atenção permite relacionar os tokens entre si, enquanto o positional encoding fornece informação sobre a posição e a ordem dos tokens."],
  ["Qual é a função do softmax na atenção?","O Softmax na atenção do Transformer transforma os scores de similaridade entre as matrizes Query (Q) e Key (K) em pesos de atenção que variam entre 0 e 1 e cuja soma é igual a 1. Primeiro, o modelo calcula os scores por meio do produto escalar entre Q e K, divide-os por \(\sqrt{d_k}\) para controlar sua magnitude e, em seguida, aplica o Softmax. Isso converte os scores em uma distribuição de pesos que indica a importância relativa de cada token para o token que está sendo processado. Por exemplo, se um token atribui scores de atenção a três outros tokens, o Softmax pode produzir pesos de 0,7, 0,2 e 0,1, indicando que o primeiro recebe a maior atenção relativa. Esses pesos são então utilizados para realizar uma soma ponderada dos vetores Value (V), gerando uma representação contextualizada. Em resumo: o Softmax transforma os scores de atenção em pesos normalizados que determinam quanto cada token contribui para a representação do token atual."],
  ["O que é self-attention?", "Self-attention é o mecanismo do Transformer que permite que cada token de uma sequência analise a relação com os demais tokens da mesma sequência para construir uma representação contextualizada. Para isso, cada token gera três vetores: Query (Q), que representa o que ele procura; Key (K), que representa as características usadas para avaliar a relevância dos outros tokens; e Value (V), que contém a informação que será combinada. O modelo calcula a similaridade entre Q e K, aplica o Softmax para transformar os scores em pesos de atenção e utiliza esses pesos para fazer uma soma ponderada dos vetores V. Por exemplo, na frase “O animal não atravessou a rua porque estava cansado”, o mecanismo pode aprender a relacionar “estava cansado” com “animal”, ajudando a representar o contexto da frase. O termo self indica que Q, K e V são gerados a partir da mesma sequência de entrada, diferentemente da cross-attention, em que as consultas vêm de uma sequência e as chaves e valores vêm de outra. Uma das grandes vantagens do self-attention é permitir que tokens distantes se relacionem diretamente, facilitando o aprendizado de dependências de longo alcance e possibilitando o processamento paralelo dos tokens durante o treinamento."],
  ["O que é multi-head attention?", "O Multi-Head Attention é um mecanismo do Transformer que executa várias operações de atenção em paralelo, permitindo que o modelo aprenda diferentes tipos de relações entre os tokens de uma sequência. Cada head possui suas próprias matrizes de pesos para projetar os embeddings em Query (Q), Key (K) e Value (V), calculando diferentes padrões de atenção. Ao final, os resultados das cabeças são concatenados e passam por uma transformação linear para formar uma representação contextualizada mais rica. Por exemplo, na frase “A menina colocou o livro na mesa porque ele era pesado”, diferentes cabeças podem aprender a identificar relações distintas: uma pode relacionar “ele” a “livro”, outra pode capturar a relação entre “colocou” e “mesa”, enquanto outra pode aprender padrões sintáticos entre os termos. Em geral, as cabeças podem aprender relações sintáticas, como sujeito e verbo; relações semânticas, como palavras que se referem à mesma entidade; dependências de longo alcance, conectando tokens distantes; e relações contextuais, que ajudam a interpretar palavras ambíguas conforme a frase. Esses padrões não são definidos manualmente: são aprendidos durante o treinamento, e nem sempre cada cabeça corresponde a um tipo de relação claramente identificável."],
  ["O que é o modelo GPT?", "GPT (Generative Pre-trained Transformer) é uma família de modelos de inteligência artificial baseada na arquitetura Transformer, projetada principalmente para compreender instruções e gerar textos. O nome representa três características: Generative significa que o modelo gera conteúdo; Pre-trained indica que ele passa por um treinamento inicial em grandes volumes de dados para aprender padrões da linguagem; e Transformer é a arquitetura neural que utiliza mecanismos de atenção para relacionar os tokens e construir representações contextualizadas. Os modelos GPT são baseados principalmente na arquitetura decoder-only, utilizando causal self-attention para prever o próximo token a partir dos tokens anteriores. Durante o pré-treinamento, o modelo aprende ajustando seus parâmetros para aumentar a probabilidade de sequências observadas nos dados. Posteriormente, pode passar por etapas adicionais, como fine-tuning supervisionado e alinhamento por preferências humanas, para seguir instruções com mais qualidade. Durante a geração, o modelo prevê um token por vez, adiciona-o à sequência e utiliza o contexto atualizado para prever o próximo. Esse processo se repete até a resposta ser concluída. Assim, o GPT consegue realizar tarefas como responder perguntas, resumir textos, escrever código e traduzir idiomas, sem necessariamente ter sido treinado especificamente para cada tarefa."],
  ["O que é o modelo BERT?", "O BERT (Bidirectional Encoder Representations from Transformers) é um modelo de linguagem desenvolvido pelo Google, baseado na arquitetura encoder-only do Transformer, projetado principalmente para compreender o contexto e o significado dos textos. Diferentemente do GPT, que utiliza atenção causal para prever o próximo token, o BERT utiliza bidirectional self-attention, permitindo que cada token considere tanto os tokens anteriores quanto os posteriores durante a construção de suas representações contextuais. Seu pré-treinamento original utiliza principalmente duas tarefas: Masked Language Modeling (MLM), em que alguns tokens são ocultados e o modelo aprende a recuperá-los a partir do contexto dos dois lados; e Next Sentence Prediction (NSP), em que o modelo aprende a identificar se uma sentença sucede outra no texto original. Após o pré-treinamento, o BERT pode ser ajustado (fine-tuning) para tarefas específicas, como classificação de sentimentos, classificação de documentos, reconhecimento de entidades nomeadas e resposta a perguntas. Por utilizar o encoder, ele é especialmente adequado para tarefas de compreensão textual, mas não foi originalmente projetado para gerar textos longos de forma autoregressiva como o GPT. Em resumo: BERT é focado em compreender representações contextuais bidirecionais, enquanto GPT é focado em gerar sequências prevendo o próximo token."],
  ["O que são modelos autoregressivos (AR)?","São modelos que geram cada elemento condicionado aos elementos anteriores, estimando uma distribuição de probabilidades. O texto é tokenizado; o modelo estima a distribuição do próximo token e um token é selecionado. O novo token entra no contexto e o processo continua. Eles geram um elemento por vez, usam o contexto já produzido para prever o próximo e repetem o processo até completar a sequência."],
  ["O que é O que é RLHF??", "RLHF (Reinforcement Learning from Human Feedback) é uma técnica de alinhamento de modelos de linguagem que utiliza avaliações humanas para orientar o comportamento da LLM, tornando suas respostas mais úteis, coerentes e alinhadas às preferências humanas. O processo tradicional envolve três etapas principais: primeiro, o modelo passa pelo pré-treinamento para aprender padrões da linguagem; depois, recebe fine-tuning supervisionado (SFT) com exemplos de respostas desejadas; por fim, avaliadores humanos comparam diferentes respostas do modelo, e essas preferências são utilizadas para treinar um modelo de recompensa (Reward Model), que estima quais respostas são preferíveis. Em seguida, técnicas de aprendizado por reforço, como o PPO (Proximal Policy Optimization), ajustam a política do modelo para favorecer respostas com maior recompensa, normalmente com uma penalização para evitar que ele se afaste excessivamente do modelo de referência. Por exemplo, se uma LLM produzir duas respostas para a mesma pergunta e avaliadores preferirem a resposta mais clara, útil e segura, essas preferências ajudam a construir o sinal de recompensa usado na otimização. O RLHF é diferente do pré-treinamento, pois não busca apenas aprender padrões da linguagem, mas ajustar o comportamento do modelo de acordo com preferências humanas. Existem também outras técnicas de alinhamento, como DPO (Direct Preference Optimization), que utiliza pares de respostas preferidas e rejeitadas sem exigir o treinamento separado de um modelo de recompensa tradicional nem o mesmo ciclo de RL do PPO."],
  ["O que é LangChain?", "LangChain é um framework de desenvolvimento que facilita a construção de aplicações com modelos de linguagem (LLMs), oferecendo componentes para conectar o modelo a prompts, documentos, APIs, bancos de dados e ferramentas externas. Ele permite organizar fluxos de processamento, criar sistemas RAG e desenvolver agentes capazes de consultar fontes de informação e executar ações."],
  ["O que é LangGraph?", "LangGraph é um framework para construir agentes e aplicações com LLMs por meio de fluxos de execução organizados como grafos. Ele permite definir nós (nodes), que executam etapas como chamar uma LLM, consultar uma API ou processar dados, e arestas (edges), que determinam como a execução passa de uma etapa para outra. Diferentemente de um fluxo linear, o LangGraph permite criar ciclos, decisões condicionais, repetição de etapas e mecanismos de persistência de estado, possibilitando que um agente execute ações, avalie os resultados e decida o próximo passo. Por exemplo, em um agente de análise de dados, um nó pode interpretar a pergunta do usuário, outro executar uma consulta SQL e outro verificar se o resultado é suficiente; se houver um erro, o fluxo pode retornar à etapa de consulta para tentar novamente. O LangGraph também oferece recursos para manter o estado da execução, retomar processos e incluir aprovação humana antes de ações críticas. Em resumo: o LangChain fornece componentes para integrar LLMs, ferramentas e dados, enquanto o LangGraph permite orquestrar fluxos mais complexos, com estado, ciclos e decisões condicionais, sendo especialmente útil para agentes que precisam executar múltiplas etapas."],
  ["O que é LangSmith?", "LangSmith é uma plataforma de observabilidade, avaliação e depuração de aplicações que utilizam LLMs e agentes de IA. Ela permite rastrear a execução das aplicações (tracing), registrar entradas e saídas, acompanhar chamadas de ferramentas, identificar erros e analisar o desempenho de cada etapa de um fluxo."],
  ["O que é Prompt Caching?", "Prompt Caching é uma técnica que permite reutilizar o processamento de partes de um prompt que se repetem em várias chamadas à LLM, reduzindo a latência e, dependendo do provedor, o custo de utilização. É especialmente útil quando uma aplicação envia instruções de sistema extensas, documentos de referência ou contextos longos que permanecem iguais entre diferentes solicitações."],
  ["Explique como se dá a interação do agente com a entrada de um novo prompt.", "Quando um agente de IA recebe um novo prompt, a aplicação reúne as instruções de sistema, o histórico relevante e a mensagem do usuário, que é tokenizada para ser processada pela LLM. O modelo interpreta a solicitação e pode responder diretamente ou identificar a necessidade de consultar fontes externas ou utilizar ferramentas. Se o agente utilizar RAG, a pergunta pode ser convertida em um embedding para buscar documentos semanticamente relevantes em um banco vetorial; os trechos recuperados são adicionados ao contexto enviado à LLM, que os utiliza para formular a resposta. Se precisar de informações atualizadas, o agente também pode consultar APIs ou bancos de dados. Quando há ferramentas envolvidas, a LLM pode solicitar sua execução, receber os resultados e continuar o processamento até concluir a tarefa. Por fim, a resposta é gerada, geralmente token a token."],
  ["O que é Knowledge distillation?", "Knowledge distillation (destilação de conhecimento) é uma técnica de Machine Learning na qual um modelo maior e mais complexo, chamado teacher (professor), transfere parte do conhecimento aprendido para um modelo menor e mais eficiente, chamado student (aluno). Em vez de aprender apenas com os rótulos reais dos dados, o student também aprende com as previsões e probabilidades produzidas pelo teacher, que carregam informações sobre como ele diferencia as classes. Por exemplo, um modelo teacher pode classificar uma imagem como 80% gato e 20% cachorro; o student aprende não apenas que a imagem é um gato, mas também essa distribuição de probabilidades. O objetivo é obter um modelo mais leve, rápido e barato para inferência, tentando preservar o desempenho do modelo original. Essa técnica é muito utilizada para reduzir o custo de implantação de redes neurais e LLMs."],
  ["O que é uma golden set e como usar em validação?", "Uma golden set é um conjunto de dados de referência cuidadosamente selecionado, composto por entradas e suas respectivas respostas esperadas ou avaliações de qualidade. Em sistemas de IA generativa e LLMs, ela é utilizada para validar e comparar o desempenho do modelo. Por exemplo, em um chatbot bancário, a golden set pode conter 200 perguntas reais ou representativas sobre cartões, empréstimos e investimentos, acompanhadas das respostas corretas ou dos critérios que uma boa resposta deve atender. Para utilizá-la na validação, você envia as perguntas ao modelo, compara as respostas geradas com as referências e avalia critérios como correção factual, relevância, completude, aderência às instruções e presença de alucinações. A avaliação pode ser feita por especialistas humanos, por métricas automatizadas ou por outro LLM como avaliador (LLM-as-a-judge). Em sistemas RAG, a golden set também pode incluir os documentos ou trechos que deveriam ser recuperados, permitindo avaliar tanto a qualidade da recuperação quanto a resposta final. É importante manter a golden set separada dos dados usados para ajustar o modelo, evitando que ele simplesmente memorize as respostas. Ela também pode ser reutilizada após mudanças no prompt, no modelo ou no pipeline para verificar se houve melhoria ou regressão de desempenho."],
  ["O que é Human in the Loop?", "É uma abordagem em que seres humanos participam de alguma etapa do ciclo de vida de um modelo de IA, seja para revisar dados, validar previsões, corrigir respostas ou aprovar decisões. O objetivo é combinar a capacidade de processamento e automação do modelo com o julgamento humano, aumentando a qualidade e a segurança dos resultados."],
  ["O que é Tool Calling?", "É a capacidade de um LLM identificar quando precisa utilizar uma ferramenta externa para executar uma ação ou obter informações que não estão disponíveis diretamente em seu contexto."],
  ["Quais os tipos de memória do agente?", "Os agentes de IA podem utilizar diferentes tipos de memória: a memória de curto prazo mantém o contexto da interação atual; a memória de longo prazo armazena informações para uso futuro; a memória episódica registra experiências e resultados de tarefas anteriores; a memória semântica armazena fatos e conhecimentos gerais; e a memória procedural guarda instruções e procedimentos sobre como executar tarefas. Essas memórias permitem que o agente mantenha o contexto, recupere informações e reutilize conhecimentos em diferentes situações."],
  ["Quais as maneiras de calcular similaridade em RAG?", "Em RAG, a similaridade de cosseno e o produto escalar são comuns na busca por embeddings, mas a escolha depende do modelo de embeddings e de como os vetores foram treinados e normalizados."],
  ["Qual a diferença entre LLM e SLM?", "LLM (Large Language Model) é um modelo de linguagem de grande porte, geralmente treinado com grandes volumes de dados e com muitos parâmetros, capaz de executar tarefas complexas, como geração de texto, raciocínio e programação. Já o SLM (Small Language Model) é um modelo de linguagem menor, que normalmente exige menos memória e poder computacional, apresenta menor custo e pode ter menor latência."],
  ["Explique a evolução de BoW, TF-IDF, word2vec e embeddings contextuais", "A evolução de BoW, TF-IDF, Word2Vec e embeddings ocorreu na forma de representar textos numericamente: o BoW representa palavras pela frequência, sem considerar significado ou ordem; o TF-IDF aprimora essa abordagem atribuindo maior peso às palavras mais relevantes e menos comuns no corpus; o Word2Vec aprende vetores densos a partir dos contextos das palavras, capturando relações semânticas, mas atribui um vetor fixo a cada palavra; já os embeddings contextuais, utilizados em modelos como Transformers, geram representações que consideram o contexto, permitindo que uma mesma palavra tenha vetores diferentes conforme seu significado na frase."],
  ["O que são LoRA e QLoRa?", "LoRA (Low-Rank Adaptation) é uma técnica de PEFT (Parameter-Efficient Fine-Tuning) que adapta um modelo pré-treinado sem precisar atualizar todos os seus pesos: em vez disso, adiciona pequenas matrizes treináveis de baixa dimensão, reduzindo os parâmetros treináveis e o custo de memória. QLoRA (Quantized LoRA) combina LoRA com a quantização do modelo original, geralmente para 4 bits, reduzindo ainda mais o consumo de memória durante o fine-tuning."],
  ["O que é Perplexidade?", "É uma métrica para avaliar modelos de linguagem, medindo o quanto o modelo fica incerto ao prever a próxima palavra ou token de uma sequência. Ela é calculada a partir da entropia cruzada: quanto menor a perplexidade, maior a capacidade do modelo de atribuir probabilidades aos tokens corretos. Uma perplexidade de 10 pode ser interpretada, intuitivamente, como uma incerteza equivalente a escolher entre cerca de 10 possibilidades igualmente prováveis"],
  ["O que é ROUGE e BLEU?", "O ROUGE prioriza a cobertura do conteúdo da referência na resposta gerada, sendo muito utilizado em tarefas de sumarização, enquanto o BLEU mede a precisão de sequências de palavras (n-grams) da resposta gerada em relação às referências, sendo tradicionalmente utilizado em tradução automática. Ambas avaliam a sobreposição textual, mas podem não reconhecer sinônimos ou paráfrases semanticamente corretas."],
  ["O que é BERTScore?", "BERTScore é uma métrica para avaliar textos gerados por modelos de IA comparando suas representações semânticas com as de um texto de referência, utilizando embeddings contextuais de modelos como o BERT, podendo então reconhecer sinônimos."]
 ],
}
];

let current=0;
const nav=document.getElementById("nav");
const content=document.getElementById("content");


function escapeHtml(s){
 return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function isTopicReviewed(index){
  return localStorage.getItem("reviewed-topic-"+topics[index].id) === "1";
}

function setTopicReviewed(index, checked){
  const id = topics[index].id;
  if(checked) localStorage.setItem("reviewed-topic-"+id, "1");
  else localStorage.removeItem("reviewed-topic-"+id);
  updateProgress();
  buildNav();
}

function buildNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = "";

  topics.forEach((t,i)=>{
    const row = document.createElement("div");
    row.className = "nav-row" + (i === current ? " active-row" : "");

    const btn = document.createElement("button");
    btn.className = i === current ? "active" : "";
    btn.innerHTML = `
      <span class="navnum">${escapeHtml(String(t.num ?? i+1).padStart(2,"0"))}</span>
      <span class="navtitle">${escapeHtml(t.title)}</span>
    `;
    btn.onclick = ()=>{
      current = i;
      buildNav();
      render();
      document.querySelector(".main").scrollTo({top:0, behavior:"smooth"});
    };

    const check = document.createElement("button");
    check.type = "button";
    check.className = "review-check" + (isTopicReviewed(i) ? " checked" : "");
    check.setAttribute("aria-label", isTopicReviewed(i) ? `Marcar ${t.title} como não revisado` : `Marcar ${t.title} como revisado`);
    check.title = isTopicReviewed(i) ? "Revisado — clique para desmarcar" : "Marcar como revisado";
    check.innerHTML = isTopicReviewed(i) ? "✓" : "";
    check.onclick = (e)=>{
      e.stopPropagation();
      setTopicReviewed(i, !isTopicReviewed(i));
    };

    row.appendChild(btn);
    row.appendChild(check);
    nav.appendChild(row);
  });
}


function wrapSvgText(text, maxChars){
 const words=String(text||"").split(/\s+/);
 const lines=[]; let line="";
 words.forEach(w=>{
   if((line+" "+w).trim().length>maxChars){
     if(line.trim()) lines.push(line.trim());
     line=w;
   }else line+=" "+w;
 });
 if(line.trim()) lines.push(line.trim());
 return lines;
}
function svgText(lines,x,y,opts={}){
 const size=opts.size||10, weight=opts.weight||500, anchor=opts.anchor||"start";
 const hideBody = opts.hideBody !== false;
 return `<text x="${x}" y="${y}" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}">`+
   lines.map((l,i)=>{
     const cls = (hideBody && i>0) ? ' class="quiz-hidden"' : '';
     return `<tspan${cls} x="${x}" dy="${i===0?0:size+3.5}">${escapeHtml(l)}</tspan>`;
   }).join("")+
   `</text>`;
}
