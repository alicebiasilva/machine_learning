<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Machine Learning Cards</title>
<style>
:root{
  --bg:#f5f7fb; --panel:#ffffff; --text:#172033; --muted:#68738a;
  --line:#e3e8f1; --accent:#5b5bd6; --accent2:#7c3aed; --soft:#eef0ff;
  --good:#159570; --warn:#d97706; --danger:#dc4c64; --shadow:0 12px 35px rgba(26,32,52,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
.app{display:flex;min-height:100vh}
.sidebar{width:330px;background:#131b27;color:#e8edf7;position:fixed;inset:0 auto 0 0;overflow:auto;padding:24px 16px;z-index:20;border-right:1px solid #1b2a3d;box-shadow:8px 0 30px rgba(0,0,0,.18)}
.brand{padding:6px 10px 20px;border-bottom:1px solid #1b2a3d;margin-bottom:16px}
.brand h1{font-size:20px;margin:0 0 6px;color:#ffffff}
.brand p{font-size:12px;color:#8d9bb3;margin:0;line-height:1.5}
.search{position:relative;margin:14px 0}
.search input{width:100%;padding:11px 12px 11px 36px;border-radius:10px;border:1px solid #24364d;background:#0d1a2b;color:#fff;outline:none}
.search span{position:absolute;left:12px;top:10px;color:#8d9bb3}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:9px 10px;border:1px solid transparent;border-radius:9px;background:transparent;color:#c8d2e3;cursor:pointer;font-size:13px}
.nav button:hover{background:#102237;border-color:#1d3a58;color:#fff}
.nav button.active{background:linear-gradient(90deg,#f04f9b,#c83f8d);border-color:#ff63aa;color:#fff;box-shadow:0 0 18px rgba(240,79,155,.18)}
.nav .num{width:25px;height:25px;display:grid;place-items:center;border-radius:7px;background:#101f32;border:1px solid #29415c;color:#9fb0c7;font-size:11px;font-weight:700;flex:none}
.nav button.active .num{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28);color:#fff}
.progress{margin-top:18px;padding:13px;border-radius:12px;background:#0d1a2b;border:1px solid #1b2a3d}
.progress-top{display:flex;justify-content:space-between;font-size:12px;color:#9fb0c7;margin-bottom:8px}
.bar{height:7px;border-radius:20px;background:#1c2b40;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#4b9dff,#f04f9b);width:0;transition:.25s}
.main{margin-left:330px;width:calc(100% - 330px);padding:30px;max-width:1500px;transition:margin-left .25s ease,width .25s ease}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}
.eyebrow{font-size:12px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
h2{font-size:32px;line-height:1.1;margin:5px 0 8px}
#pageTitle{color:#07111f}
.subtitle{color:var(--muted);margin:0;max-width:850px;line-height:1.6}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 12px;border-radius:9px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.btn:hover{border-color:#c7cdfd}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:1.5fr .9fr;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:17px}
.hero{padding:25px;background:linear-gradient(135deg,#fff,#f3f2ff);border-color:#dddfff}
.hero .tag{display:inline-block;padding:5px 8px;border-radius:20px;background:var(--soft);color:var(--accent);font-size:11px;font-weight:800}
.hero p{line-height:1.65;color:#4e596e}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#f0f2f8;color:#586278;font-weight:700}
.summary{line-height:1.7;color:#3f495c}
.summary strong{color:#1c2434}
ul{padding-left:20px;line-height:1.65}
li{margin:3px 0}
.concept-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.concept{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.concept h4{margin:0 0 6px;font-size:14px}
.concept p{margin:0;color:#5d687b;font-size:13px;line-height:1.55}
.formula{font-family:"SFMono-Regular",Consolas,monospace;background:#f5f6fa;border:1px solid #e4e7ef;border-radius:10px;padding:11px;margin:8px 0;color:#252b3b;overflow:auto}
.alert{border-left:4px solid var(--warn);background:#fff8ed;padding:12px 14px;border-radius:8px;color:#62420d;font-size:13px;line-height:1.55}
.tip{border-left:4px solid var(--good);background:#eefaf6;padding:12px 14px;border-radius:8px;color:#155844;font-size:13px;line-height:1.55}
.interview{border-left:4px solid var(--accent);background:#f1f1ff;padding:12px 14px;border-radius:8px;color:#343476;font-size:13px;line-height:1.55}
.checklist{display:grid;gap:8px}
.check{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.45}
.check input{margin-top:3px;accent-color:var(--accent)}
.mindmap{min-height:700px;position:relative;overflow:auto;background:radial-gradient(circle at center,#f9f9ff 0,#fff 55%);border:1px solid var(--line);border-radius:14px}
.mindmap svg{width:100%;min-width:1100px;height:auto;min-height:700px}
.node rect{fill:#fff;stroke:#d9deea;stroke-width:1.5}
.node text{fill:#263047;font-size:12px;font-weight:700}
.node.center rect{fill:#5b5bd6;stroke:#5b5bd6}
.node.center text{fill:#fff}
.branch{stroke:#cdd3e3;stroke-width:2}
.node.branch1 rect{fill:#f1f1ff;stroke:#bdbdf4}
.node.branch2 rect{fill:#eefaf6;stroke:#b7e5d6}
.node.branch3 rect{fill:#fff6e9;stroke:#efd4a7}
.node.branch4 rect{fill:#f7f0ff;stroke:#ddc5f4}
.node.conceptNode rect{fill:#fbfcff;stroke:#d9deea}
.node.formulaNode rect{fill:#fff9ed;stroke:#efd39d}
.node.interviewNode rect{fill:#f1f1ff;stroke:#c9c9f4}
.node.checklistNode rect{fill:#eefaf6;stroke:#b8e2d4}
.node.footerNode rect{fill:#f7f8fb;stroke:#dce1ea}
.footer{margin:22px 0;color:#8a93a5;font-size:11px;text-align:center}
.mobile-toggle{display:inline-flex;align-items:center;justify-content:center;gap:7px}

.brand-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sidebar-toggle{
  flex:0 0 30px;
  width:30px;
  height:30px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin:0;
  padding:0;
  border:1px solid #29415c;
  border-radius:7px;
  background:#0d1a2b;
  color:#e8edf7;
  cursor:pointer;
  font-size:15px;
  font-weight:700;
  transition:.2s ease;
}
.sidebar-toggle:hover{background:#102237;border-color:#4b9dff;color:#fff}
.app.menu-collapsed .sidebar-toggle{width:30px;height:30px;margin:0;padding:0}
.app.menu-collapsed .brand-title-row{justify-content:center}
.app.menu-collapsed .sidebar-toggle span{display:none}

/* ===== Menu lateral recolhível ===== */
.app.menu-collapsed .sidebar{width:5px;padding-left:20px;padding-right:50px}
.app.menu-collapsed .main{margin-left:76px;width:calc(100% - 76px)}
.app.menu-collapsed .brand{padding-left:4px;padding-right:4px;text-align:center}
.app.menu-collapsed .brand h1,.app.menu-collapsed .brand p{display:none}
.app.menu-collapsed .progress{display:none}
.app.menu-collapsed .nav button{justify-content:center;padding-left:6px;padding-right:6px}
.app.menu-collapsed .navtitle,.app.menu-collapsed .review-check{display:none}
.app.menu-collapsed .nav-row{justify-content:center}
.app.menu-collapsed .nav .num{margin:0}

@media(max-width:800px){
  .app.menu-collapsed .sidebar{width:300px}
  .app.menu-collapsed .main{margin-left:0;width:100%}
}

@media(max-width:1050px){
  .grid{grid-template-columns:1fr}
}
@media(max-width:800px){
  .sidebar{transform:translateX(-100%);transition:.25s;width:300px}
  .sidebar.open{transform:none}
  .main{margin-left:0;width:100%;padding:18px}
  h2{font-size:26px}
  .concept-grid,.stats{grid-template-columns:1fr}
}
@media print{
  .sidebar,.actions{display:none!important}
  .main{margin:0;width:100%;padding:0}
  .card{box-shadow:none}
}

.study-canvas{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.canvas-header{
  padding:18px 20px 12px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--card),var(--soft));
}
.canvas-kicker{
  font-size:10px;
  font-weight:800;
  letter-spacing:.12em;
  color:var(--accent);
  margin-bottom:4px;
}
.canvas-header h3{
  margin:0;
  font-size:22px;
}
.canvas-header p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:12px;
}
.study-canvas .mindmap{
  margin:0;
  border:0;
  border-radius:0;
  min-height:820px;
  overflow:auto;
}
.nav{
  overflow-y:auto;
  padding-bottom:20px;
}
.nav button{
  min-height:42px;
}




/* ===== Controles superiores ===== */
.top-control{
  border:1px solid #d9def0;
  background:linear-gradient(135deg,#ffffff,#f5f6ff);
  color:#25315f;
  padding:10px 16px;
  min-height:42px;
  border-radius:999px;
  cursor:pointer;
  font-weight:750;
  font-size:13px;
  letter-spacing:.01em;
  box-shadow:0 4px 12px rgba(42,50,100,.08);
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
}
.top-control:hover{
  transform:translateY(-1px);
  border-color:#bfc7f4;
  background:linear-gradient(135deg,#ffffff,#eef0ff);
  box-shadow:0 7px 18px rgba(42,50,100,.13);
}
.top-control:active{transform:translateY(0);}
#quizBtn{
  color:#f04f9b;
  background:linear-gradient(135deg,#fff,#fff0f7);
  border-color:#f3b4d2;
}
#quizBtn:hover{
  color:#d83f8f;
  background:linear-gradient(135deg,#fff,#ffe5f1);
  border-color:#ef8fba;
}
#ementaBtn{
  color:#f04f9b;
  background:linear-gradient(135deg,#ffffff,#eef4ff);
  border-color:#f3b4d2;
}
#ementaBtn:hover{
  color:#d83f8f;
  background:linear-gradient(135deg,#ffffff,#e5edff);
  border-color:#ef8fba;
}
.ementa-modal{
  position:fixed; inset:0; z-index:10000; display:none;
  align-items:center; justify-content:center; padding:24px;
  background:rgba(7,17,31,.76); backdrop-filter:blur(5px);
}
.ementa-modal.open{display:flex}
.ementa-dialog{
  width:min(760px,94vw); max-height:88vh; overflow:auto;
  background:#fff; border:1px solid #d9e0ee; border-radius:18px;
  padding:24px; box-shadow:0 22px 70px rgba(0,0,0,.28);
}
.ementa-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.ementa-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:#f04f9b;margin-bottom:4px}
.ementa-title{margin:0;color:#07111f;font-size:25px;line-height:1.15}
.ementa-subtitle{margin:7px 0 0;color:#68738a;line-height:1.5;font-size:13px}
.ementa-close{width:36px;height:36px;border-radius:50%;border:1px solid #d9def0;background:#f7f9fc;color:#26304e;cursor:pointer;font-size:21px;line-height:1}
.ementa-close:hover{border-color:#f04f9b;color:#d83f8f}
.ementa-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ementa-section{border:1px solid #e3e8f1;border-radius:13px;padding:15px;background:#fbfcfe}
.ementa-section h4{margin:0 0 9px;color:#26304e;font-size:14px}
.ementa-section ul{margin:0;padding-left:19px;color:#4e596e;font-size:13px;line-height:1.55}
.ementa-section li{margin:5px 0}
.ementa-section.study{border-color:#f2c2da;background:#fff7fb}
.ementa-section.study h4{color:#d83f8f}
.ementa-section.trap{border-color:#cbd9f2;background:#f5f8ff}
.ementa-section.trap h4{color:#31558e}
@media(max-width:720px){
  .ementa-modal{padding:9px}
  .ementa-dialog{padding:18px;max-height:94vh}
  .ementa-grid{grid-template-columns:1fr}
}
#quizBtn.quiz-on{
  font-weight:800;
  box-shadow:0 0 0 3px rgba(240,79,155,.12), 0 7px 18px rgba(240,79,155,.10);
}
#reviewImageBtn{
  color:#f04f9b;
  background:linear-gradient(135deg,#fff,#fff0f7);
  border-color:#f3b4d2;
}
#reviewImageBtn:hover{
  color:#d83f8f;
  background:linear-gradient(135deg,#fff,#ffe5f1);
  border-color:#ef8fba;
}
@media(max-width:720px){
  .top-control{padding:9px 13px;font-size:12px;}
}


/* ===== Layout estilo ficha/mapa de revisão ===== */
.study-canvas{
  width:100%;
  min-height:100%;
  padding:18px;
  box-sizing:border-box;
}
.mindmap-board{
  width:100%;
  max-width:1480px;
  margin:0 auto;
}
.map-hero{
  border:1px solid #c7d0f5;
  border-radius:16px;
  padding:16px 24px 14px;
  margin-bottom:14px;
  background:linear-gradient(135deg,#edf1ff,#fafaff);
  box-shadow:0 3px 12px rgba(30,40,90,.07);
  text-align:center;
}
.map-hero-title{
  font-size:29px;
  line-height:1.1;
  font-weight:900;
  letter-spacing:-.035em;
  color:#17205d;
}
.map-hero-subtitle{
  margin-top:6px;
  font-size:12.5px;
  line-height:1.4;
  color:#4b5563;
}
.map-columns{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  align-items:start;
}
.map-column{
  display:flex;
  flex-direction:column;
  gap:14px;
  min-width:0;
}
.map-card{
  position:relative;
  border:1.5px solid #d7dce8;
  border-radius:14px;
  padding:14px 16px 16px;
  box-sizing:border-box;
  min-width:0;
  box-shadow:0 3px 10px rgba(31,41,55,.055);
  overflow:hidden;
  transition:transform .15s ease,box-shadow .15s ease,outline .15s ease;
}
.map-card:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 16px rgba(31,41,55,.09);
}
.map-card.topic{min-height:125px}
.map-card.concept{min-height:142px}
.map-card.special{min-height:155px}
.map-card-title{
  font-size:14.5px;
  line-height:1.2;
  font-weight:850;
  color:#172554;
  margin-bottom:9px;
}
.map-card-body .card-visual{display:block;width:100%;height:auto;margin:0 0 12px;border-radius:10px;background:rgba(127,127,127,.05)}
.map-card-body{
  color:#1f2937;
  font-size:12.1px;
  line-height:1.55;
  white-space:pre-line;
}
.formula-body{
  font-family:Georgia,"Times New Roman",serif;
  font-size:14px;
  line-height:1.7;
}
.map-bottom{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-top:14px;
}
.checklist-body{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.check-item{
  font-size:11.5px;
  line-height:1.38;
}

/* Pastéis próximos ao visual de referência. */
.tone-0{background:#edf4ff;border-color:#a9c7f3}
.tone-1{background:#eef9f4;border-color:#a8dccb}
.tone-2{background:#f3efff;border-color:#c8b9ed}
.tone-3{background:#fff4df;border-color:#f0c77f}
.tone-4{background:#fff0f7;border-color:#edb5d1}

/* Quiz: a caixa e o título ficam; apenas o conteúdo é ofuscado. */
.quiz-active .map-card{cursor:pointer}
.quiz-active .map-card-body{
  filter:blur(7px);
  opacity:.14;
  user-select:none;
}
.quiz-active .map-card.quiz-revealed .map-card-body{
  filter:none;
  opacity:1;
}
.quiz-active .map-card:hover{
  outline:2px solid var(--accent);
  outline-offset:1px;
}
#quizBtn.quiz-on{
  font-weight:800;
  box-shadow:0 0 0 2px var(--accent);
}
@media (max-width:1050px){
  .map-columns,.map-bottom{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  .study-canvas{padding:9px}
  .map-columns,.map-bottom{grid-template-columns:1fr}
  .map-hero-title{font-size:25px}
}


/* ===== Quiz: flashcard feedback ===== */
.quiz-feedback{
  display:none;
  gap:7px;
  justify-content:flex-end;
  align-items:center;
  margin-top:11px;
  padding-top:9px;
  border-top:1px solid rgba(80,90,110,.16);
}
.quiz-active .quiz-feedback{
  display:flex;
}
.quiz-feedback button{
  border:1px solid rgba(80,90,110,.22);
  background:rgba(255,255,255,.72);
  border-radius:9px;
  min-width:38px;
  height:32px;
  font-size:17px;
  cursor:pointer;
  transition:transform .12s ease, background .12s ease, border-color .12s ease;
}
.quiz-feedback button:hover{
  transform:scale(1.06);
}
.quiz-feedback button.selected-correct{
  background:#dcfce7;
  border-color:#6fc48a;
}
.quiz-feedback button.selected-wrong{
  background:#fee2e2;
  border-color:#e58b8b;
}
.quiz-active .map-card.feedback-correct{
  box-shadow:0 0 0 2px rgba(54,160,91,.42), 0 5px 14px rgba(31,41,55,.07);
}
.quiz-active .map-card.feedback-wrong{
  box-shadow:0 0 0 2px rgba(210,70,70,.42), 0 5px 14px rgba(31,41,55,.07);
}
.quiz-active.review-wrong .map-card:not(.feedback-wrong){
  display:none;
}
#reviewWrongBtn{
  display:none;
}
#reviewWrongBtn.has-errors{
  display:inline-flex;
}
#reviewWrongBtn.reviewing{
  font-weight:800;
  box-shadow:0 0 0 2px var(--accent);
}
.quiz-feedback .feedback-label{
  font-size:10px;
  color:#6b7280;
  margin-right:2px;
}


/* ===== Revisão por tópico no menu ===== */
.nav-row{
  display:flex;
  align-items:center;
  gap:5px;
  width:100%;
}
.nav-row > button:first-child{
  flex:1;
  min-width:0;
}
.nav-row.active-row > button:first-child{
  background:#26304e;
}
.navtitle{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.review-check{
  flex:0 0 29px;
  width:29px !important;
  height:29px;
  padding:0 !important;
  display:flex !important;
  align-items:center;
  justify-content:center;
  border:1px solid #56617f !important;
  border-radius:8px !important;
  background:#171d32 !important;
  color:#dce7ff !important;
  font-size:17px !important;
  font-weight:900;
  cursor:pointer;
}
.review-check:hover{
  border-color:#8ea7e8 !important;
  background:#222b48 !important;
}
.review-check.checked{
  background:#4565b7 !important;
  border-color:#7895e8 !important;
  color:#fff !important;
}
.progress{
  margin-top:14px;
  margin-bottom:14px;
}


.map-visual-card{
  margin-top:14px;
  border:1.5px solid #d7dce8;
  border-radius:14px;
  padding:13px 16px 12px;
  background:#f8fafc;
  box-shadow:0 3px 10px rgba(31,41,55,.045);
}
.visual-wrap{
  width:100%;
  min-height:145px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.visual-wrap svg{
  width:100%;
  max-width:650px;
  height:155px;
}


/* ===== Resumo visual ===== */
#reviewImageModal{
  position:fixed; inset:0; z-index:9999; display:none;
  align-items:center; justify-content:center; padding:24px;
  background:rgba(10,14,30,.78); backdrop-filter:blur(4px);
}
#reviewImageModal.open{display:flex}
.review-image-dialog{
  position:relative; width:min(96vw,1500px); max-height:94vh;
  display:flex; flex-direction:column; gap:10px;

<script>
const topics = [
  {
id:"topicos_introdutorios",
num:"01",
title:"Tópicos introdutórios",
section:"Tópicos introdutórios",
cards:[
  ["O que é Inteligência Artificial (IA)?","É o campo que desenvolve sistemas capazes de executar tarefas que normalmente exigiriam capacidades associadas à inteligência humana, como percepção, raciocínio, planejamento, linguagem e tomada de decisão, usando regras lógicas e matemáticas, que pode envolver desde automações até modelos sofisticados."],
  ["O que é Machine Learning?","É uma subárea da IA em que algoritmos aprendem padrões a partir de dados para fazer previsões, classificações, decisões ou descobrir estruturas, em vez de depender apenas de regras explicitamente programadas."],
  ["Qual é a diferença entre IA, Machine Learning e Deep Learning?","IA é o campo mais amplo. Machine Learning é uma abordagem dentro de IA baseada em aprendizado a partir de dados. Deep Learning é uma subárea de ML que usa redes neurais com múltiplas camadas para aprender representações hierárquicas."],
  ["Quais tipos de problemas existem em Machine Learning?","Os principais paradigmas são aprendizado supervisionado, não supervisionado e por reforço. Em supervisionado temos principalmente classificação e regressão; em não supervisionado, tarefas como clusterização e redução de dimensionalidade. Também existem problemas de detecção de anomalias, recomendação e previsão temporal, entre outros."],
  ["Qual é a diferença entre aprendizado supervisionado e não supervisionado?","No supervisionado existe uma variável-alvo conhecida durante o treinamento. No não supervisionado não há target explícito; o objetivo é descobrir estrutura, como grupos, componentes ou padrões de densidade."],
  ["O que caracteriza um problema de classificação?","O target é categórico. O modelo aprende uma função que atribui uma classe a cada observação. Pode ser binário, quando há duas classes, ou multiclasse, quando há mais de duas."],
  ["O que caracteriza um problema de regressão?","O target é quantitativo e o objetivo é estimar um valor numérico contínuo, como receita, preço ou demanda."],["O que é aprendizado não supervisionado na prática?","É quando não temos um target rotulado e buscamos estrutura nos dados. Exemplos incluem os modelos de clusterização como o algoritmo K-means, algoritmos de redução de dimencionalidade como PCA, e métodos de detecção de anomalias."],
  ["O que é overfitting?","É quando o modelo aprende não apenas o padrão generalizável, mas também ruído ou particularidades da amostra de treinamento. O resultado costuma ser desempenho muito melhor no treino do que em dados não vistos."],
  ["O que é underfitting?","É quando o modelo é simples ou restrito demais para capturar a estrutura relevante dos dados. Nesse caso, o desempenho tende a ser ruim tanto no treinamento quanto na validação."],
  ["O que significa generalização em Machine Learning?","É a capacidade de o modelo manter bom desempenho em dados novos, não utilizados no treinamento. O objetivo de ML não é memorizar a amostra, mas aprender padrões que se mantenham fora dela."],
  ["Por que separar treino, validação e teste?","Treino é usado para ajustar parâmetros; validação é usada para selecionar modelo e hiperparâmetros; teste deve permanecer separado até a avaliação final para fornecer uma estimativa mais honesta da generalização."],
  ["O que são parâmetros e hiperparâmetros?","Parâmetros são aprendidos pelo modelo durante o treinamento, como os coeficientes da regressão. Hiperparâmetros são definidos antes ou durante o processo de seleção, como profundidade de uma árvore, número de vizinhos ou força de regularização."],
  ["O que é uma feature e o que é o target?","Features são as variáveis de entrada usadas para gerar a previsão. Target, ou variável-alvo, é aquilo que queremos prever ou explicar no aprendizado supervisionado."],
  ["O que é uma baseline e por que ela é importante?","É uma referência simples de desempenho, como prever a classe majoritária ou a média. Ela permite verificar se um modelo sofisticado realmente agrega valor e ajuda a contextualizar métricas."],
  ["Por que o problema de negócio deve ser definido antes do modelo?","Porque a escolha do target, horizonte, métrica, threshold e custo dos erros depende do objetivo. Um modelo tecnicamente bom pode não gerar valor se estiver otimizando a variável ou métrica errada."],
  ["O que é data leakage?","É quando informações que não estariam disponíveis no momento real da previsão entram no treinamento ou no processo de validação. Isso produz uma estimativa de desempenho artificialmente otimista e pode comprometer o modelo em produção."],
  ["Por que a métrica precisa estar alinhada ao negócio?","Porque diferentes erros têm custos diferentes. Em fraude, por exemplo, perder uma fraude pode ser muito mais caro que gerar um falso positivo; em outros problemas, precisão ou custo operacional podem ser prioritários. A métrica deve refletir o objetivo real."],
  ["O que significa colocar um modelo em produção?","Significa integrar o modelo a um processo real para gerar previsões de forma reproduzível, observável e sustentável, considerando versionamento, dados de entrada, latência, monitoramento, drift, segurança e re-treinamento quando necessário."], 
  ["O que é Model Drift?", "É a degradação do desempenho de um modelo ao longo do tempo, geralmente porque os dados ou as relações entre as variáveis mudaram em relação ao cenário em que o modelo foi treinado."], 
  ["O que é Data Drift?", "Data drift é a mudança na distribuição das variáveis de entrada dos dados ao longo do tempo em relação aos dados usados para treinar o modelo. Exemplo: um modelo foi treinado com clientes cuja idade média era 35 anos, mas meses depois a idade média passou para 45 anos. Isso é data drift e pode prejudicar a performance do modelo."], 
  ["Como você estruturaria um projeto de Ciência de Dados", "A metodologia CRISP-DM (Cross-Industry Standard Process for Data Mining) estrutura projetos de Ciência de Dados em seis etapas iterativas: entendimento do negócio, que define o problema, os objetivos e os critérios de sucesso; entendimento dos dados, que envolve a coleta, a exploração e a avaliação da qualidade dos dados; preparação dos dados, que inclui limpeza, tratamento, transformação e engenharia de atributos; modelagem, que consiste na seleção de algoritmos, treinamento e ajuste de hiperparâmetros; avaliação, que verifica o desempenho do modelo por meio de métricas adequadas e sua aderência aos objetivos de negócio; e implantação, que disponibiliza a solução em produção e estabelece o monitoramento contínuo, incluindo a detecção de data drift e model drift. O processo é iterativo, permitindo retornar a etapas anteriores conforme os resultados obtidos, garantindo que a solução gere valor para o negócio."],
  ["Como a distância Euclidiana (L2) é calculada e quando usar?", "A distância Euclidiana mede a distância geométrica entre dois pontos, considerando as diferenças entre suas coordenadas raiz(Σᵢ(xᵢ − ŷᵢ)²). Principalmente usada em algoritmos baseados em distância, como k-means. Atenção: é sensível à escala e a outliers. Geralmente, normalize ou padronize as variáveis antes de usá-la."],
  ["Como a distância Manhattan (L1) é calculada e quando usar?", "A distância de Manhattan é a soma das diferenças absolutas entre dois pontos. Usada principalmente em algoritmos baseados em distância. Vantagem: não eleva as diferenças ao quadrado, como a Euclidiana. Porém, continua sensível à escala e pode ser influenciada por outliers."],
  ["Como a distância Minkowski é calculada e quando usar?","A distância de Minkowski é a generalização da Euclidiana e Manhattan. Quando usar: quando você quer controlar como as diferenças são agregadas."],
  ["Como a ditância do Cosseno é calculada e quando usar?", "A distância do Cosseno calcula a diferença na orientação dos vetores. Ideia central: compara a direção dos vetores, não diretamente seus comprimentos. Dois vetores na mesma direção têm distância cosseno zero, mesmo que tenham magnitudes diferentes. É usada em NLP, comparação de embeddings, busca semântica e sistemas de recomendação."],
  ["Como a distância de Hamming é calculada e quando usar?", "A distância de Hamming mede a quantidade de posições diferentes e geralmente é usada para comparar strings de mesmo comprimento."],
  ["Como a distância de Jaccard é calculada e quando usar?", "A distância de Jaccard mede a diferença entre dois conjuntos, usada para comparar conjuntos de itens ou atributos presentes/ausentes. Exemplo: comparar os produtos comprados por dois clientes. Quanto maior a interseção relativa à união, menor a distância."],
  ["Como a distância de Mahalanobis é calculada e quando usar?", "A distância de Mahalanobis considera variância e correlação dos dados. É usada para deteccção de anomalias multivariadas ou identificação de observações atípicas considerando a distribuição dos dados."],
  ["O que são as etapas de fit e transform?", "Fit é a etapa em que o algoritmo aprende os parâmetros a partir dos dados, enquanto transform é a etapa em que aplica esses parâmetros para converter os dados."]
]},

{
 id:"prob", 
 num:"02", 
 title:"Probabilidade e Estatística",
 branches:[
  ["O que é estatística descritiva?","É o conjunto de técnicas para organizar, resumir e descrever dados observados, usando tabelas, gráficos e medidas como média, mediana, moda, quartis e dispersão."],
  ["O que é estatística inferencial?","É o conjunto de métodos para tirar conclusões sobre uma população a partir de uma amostra, quantificando a incerteza por meio de estimação, intervalos de confiança e testes de hipóteses."],
  ["Quais são as principais medidas descritivas?","Média, mediana e moda são medidas de tendência central; quartis e percentis são medidas de posição; variância e desvio padrão são medidas de dispersão."],
  ["Quais são as principais medidas de variabilidade?","Variância, desvio padrão, amplitude, amplitude interquartil (IQR) e coeficiente de variação. Variância e desvio padrão são sensíveis a extremos; o IQR é mais robusto."],
  ["O que é um teste de hipóteses e quando usar?","Um teste de hipóteses é um procedimento estatístico que utiliza dados amostrais para avaliar se existe evidência suficiente para rejeitar a hipótese nula (H0) em favor da hipótese alternativa (Ha). É utilizado para testar afirmações sobre parâmetros populacionais, verificar diferenças entre grupos ou avaliar relações entre variáveis, considerando um nível de significância previamente definido."],
  ["Como estruturar um teste de hipóteses?","Primeiro, defino a hipótese nula H0 e a hipótese alternativa H1. Em seguida, escolho o teste estatístico adequado, estabeleço o nível de significância (alpha), que representa a probabilidade máxima tolerada de cometer um erro tipo I, e verifico se os pressupostos do teste são atendidos. Depois, calculo a estatística de teste e o p-valor, comparando-o com o nível de significância: se o p-valor for menor ou igual a alpha, rejeito H0, pois há evidências estatísticas suficientes em favor de H1; se for maior que alpha, não rejeito H0, pois não há evidências estatísticas suficientes para rejeitá-la. Por fim, interpreto a decisão no contexto do problema, lembrando que não rejeitar H0 não significa comprovar que ela é verdadeira, mas apenas que não há evidências amostrais suficientes para rejeitá-la."],
  ["O que é um intervalo de confiança e quando usar?","Um intervalo de confiança é uma faixa de valores calculada a partir de uma amostra para estimar um parâmetro populacional desconhecido, acompanhado de um nível de confiança, como 95%. É utilizado para quantificar a incerteza da estimativa e avaliar quais valores são plausíveis para o parâmetro populacional, sendo útil, por exemplo, para estimar médias, proporções e diferenças entre grupos. Quanto maior o nível de confiança, maior tende a ser a amplitude do intervalo; quanto maior o tamanho da amostra, menor tende a ser sua amplitude, mantendo-se as demais condições constantes."],
  ["O que significa um intervalo de confiança de 95%?","Em interpretação frequentista, se o procedimento fosse repetido muitas vezes, aproximadamente 95% dos intervalos conteriam o parâmetro verdadeiro. Não significa 95% de probabilidade para o parâmetro neste intervalo específico."],
  ["O que é um p-valor?","É a probabilidade, assumindo H0 verdadeira, de observar uma estatística tão extrema quanto ou mais extrema que a observada. Não é a probabilidade de H0 ser verdadeira. O p-valor pode ser calculado usando uma tabela da distribuição estatística, a famosa “tabelinha”. Mas isso depende do teste utilizado."],
  ["O que é nível de significância?","É o limite α definido antes do teste para controlar o erro tipo I. 5% é comum, mas a escolha deve considerar o contexto."],
  ["O que são erro tipo I e erro tipo II?","Tipo I é rejeitar H0 quando ela é verdadeira. Tipo II é não rejeitar H0 quando ela é falsa. O poder do teste é 1−β."],
  ["O que é poder estatístico?","O poder estatístico é a probabilidade de um teste identificar um efeito ou uma diferença que realmente existe, ou seja, de rejeitar a hipótese nula H0 quando ela é falsa e uma hipótese alternativa específica é verdadeira. Ele é calculado por 1-beta, em que beta é a probabilidade de cometer um erro tipo II (não rejeitar H0 quando ela é falsa). O poder aumenta, em geral, quando o tamanho da amostra ou o efeito que se deseja detectar aumenta, e diminui quando a variabilidade dos dados aumenta, mantendo as demais condições constantes. Um poder de 80%, por exemplo, significa que, se o efeito especificado realmente existir e as premissas do teste forem válidas, o teste terá 80% de probabilidade de detectá-lo."],
  ["Qual a relação entre intervalo de confiança e teste de hipóteses?", "O intervalo de confiança e o teste de hipóteses são métodos relacionados para avaliar parâmetros populacionais. Em um teste bilateral com nível de significância de 5%, se o valor especificado pela hipótese nula (H0) estiver fora do intervalo de confiança de 95%, rejeita-se H0; se estiver dentro do intervalo, não se rejeita H0. Essa equivalência pressupõe que ambos utilizem o mesmo modelo estatístico e método de estimação. O intervalo de confiança apresenta uma faixa de valores plausíveis para o parâmetro, enquanto o teste de hipóteses avalia se há evidências suficientes contra um valor específico."], 
  ["Como o nível de confiança afeta a largura do intervalo de confiança?", "Quanto maior o nível de confiança, maior será a largura do intervalo de confiança, pois é necessário abranger uma faixa maior de valores para aumentar a confiança de que o intervalo contenha o verdadeiro parâmetro populacional. Por outro lado, quanto menor o nível de confiança, mais estreito tende a ser o intervalo. Mantendo o tamanho da amostra e as demais condições constantes, um intervalo de 99% será mais largo que um de 95%, que, por sua vez, será mais largo que um de 90%."], 
  ["Qual a relação entre a quantidade de amostras e o erro padrão do intervalo de confiança?", "Quanto maior o tamanho da amostra n, menor tende a ser o erro padrão, pois a estimativa do parâmetro populacional se torna mais precisa. Para a média amostral, quando o desvio-padrão populacional é conhecido, o erro padrão é calculado por EP= sigma / raiz(n). Assim, ao aumentar o tamanho da amostra, o erro padrão diminui, reduzindo a margem de erro e tornando o intervalo de confiança mais estreito, desde que o nível de confiança e as demais condições permaneçam constantes. Por exemplo, quadruplicar o tamanho da amostra reduz o erro padrão pela metade."], 
  ["O que é máxima verossimilhança e quando usar?","É um método estatístico utilizado para estimar os parâmetros de um modelo, escolhendo os valores que maximizam a verossimilhança dos dados observados, ou seja, que tornam esses dados mais prováveis sob o modelo assumido. Para isso, define-se a função de verossimilhança L(θ), que, para observações independentes, corresponde ao produto das probabilidades ou densidades das observações, e busca-se o conjunto de parâmetros que maximiza essa função."],
  ["Qual é a diferença entre probabilidade e verossimilhança?","Na probabilidade, os parâmetros são fixos e descrevemos a chance dos dados. Na verossimilhança, os dados observados são fixos e avaliamos quais parâmetros tornam esses dados mais plausíveis."],
  ["O que é uma distribuição de probabilidade?","Uma distribuição de probabilidade descreve como as probabilidades se distribuem entre os possíveis valores de uma variável aleatória. Para variáveis discretas, utiliza-se a função de massa de probabilidade, que atribui uma probabilidade a cada valor possível. Para variáveis contínuas, utiliza-se a função densidade de probabilidade, cuja integral em um intervalo fornece a probabilidade de a variável assumir um valor dentro desse intervalo. Em ambos os casos, a distribuição permite compreender o comportamento da variável e calcular probabilidades de eventos de interesse."],
  ["Quais tipos de variáveis existem?","As variáveis estatísticas são classificadas em categóricas e quantitativas. As categóricas representam grupos ou categorias e podem ser nominais, quando não possuem uma ordem natural (ex.: cor dos olhos), ou ordinais, quando possuem uma ordem (ex.: nível de escolaridade). Já as quantitativas representam valores numéricos e podem ser discretas, quando resultam de contagens e assumem valores isolados (ex.: número de filhos), ou contínuas, quando resultam de medições e podem assumir qualquer valor dentro de um intervalo (ex.: altura e peso)."],
  ["Quais são as principais distribuições de probabilidade?","Normal, Bernoulli, Binomial, Poisson, Exponencial, Uniforme, t de Student, Qui-quadrado e F são algumas das principais em ciência de dados e inferência."],
  ["Quais são as suposições da distribuição Normal?","É contínua e simétrica em torno da média, definida por μ e σ². Em inferência, a normalidade pode ser uma hipótese sobre dados ou erros; não é uma exigência universal de machine learning."],
  ["Quando usar a distribuição Bernoulli?","Quando cada experimento tem exatamente dois resultados possíveis, como sucesso/fracasso ou 0/1, com probabilidade de sucesso p."],
  ["Quando usar a distribuição Binomial?","Quando contamos sucessos em n ensaios Bernoulli independentes e com a mesma probabilidade p de sucesso."],
  ["Quando usar a distribuição Poisson?","Para modelar contagens de eventos em um intervalo quando os eventos são aproximadamente independentes e a taxa média λ é estável. Na Poisson clássica, média e variância são iguais."],
  ["Quando usar a distribuição Exponencial?","Para modelar tempos de espera entre eventos em um processo de Poisson sob taxa constante. Possui a propriedade de falta de memória."],
  ["Quando usar a distribuição t de Student?","Principalmente para inferência sobre médias quando a variância populacional é desconhecida, especialmente em amostras pequenas sob condições adequadas."],
  ["Quando usar as distribuições Qui-quadrado e F?","A Qui-quadrado aparece em inferência para variâncias e testes de independência/homogeneidade. A F aparece em comparações de variâncias, ANOVA e testes conjuntos em regressão."],
  ["O que é um teste paramétrico?","Um teste paramétrico é um teste estatístico que assume determinadas condições sobre a distribuição dos dados ou dos erros e permite testar hipóteses sobre parâmetros populacionais, como a média e a variância. Geralmente, exige a verificação de pressupostos como normalidade e, dependendo do teste, homogeneidade das variâncias e independência das observações. Exemplos incluem o teste t de Student, utilizado para comparar médias, e a ANOVA, utilizada para comparar médias de três ou mais grupos, respeitando as condições de aplicação de cada teste."],
  ["O que é um teste não paramétrico?","Um teste não paramétrico é um método estatístico que não exige que os dados sigam uma distribuição específica, como a distribuição normal, embora ainda possa depender de outros pressupostos. É utilizado quando os pressupostos dos testes paramétricos não são atendidos ou quando os dados são ordinais. Muitos testes não paramétricos utilizam os postos (ranks) dos valores, em vez dos valores originais, para comparar grupos. Exemplos incluem o Mann-Whitney, para comparar dois grupos independentes; o Wilcoxon, para comparar duas amostras pareadas; e o Kruskal-Wallis, para comparar três ou mais grupos independentes."],
  ["Quando escolher um teste paramétrico ou não paramétrico?","Depende da pergunta, desenho do estudo, escala dos dados, tamanho da amostra e plausibilidade das suposições. Não paramétrico não significa ausência de suposições."],
  ["O que é correlação e qual a diferença entre Pearson e Spearman?","Correlação mede associação, não causalidade. O coeficiente de Pearson mede a intensidade e a direção da relação linear entre duas variáveis numéricas. É sensível a valores extremos (outliers), que podem distorcer o resultado; O coeficiente de Spearman utiliza os postos (ranks) dos valores, em vez dos valores originais, para medir a intensidade e a direção de uma relação monotônica, ou seja, quando uma variável tende a aumentar ou diminuir à medida que a outra varia, mesmo que a relação não seja linear. É útil para dados ordinais ou relações monotônicas não lineares e costuma ser menos sensível a outliers, embora ainda possa ser afetado por eles."],
  ["O que é uma relação monotônica?", "Uma relação monotônica ocorre quando, à medida que uma variável aumenta, a outra tende sempre a aumentar ou sempre a diminuir, mas não necessariamente a uma taxa constante. Pode ser crescente ou decrescente."], 
  ["O que é o Teorema Central do Limite?","Sob condições apropriadas, a distribuição da média amostral tende a uma Normal quando o tamanho da amostra cresce, mesmo que a população original não seja Normal."],
  ["Qual é a diferença entre população, amostra e parâmetro?","População é o conjunto de interesse; amostra é o subconjunto observado; parâmetro é uma característica numérica da população. Uma estatística é calculada na amostra e usada para estimar o parâmetro."],
  ["Por que a amostragem importa em ciência de dados?","Porque uma amostra enviesada pode produzir estimativas e modelos que não generalizam para a população de interesse. O processo de coleta determina quais conclusões são justificáveis."], 
  ["O que é Boostrap?", "É uma técnica de reamostragem com reposição que cria várias amostras a partir da amostra original para estimar a distribuição de uma estatística e, consequentemente, sua incerteza, como erro padrão e intervalo de confiança."], 
  ["Qual é a diferença entre correlação e causalidade?", "Correlação é uma associação entre variáveis, enquanto causalidade significa que uma variável influencia ou provoca mudanças em outra. Em Machine Learning, o modelo aprende padrões estatísticos dos dados, mas não necessariamente relações causais. Por exemplo, ao classificar imagens de cachorros, uma rede neural pode aprender a associar a cor marrom à classe cachorro porque essa característica aparece frequentemente nas imagens de treinamento, sem que seja uma característica exclusiva dessa classe. Isso pode gerar erros ao classificar cachorros de outras cores. Portanto, correlação pode ajudar nas previsões, mas não implica causalidade nem garante que o padrão aprendido seja generalizável."], 
  ["O que é um boxplot e como interpretá-lo?", "Um boxplot (diagrama de caixa) é um gráfico que resume a distribuição de uma variável numérica por meio de cinco medidas: mínimo, primeiro quartil (Q1), mediana (Q2), terceiro quartil (Q3) e máximo, geralmente considerando os limites dos bigodes. A caixa representa os 50% centrais dos dados, entre Q1 e Q3, e a linha dentro dela indica a mediana. A distância entre Q1 e Q3 corresponde à amplitude interquartil (IQR), que mede a dispersão desses dados. Os bigodes normalmente se estendem até os valores mais extremos dentro de 1,5 vezes o IQR; observações além desses limites são representadas como possíveis outliers. A posição da mediana e o tamanho relativo das partes da caixa e dos bigodes ajudam a identificar assimetria e dispersão, além de permitir comparar distribuições entre grupos. Pontos fora dos bigodes são possíveis valores atípicos, mas não necessariamente erros."], 
  ["Como são calculados os limites dos bigodes do boxplot?", "Limite inferior: Q1 - 1,5 x IQR; Limite superior: Q3+ 1,5 x IQR"]
],
},

{
id:"avaliacao",
num:"03", 
title:"Avaliação de Modelos",
branches:[
  ["Quais são as principais métricas de regressão?","As principais são MAE, MSE, RMSE, MAPE, R² e R² ajustado."],
  ["O que é MAE?","MAE (Mean Absolute Error) é a média dos erros absolutos. MAE = (Σ |yᵢ − ŷᵢ|)/n. É fácil de interpretar na unidade da variável-alvo e menos sensível a outliers do que MSE/RMSE."],
  ["Por que MAE não é diferenciável em zero?","Porque a função de módulo tem uma quina em 0: a derivada pela esquerda é −1 e pela direita é +1. Portanto, não existe uma única derivada nesse ponto. Em otimização, podem ser usados subgradientes ou perdas alternativas."], 
  ["O que é MSE e RMSE?", "O MSE (Mean Squared Error) é a média dos erros de previsão elevados ao quadrado. Quanto menor o MSE, melhor o modelo se ajusta aos dados. Como os erros são elevados ao quadrado, erros grandes são penalizados mais fortemente, tornando a métrica sensível a outliers. Além disso, é diferenciável, sendo útil na otimização de modelos. Já o RMSE = √MSE. Fica na mesma unidade da variável-alvo, facilitando a interpretação."],
  ["Em quais situações o MSE e o RMSE podem apresentar estimativas instáveis do erro de um modelo?", "O MSE é especialmente sensível à escala da variável-alvo, porque eleva os erros ao quadrado. Se os valores da variável forem muito pequenos, o MSE pode ficar extremamente próximo de zero; se forem muito grandes, o MSE pode assumir valores enormes. O RMSE reduz esse efeito de escala ao tirar a raiz quadrada, mas continua dependendo da escala da variável."], 
  ["Como traduzir o MSE para uma métrica mais intuitiva e compreensível para a área de negócios?", "Podemos utilizar o RMSE, que aplica a raiz quadrada ao MSE e retorna o erro à mesma unidade de medida da variável-alvo, facilitando sua interpretação. Outra alternativa é utilizar métricas percentuais, como o MAPE, que expressam o erro médio em relação aos valores reais. Dessa forma, os resultados ficam mais fáceis de comunicar e relacionar ao contexto do negócio."], 
  ["O que é MAPE e quais são suas limitações?","MAPE é o erro percentual absoluto médio. MAPE = (100/n) · Σ |(yᵢ − ŷᵢ) / yᵢ|. É intuitivo por ser percentual, mas fica indefinido quando y = 0 e instável quando y está próximo de zero."], 
  ["O que significa R²?","R² mede a proporção da variabilidade de y explicada pelo modelo em relação ao baseline que sempre prevê a média. R² = 1- [Σ(yᵢ − ŷᵢ)² / Σ(yᵢ − ȳ)²]. Se < 0 é pior que prever a média e quanto mais próximo de 1 melhor que a média."],
  ["R² alto significa necessariamente que o modelo é bom?","Não. R² alto não garante generalização, ausência de overfitting, causalidade ou baixo erro em termos práticos. Deve ser analisado junto a outras métricas e ao contexto."],
  ["O que é R² ajustado?", "O R² ajustado é uma métrica que avalia a capacidade explicativa de um modelo de regressão, considerando tanto o percentual da variabilidade da variável resposta explicado pelo modelo quanto a quantidade de variáveis explicativas utilizadas. Diferentemente do R² tradicional, que nunca diminui com a inclusão de novas variáveis, o R² ajustado penaliza a inclusão de variáveis que não melhoram suficientemente o modelo, considerando os graus de liberdade."], 
  ["O que significa um R² igual a 1, igual a 0 e negativo?", "Quando é igual a 1, o modelo apresenta ajuste perfeito, com previsões iguais aos valores observados. Quando é igual a 0, o modelo não apresenta melhora em relação à previsão baseada na média da variável resposta. Quando é negativo, significa que o modelo apresenta desempenho pior do que essa previsão de referência, gerando erros quadráticos maiores."],  
  ["Quais são as principais métricas de classificação?","Acurácia, precisão, recall/sensibilidade, especificidade, F1-score (e variações F1 micro e F1 macro), ROC-AUC e PR-AUC são algumas das principais. A escolha depende do custo dos falsos positivos e falsos negativos e do balanceamento das classes. São geradas a partir da análise da matriz de confusão."], 
  ["O que é a matriz de confusão?", "A matriz de confusão é uma tabela utilizada para avaliar o desempenho de um modelo de classificação, comparando as classes previstas pelo modelo com as classes reais. Ela apresenta quatro resultados possíveis: verdadeiro positivo, quando o modelo prevê a classe positiva corretamente; verdadeiro negativo, quando prevê a classe negativa corretamente; falso positivo, quando prevê a classe positiva, mas ela é negativa na realidade; e falso negativo, quando prevê a classe negativa, mas ela é positiva na realidade. A partir desses resultados, podemos calcular métricas como acurácia, precisão, recall, especificidade e F1-score, que ajudam a compreender o desempenho do modelo e os tipos de erro que ele comete."], 
  ["Quando usar acurácia e quando não usar?","Acurácia é adequada quando as classes são relativamente balanceadas e os erros têm custos semelhantes. Em dados muito desbalanceados, pode ser enganosa: prever sempre a classe majoritária pode gerar alta acurácia e desempenho ruim na classe minoritária."],
  ["Qual métrica usar em dados desbalanceados?","Depende do objetivo. Recall e PR-AUC são úteis quando detectar positivos é importante; F1 quando se quer equilibrar precision e recall; balanced accuracy quando se quer considerar as classes de forma mais equilibrada. ROC-AUC também pode ser usada, mas PR-AUC costuma ser mais informativa quando a classe positiva é rara."],
  ["O que significa precisão (precision)?","Precision mede, entre as observações classificadas como positivas, quantas realmente são positivas. Precision = TP / (TP + FP). É importante quando falsos positivos são especialmente custosos."],
  ["O que significa recall?","Recall mede, entre os positivos reais, quantos foram identificados pelo modelo. Recall = TP / (TP + FN). É importante quando falsos negativos são especialmente custosos."],
  ["Qual é a diferença entre precisão e recall?","Precision olha para a qualidade dos positivos previstos; recall olha para a cobertura dos positivos reais. Alterar o threshold geralmente cria um trade-off entre essas métricas."],
  ["O que é especificidade?","Especificidade mede a proporção de negativos reais corretamente identificados. Specificity = TN / (TN + FP). É relevante quando evitar falsos positivos é importante."],
  ["O que é F1-score e quando usar?","F1 é a média harmônica entre precision e recall. F1 = 2 · (Precision · Recall) / (Precision + Recall). É útil quando se quer equilibrar essas duas dimensões, especialmente quando a classe positiva é importante. Diferentemente da média aritmética simples, a média harmônica é sempre menor ou igual à média aritmética e é mais influenciada pelo menor dos dois valores. Isso significa que, se precision for alta, mas recall for baixo, o F1-score será puxado para baixo, penalizando o desequilíbrio entre as métricas e evitando que um valor muito alto compense excessivamente um valor muito baixo."],
  ["Como interpretar TP, TN, FP e FN?","TP: positivo corretamente previsto. TN: negativo corretamente previsto. FP: negativo previsto como positivo. FN: positivo previsto como negativo. O significado prático de FP e FN depende do problema."],
  ["O que é a métrica KS (Kolmogorov-Smirnov)?", "A métrica KS (Kolmogorov-Smirnov) é utilizada para avaliar a capacidade de um modelo de classificação de distinguir duas classes. Ela mede a maior distância absoluta entre as distribuições acumuladas das pontuações previstas para as duas classes, geralmente a probabilidade estimada de inadimplência. Quanto maior o KS, maior a separação entre as distribuições e, em geral, melhor a capacidade discriminatória do modelo. Seu valor varia de 0 a 1 quando expresso como proporção, ou de 0 a 100 quando expresso em pontos: um KS próximo de zero indica que as distribuições são semelhantes, enquanto um valor mais alto indica maior separação. Por exemplo, se o KS for 0,40, ou 40 pontos, a maior diferença entre as distribuições acumuladas das duas classes é de 40 pontos percentuais."], 
  ["O que é a curva ROC e quando usar?","A curva ROC mostra TPR (recall) no eixo y contra FPR no eixo x para vários thresholds. FPR = FP / (FP + TN. Ela avalia a capacidade de separação em diferentes limiares."],
  ["O que é AUC e quando usar?","AUC é a área sob a curva ROC. AUROC de 0,5 corresponde aproximadamente a discriminação aleatória; valores maiores indicam melhor capacidade de ordenar positivos acima de negativos. Não informa sozinho o threshold operacional."],
  ["Qual é a diferença entre ROC-AUC e PR-AUC?","A ROC-AUC avalia a capacidade de discriminação do modelo considerando a relação entre a taxa de verdadeiros positivos (TPR ou recall) e a taxa de falsos positivos (FPR), enquanto a PR-AUC considera a relação entre precisão (precision) e recall. A principal diferença é que a FPR utiliza os verdadeiros negativos (TN) em seu denominador, sendo calculada como \(FP/(FP+TN)\), enquanto precisão e recall não dependem diretamente dos TN. Em problemas com classes muito desbalanceadas, nos quais a classe positiva é rara, a grande quantidade de verdadeiros negativos pode fazer com que a FPR permaneça baixa mesmo quando o modelo gera muitos falsos positivos em relação ao total de positivos reais."], 
  ["Quais métricas usar em um problema de classificação multiclasse?", "Em um problema de classificação multiclasse, as principais métricas são acurácia, precisão, recall, F1-score e matriz de confusão. A acurácia mede a proporção total de previsões corretas, enquanto precisão, recall e F1-score são calculados para cada classe e depois podem ser agregados usando macro average, que calcula a média simples entre as classes e dá o mesmo peso a todas elas; micro average, que agrega os resultados de todas as classes antes de calcular a métrica e considera a quantidade de previsões; ou weighted average, que calcula a média ponderada pelo número de exemplos de cada classe. A matriz de confusão permite identificar quais classes o modelo confunde com outras. A escolha depende do problema: em bases balanceadas, a acurácia pode ser uma boa métrica inicial; em bases desbalanceadas, o F1-score macro é útil quando todas as classes são igualmente importantes, enquanto o F1-score weighted considera a frequência das classes. Se for fundamental identificar corretamente uma classe específica, deve-se analisar principalmente o recall e a precisão dessa classe. Também é possível utilizar a ROC-AUC multiclasse, com estratégias como one-vs-rest, quando o modelo fornece probabilidades e é importante avaliar sua capacidade de discriminação."], 
  ["Em um problema desbalanceado de spam, o que recall e precisão significariam?","Imagine que a classe positiva seja \"spam\". Recall responde: entre todos os e-mails que realmente são spam, quantos o modelo conseguiu bloquear/classificar como spam? Recall = TP / (TP + FN). Um recall baixo significa que muitos spams estão escapando (falsos negativos). Precisão responde: entre todos os e-mails que o modelo marcou como spam, quantos realmente eram spam? Precision = TP / (TP + FP). Uma precisão baixa significa que muitos e-mails legítimos estão sendo classificados como spam (falsos positivos). Na prática, existe um trade-off: aumentar o recall pode capturar mais spam, mas também pode aumentar os falsos positivos e prejudicar a experiência de quem usa o e-mail."],
  ["Em um problema de detecção de fraude, você priorizaria precisão ou recall?","Depende do custo dos erros. Se deixar uma fraude passar for muito mais prejudicial, o recall tende a ser prioritário, porque queremos minimizar falsos negativos. Se bloquear uma transação legítima for muito custoso, precision ganha importância."],
  ["Em um modelo médico de triagem, o que representa um falso negativo?","É um paciente que possui a condição, mas o modelo classifica como negativo. Em uma situação de triagem, esse erro pode ser especialmente crítico porque uma pessoa que deveria ser investigada pode não receber o encaminhamento adequado. Por isso, recall costuma ser uma métrica importante quando o custo de perder um caso positivo é alto."],
  ["Se uma empresa disser que \"99% de acurácia\" é excelente, qual pergunta você faria antes de concordar?","Eu perguntaria qual é a distribuição das classes e qual é o custo dos erros. Se apenas 1% dos casos forem positivos, um modelo que sempre prevê a classe negativa pode atingir 99% de acurácia e ainda ter recall igual a zero para a classe de interesse. Portanto, a acurácia isoladamente pode esconder um modelo inútil para o objetivo de negócio."],
  ["O que é threshold em classificação e como ele afeta as métricas?","É o limite usado para transformar score ou probabilidade em classe. Ao mudar o threshold, TP, TN, FP e FN mudam, alterando precision, recall, specificity e outras métricas."],
  ["Como escolher entre precision e recall em um problema de negócio?","Se falsos positivos são mais custosos, tende-se a priorizar precision; se falsos negativos são mais custosos, tende-se a priorizar recall. A escolha deve considerar custos e consequências de cada erro."],
  ["Quais métricas são usadas em clusterização?","Inércia, Silhouette Score, Calinski-Harabasz e Davies-Bouldin são métricas internas comuns. Quando existem rótulos reais, podem ser usados Adjusted Rand Index (ARI), Normalized Mutual Information (NMI) e outras métricas externas."],
  ["O que é Silhouette Score?","Compara a distância média de um ponto aos elementos do próprio cluster com a menor distância média a outro cluster. Varia de −1 a 1; valores maiores indicam, em geral, melhor coesão e separação."],
  ["O que á métrica da Silhueta Simplificada?", "A Silhueta Simplificada utiliza os centroides dos clusters para estimar a coesão e a separação, reduzindo o custo computacional em comparação com a silhueta tradicional."],
  ["O que é Davies-Bouldin Index?","É baseado na relação entre dispersão intra-cluster e separação entre clusters. Valores menores indicam clusters mais compactos e bem separados."],
  ["O que é Calinski-Harabasz?","É uma razão entre dispersão entre clusters e dispersão dentro dos clusters, ajustada pelo número de clusters. Valores maiores indicam maior separação relativa e coesão."],
  ["Por que não se deve escolher um modelo apenas pela métrica no conjunto de treino?","Porque o modelo pode memorizar particularidades do treino e sofrer overfitting. A seleção deve usar validação ou cross-validation e o teste deve permanecer separado para estimar a generalização final."],
  ["Como escolher uma métrica de avaliação?","Começo pelo objetivo do problema e pelo custo dos erros. Depois considero tipo de tarefa, distribuição da target, necessidade de ranking ou probabilidades, outliers e interpretabilidade. A métrica deve representar o que importa na aplicação."], 
  ["O que é Elbow (método do cotovelo)?", "É uma técnica para auxiliar na escolha do número de clusters no K-Means. Ele plota a inércia em função de K e procura o ponto de cotovelo, onde o ganho obtido ao aumentar o número de clusters deixa de ser significativo."], 
  ["O que é entropia cruzada?", "A entropia cruzada (cross-entropy) é uma função de perda (loss function) que mede a diferença entre a distribuição de probabilidades real das classes e as probabilidades previstas pelo modelo. Ela é muito utilizada em problemas de classificação, como regressão logística, redes neurais e Transformers. A ideia é penalizar o modelo quando ele atribui uma probabilidade baixa à classe correta: quanto maior a probabilidade atribuída à classe verdadeira, menor a entropia cruzada; quanto menor essa probabilidade, maior a penalização. L = - [y * log(p) + (1-y) * log(1-p)] "], 
  ["O que é PSI (Population Stability Index)?", "O PSI (Population Stability Index) é uma métrica utilizada para avaliar se a distribuição de uma variável mudou entre dois períodos ou populações, geralmente comparando a população de referência (por exemplo, a base usada no treinamento de um modelo) com a população atual. Em Machine Learning, é bastante utilizado no monitoramento de data drift, para verificar se o perfil dos dados de entrada mudou ao longo do tempo e se essa mudança pode afetar o desempenho do modelo."], 
  ["Quais métricas são acompanhadas pós implantação do modelo?", "Após a implantação de um modelo de Machine Learning, acompanhamos métricas de desempenho, estabilidade dos dados, qualidade das previsões e saúde operacional. O objetivo é verificar se o modelo continua funcionando bem em produção e identificar quando precisa ser ajustado ou retreinado."],
  ["O que é explicabilidade do modelo?", "É a capacidade de compreender e explicar como e por que um modelo chegou a determinada previsão ou decisão, identificando quais variáveis influenciaram o resultado e de que forma contribuíram para ele. Ela pode ser global, quando explica o comportamento geral do modelo, ou local, quando explica uma previsão específica. Técnicas como Feature Importance, SHAP e LIME ajudam a interpretar as decisões dos modelos."],
  ["O que é Feature Importance e como é calculada?", "É uma técnica de explicabilidade que mede a importância de cada variável (feature) para as previsões de um modelo de Machine Learning. Sua forma de cálculo depende do algoritmo: em modelos baseados em árvores, como Random Forest e XGBoost, pode ser calculada pela redução do erro ou da impureza proporcionada pelos splits de cada variável; em outros modelos, pode ser estimada por Permutation Importance, que mede quanto o desempenho do modelo piora quando os valores de uma variável são embaralhados. Quanto maior a importância, maior a contribuição daquela variável segundo o método utilizado. É importante destacar que Feature Importance não indica necessariamente causalidade nem a direção do efeito da variável sobre a previsão, e sua interpretação depende da técnica utilizada e de possíveis correlações entre as features."],
  ["O que é SHAPE e como é calculada?", "O SHAP (SHapley Additive exPlanations) é uma técnica de explicabilidade baseada na Teoria dos Jogos, que utiliza os valores de Shapley para medir quanto cada variável contribui para uma previsão específica do modelo. Seu cálculo considera diferentes combinações de variáveis: compara a previsão do modelo com e sem determinada variável e calcula a contribuição marginal média dessa variável em todas as combinações possíveis, ponderando os resultados conforme a fórmula dos valores de Shapley. Assim, cada feature recebe um valor SHAP positivo, quando aumenta a previsão em relação ao valor de referência, ou negativo, quando a reduz. O SHAP permite explicar previsões individualmente (explicabilidade local) e, ao agregar os valores absolutos de SHAP de várias observações, também permite avaliar a importância global das variáveis. Embora o cálculo exato possa ser computacionalmente caro, existem algoritmos otimizados, como o TreeSHAP, para modelos baseados em árvores."],
  ["O que é LIME e como é calculada?", "O LIME (Local Interpretable Model-agnostic Explanations) é uma técnica de explicabilidade que explica uma previsão específica de um modelo complexo por meio de um modelo mais simples, como uma regressão linear. Para isso, gera pequenas variações nos dados da observação analisada, verifica como o modelo original responde a essas variações e ajusta um modelo simples, dando maior peso aos exemplos mais próximos da observação original. Assim, identifica quais variáveis mais influenciaram aquela previsão."],
  ["Qual indicador usar para avaliar a quantidade de clusters gerados pelo modelo?", "O Elbow ajuda a identificar um número de clusters que equilibre compactação e complexidade, enquanto a Silhueta avalia a qualidade da separação e da coesão dos grupos. O ideal é combinar os indicadores com a interpretação do problema de negócio, pois nenhum deles determina sozinho a quantidade ideal de clusters."]

],
},

{
 id:"cv", 
 num:"04", 
 title:"Validação Cruzada",
 branches:[
  ["O que é validação cruzada?","É uma técnica para estimar como um modelo tende a generalizar para dados não vistos. O conjunto de treino é dividido em partes, o modelo é treinado em algumas partes e validado em outra. O processo é repetido e os resultados são agregados. Os tipos mais comuns são: K-Fold, Stratified K-Fold, LOOCV, Group K-Fold, Time Series Cross-Validation e Nested Cross-Validation."],
  ["Por que usar validação cruzada?","Principalmente para obter uma estimativa mais robusta do desempenho e para comparar modelos ou hiperparâmetros sem depender de uma única divisão treino/validação. Ela ajuda a reduzir a variabilidade da estimativa de desempenho."],
  ["Como funciona o K-Fold Cross-Validation?","Divido os dados em K folds aproximadamente iguais. Em cada rodada, uso K−1 folds para treinamento e 1 fold para validação. Repito K vezes, de modo que cada observação seja usada uma vez como validação. No final, agrego as métricas, normalmente pela média e pelo desvio padrão."],
  ["O que significa escolher K no K-Fold?","K controla o número de divisões. K maior significa conjuntos de treino maiores e conjuntos de validação menores, mas aumenta o custo computacional. K menor reduz o custo, porém cada estimativa usa menos dados para treinamento. Valores como 5 ou 10 são comuns, mas não existe um K universalmente correto."],
  ["Como definir o parâmetro K de K-fold?", "A escolha depende do tamanho da base, do custo computacional e da variabilidade dos resultados: valores maiores permitem que mais dados sejam usados no treinamento de cada rodada, mas aumentam o custo computacional. Em bases pequenas, K maior pode ser interessante, enquanto em bases grandes, K = 5 costuma oferecer um bom equilíbrio entre custo e confiabilidade."],
  ["Qual é a diferença entre K-Fold e Leave-One-Out Cross-Validation?","No Leave-One-Out (LOOCV), K é igual ao número de observações: treinamos com n−1 observações e validamos com uma observação, repetindo n vezes. Ele usa quase todos os dados para treino em cada rodada, mas pode ser muito mais caro computacionalmente e sua estimativa pode ter alta variância."],
  ["O que é Stratified K-Fold?","É uma variação do K-Fold usada principalmente em classificação, na qual cada fold tenta preservar aproximadamente a proporção das classes presente no conjunto original. Isso evita folds com composição de classes muito diferente, especialmente em problemas desbalanceados."],
  ["Quando usar Stratified K-Fold?","Quando a variável-alvo é categórica, especialmente quando as classes são desbalanceadas ou algumas são raras. A estratificação ajuda cada fold a representar melhor a distribuição da target."],
  ["O que é Group K-Fold?","É uma estratégia usada quando existem grupos de observações relacionadas, como vários registros do mesmo cliente, paciente ou equipamento. O mesmo grupo não pode aparecer simultaneamente em treino e validação, evitando vazamento de informação."],
  ["O que é Time Series Cross-Validation?","É uma validação que respeita a ordem temporal. O treinamento usa apenas informações disponíveis antes do período de validação. Não devemos embaralhar livremente uma série temporal porque isso pode permitir que informações do futuro influenciem o treinamento."],
  ["O que é out-of-time e out-of-sample?", "Out-of-sample (OOS): avalia o modelo em observações que não participaram do treinamento, podendo ser uma amostra aleatória separada da base original. É utilizado para verificar a capacidade de generalização do modelo; - Out-of-time (OOT): avalia o modelo em dados de um período posterior ao utilizado no treinamento. É especialmente importante em modelos de crédito e financeiros, pois verifica se o modelo continua funcionando em um cenário temporalmente mais recente."],
  ["Por que não devo usar K-Fold aleatório tradicional em séries temporais?","Porque uma divisão aleatória pode colocar observações futuras no treinamento e observações passadas na validação. Isso gera leakage temporal e uma estimativa de desempenho artificialmente otimista."],
  ["O que é data leakage durante a validação cruzada?","É quando informações que deveriam estar disponíveis apenas depois ou fora do conjunto de treino influenciam o treinamento. Isso pode acontecer ao calcular estatísticas de pré-processamento usando todos os dados antes do split ou ao permitir que grupos relacionados apareçam em treino e validação."],
  ["Como evitar leakage ao fazer scaling?","O scaler deve ser ajustado apenas nos dados de treinamento de cada fold e depois aplicado ao fold de validação. Na prática, uso um Pipeline que encapsula pré-processamento e modelo para que cada etapa seja ajustada dentro do fold corretamente."],
  ["Como evitar leakage ao fazer imputação de valores ausentes?","A estratégia de imputação deve ser aprendida somente com o treino de cada fold. Por exemplo, se uso a mediana, calculo a mediana no treino daquele fold e aplico essa mediana na validação. Nunca calculo a mediana usando o dataset inteiro antes da validação."],
  ["O que é Nested Cross-Validation?","É uma validação cruzada em dois níveis. O loop interno é usado para seleção de hiperparâmetros e o loop externo estima o desempenho de generalização. Isso reduz o viés que ocorre quando usamos os mesmos dados para escolher hiperparâmetros e avaliar o desempenho final."],
  ["Qual é a diferença entre validação cruzada para seleção e para avaliação?","Quando uso CV para selecionar hiperparâmetros, estou usando os dados para tomar decisões sobre o modelo. Para obter uma avaliação final mais imparcial, mantenho um conjunto de teste completamente separado ou uso nested CV."],
  ["Devo fazer o train-test split antes da validação cruzada?","Se tenho um conjunto de teste final, sim. Primeiro separo o teste, que permanece intocado. Depois faço a validação cruzada somente no conjunto de desenvolvimento para escolher modelo e hiperparâmetros. Por fim, treino no conjunto de desenvolvimento completo e avalio uma única vez no teste."],
  ["O que significa o score médio e o desvio padrão na validação cruzada?","A média dos scores representa o desempenho médio entre os folds. O desvio padrão mostra quanto esse desempenho varia de uma divisão para outra. Uma média alta com grande variabilidade merece investigação porque o desempenho pode depender muito da amostra."],
  ["Como escolher um modelo usando validação cruzada?","Defino previamente a métrica alinhada ao objetivo de negócio, calculo a métrica em cada fold, comparo média e variabilidade e considero também custo computacional e complexidade. Não devo olhar apenas para o maior score médio sem considerar a incerteza da estimativa."],
  ["A validação cruzada evita overfitting?","Não. Ela ajuda a detectar e comparar capacidade de generalização, mas não impede que um processo de seleção excessivamente adaptado aos resultados da CV também se ajuste ao conjunto de validação. Por isso, um teste final separado ou nested CV é importante."],
  ["Qual é o custo computacional do K-Fold?","Aproximadamente K treinamentos do modelo para uma configuração de hiperparâmetros. Se eu testar H combinações, o custo pode chegar a aproximadamente K×H treinamentos, além do custo de pré-processamento. Para modelos caros, isso pode ser significativo."],
  ["Como a validação cruzada se relaciona com Grid Search e Random Search?","Grid Search e Random Search são estratégias para explorar hiperparâmetros; a validação cruzada é o mecanismo usado para avaliar cada configuração. Por exemplo, RandomizedSearchCV pode testar várias combinações e usar K-Fold para calcular o score de cada uma."],
  ["Quando a validação cruzada pode ser inadequada?","Quando a estrutura dos dados não é respeitada. Exemplos: séries temporais tratadas como dados IID, grupos relacionados separados entre treino e validação ou amostras com dependência que exige uma estratégia específica. O método de CV precisa refletir o processo de geração dos dados."],
  ["O que significa assumir que as observações são IID?","IID significa independent and identically distributed: as observações são consideradas independentes e provenientes da mesma distribuição. O K-Fold tradicional funciona melhor quando essa hipótese é razoável. Dependência temporal ou entre grupos exige estratégias específicas."],
  ["Como interpretar um modelo que tem 0,90 de score em todos os folds?","Sugere desempenho consistente entre os folds, mas não prova generalização perfeita. Eu verificaria como o score foi calculado, se houve leakage, se os folds representam o cenário de produção e se a métrica é adequada ao problema."],
  ["Por que o pré-processamento deve estar dentro do Pipeline?","Porque o Pipeline garante que transformações como scaling, imputação e seleção de variáveis sejam ajustadas apenas no treino de cada fold. Isso evita leakage e torna o processo de validação reproduzível e consistente."],
  ["Em um problema de fraude, como eu estruturaria a validação cruzada?","Primeiro separaria um teste final representativo. No conjunto de desenvolvimento, usaria Stratified K-Fold se as observações fossem independentes e escolheria métricas alinhadas ao negócio, como recall, precision ou PR-AUC. Se houver múltiplas transações por cliente, consideraria GroupKFold para impedir que o mesmo cliente apareça nos dois lados."],
  ["Em um problema de previsão de demanda, como eu estruturaria a validação?","Usaria uma estratégia temporal, como TimeSeriesSplit ou uma janela temporal de treino e validação. O treino de cada rodada deve conter somente períodos anteriores ao período validado, evitando usar informações futuras."],
  ["Qual é a diferença entre validação cruzada e bootstrap?","Cross-validation divide os dados em folds para avaliar o desempenho de modelos. Bootstrap faz reamostragem com reposição e é muito usado para estimar a distribuição e a incerteza de estatísticas ou parâmetros. São técnicas relacionadas à avaliação da incerteza, mas têm objetivos e mecanismos diferentes."],  
  ["O que são Grid Search e Random Search?", "Grid Search realiza uma busca exaustiva e determinística sobre todas as combinações de hiperparâmetros especificadas. Já o Random Search seleciona aleatoriamente um número definido de combinações. Geralmente usam validação cruzada para avaliar cada combinação e selecionar aquela que apresenta o melhor desempenho."]
],
},

{
 id:"prep", 
 num:"05", 
 title:"Preparação de Dados",
 branches:[
  ["O que é Preparação de Dados e qual é o objetivo dessa etapa?","É o conjunto de transformações que leva os dados brutos a uma representação adequada para análise e modelagem. Inclui diagnóstico de qualidade, tratamento de missing values e outliers, encoding, scaling, seleção ou criação de features e, quando necessário, redução de dimensionalidade. Deve respeitar a separação entre treino, validação e teste para evitar data leakage."],
  ["Qual deve ser a ordem geral de um pipeline de preparação de dados?","Uma estrutura segura é: separar treino e teste; identificar as transformações necessárias usando apenas o treino; ajustar imputadores, encoders e scalers no treino; aplicar essas transformações aos demais conjuntos; e só então treinar o modelo. Em produção, o mesmo pipeline ajustado no treino deve ser aplicado aos novos dados. A ordem exata pode variar conforme o problema, mas o princípio é não deixar informação de validação ou teste influenciar o ajuste."],
  ["Como identificar e tratar valores ausentes?","Primeiro investigue quantidade, proporção, padrão e possível mecanismo de ausência. Remover linhas ou colunas pode ser adequado quando a perda de informação é pequena e justificável. Para imputação, média é simples para distribuições aproximadamente simétricas, mediana é mais robusta a assimetria e outliers, e moda é comum em categóricas. Também existem imputações por grupos, KNN e modelos. A técnica deve ser ajustada somente no treino dentro do pipeline."],
  ["O que são MCAR, MAR e MNAR e por que isso importa?","MCAR significa que a ausência não depende de nenhuma variável observada ou não observada; MAR significa que ela pode ser explicada por variáveis observadas; MNAR significa que a ausência depende de informação não observada, possivelmente relacionada ao próprio valor ausente. Essa distinção ajuda a avaliar o risco de viés e a escolher estratégias de tratamento."],
  ["O que é um outlier e como decidir se ele deve ser tratado?","Outlier é uma observação muito distante do padrão dos demais dados, mas não necessariamente um erro. Primeiro investigue sua origem: erro de medição, cadastro, evento raro ou comportamento legítimo. Depois avalie o impacto no modelo. Dependendo do caso, pode-se manter o valor, transformar a variável, usar métodos robustos, winsorizar ou remover observações comprovadamente inválidas. Remover automaticamente outliers pode eliminar justamente os casos importantes, como fraude."],
  ["Como detectar outliers usando IQR e z-score?","Pelo IQR, calcula-se IQR = Q3 − Q1 e costuma-se sinalizar como candidatos a outlier valores abaixo de Q1 − 1,5·IQR ou acima de Q3 + 1,5·IQR. Pelo z-score, mede-se a distância em desvios-padrão da média: z = (x − μ)/σ; valores com |z| elevado podem ser investigados. O z-score é menos apropriado quando a distribuição é muito assimétrica ou possui caudas pesadas."],
  ["O que é encoding de variáveis categóricas e quais estratégias existem?","Encoding transforma categorias em representação numérica utilizável pelo algoritmo. One-hot encoding cria uma variável binária por categoria; ordinal encoding atribui valores ordenados e só faz sentido quando existe uma ordem real; frequency encoding usa a frequência da categoria; target encoding usa informação do target e, por isso, exige muito cuidado com leakage. A escolha depende do algoritmo, cardinalidade e semântica da variável."],
  ["Quando usar One-Hot Encoding e quando evitar?","One-hot é uma escolha segura quando as categorias são nominais e a cardinalidade é administrável. Ele não impõe uma ordem artificial entre categorias. Pode gerar muitas colunas quando a cardinalidade é alta, aumentando memória e custo computacional."],
  ["Por que target encoding pode causar data leakage?","Porque o encoding usa estatísticas do target para representar uma categoria. Se a média do target for calculada usando a própria observação que está sendo avaliada, ou usando dados de validação/teste, o pré-processamento terá acesso à informação que deveria estar indisponível. A solução é calcular o encoding dentro do treino de cada fold e aplicar a transformação aprendida ao conjunto de validação/teste."],
  ["O que é scaling e por que ele é necessário em alguns modelos?","Scaling coloca features em escalas comparáveis. É importante para métodos que dependem de distância, magnitude dos coeficientes ou otimização por gradiente. Sem scaling, uma variável com valores numericamente maiores pode dominar a distância ou dificultar a otimização. Os principais métodos de scaling são StandardScaler, Min-Max, RobustScaler e MaxAbsScaler. A escolha depende das características dos dados, principalmente da presença de outliers e da distribuição das variáveis."],
  ["Qual é a diferença entre padronização, Min-Max e Robust Scaling?","Padronização transforma aproximadamente para média 0 e desvio-padrão 1: z = (x − μ)/σ. Min-Max leva os valores para um intervalo, frequentemente [0,1]: x' = (x − min)/(max − min), mas é sensível a extremos. Robust Scaling usa estatísticas robustas, normalmente mediana e IQR, sendo mais resistente a outliers. O scaler deve ser ajustado apenas no treino."],
  ["Scaling resolve outliers?","Não. Scaling transforma a escala, mas não corrige necessariamente valores extremos. Em Min-Max, um único outlier pode comprimir grande parte dos demais valores em uma faixa pequena. StandardScaler também é influenciado por média e desvio-padrão. Quando outliers são relevantes, pode ser melhor investigar sua causa, aplicar transformação, usar RobustScaler ou escolher um algoritmo menos sensível."],
  ["O que é feature engineering e quais cuidados existem?","Feature engineering é a criação ou transformação de variáveis para representar melhor o fenômeno estudado. Exemplos incluem razão entre variáveis, agregações por cliente, indicadores temporais e transformações logarítmicas. O principal cuidado é não criar features usando informação que não estaria disponível no momento da previsão. Toda transformação aprendida a partir dos dados deve respeitar o treino e o fluxo temporal do problema."],
  ["O que é feature selection e qual a diferença para feature engineering?","Feature selection escolhe um subconjunto das variáveis existentes; feature engineering cria ou transforma variáveis. A seleção pode reduzir dimensionalidade, ruído, custo e risco de overfitting. Métodos podem ser filter, como correlação e testes estatísticos; wrapper, como RFE; ou embedded, como regularização L1 e importância de modelos. A seleção também precisa ocorrer dentro do processo de validação para evitar leakage."],
