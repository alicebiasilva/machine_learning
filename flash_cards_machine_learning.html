<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Estudos — Ciência de Dados</title>
<style>
:root{
  --bg:#f5f7fb; --panel:#ffffff; --text:#172033; --muted:#68738a;
  --line:#e3e8f1; --accent:#5b5bd6; --accent2:#7c3aed; --soft:#eef0ff;
  --good:#159570; --warn:#d97706; --danger:#dc4c64; --shadow:0 12px 35px rgba(26,32,52,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
.app{display:flex;min-height:100vh}
.sidebar{width:330px;background:#111629;color:#fff;position:fixed;inset:0 auto 0 0;overflow:auto;padding:24px 16px;z-index:20}
.brand{padding:6px 10px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.brand h1{font-size:20px;margin:0 0 6px}
.brand p{font-size:12px;color:#aeb6ca;margin:0;line-height:1.5}
.search{position:relative;margin:14px 0}
.search input{width:100%;padding:11px 12px 11px 36px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#1b2138;color:#fff;outline:none}
.search span{position:absolute;left:12px;top:10px;color:#aeb6ca}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:9px 10px;border:0;border-radius:9px;background:transparent;color:#d6dbea;cursor:pointer;font-size:13px}
.nav button:hover{background:#1b2138;color:#fff}
.nav button.active{background:#5b5bd6;color:#fff}
.nav .num{width:25px;height:25px;display:grid;place-items:center;border-radius:7px;background:rgba(255,255,255,.09);font-size:11px;font-weight:700;flex:none}
.nav button.active .num{background:rgba(255,255,255,.2)}
.progress{margin-top:18px;padding:13px;border-radius:12px;background:#1b2138}
.progress-top{display:flex;justify-content:space-between;font-size:12px;color:#c8cee0;margin-bottom:8px}
.bar{height:7px;border-radius:20px;background:#2a314c;overflow:hidden}
.bar>i{display:block;height:100%;background:#8d8df5;width:0;transition:.25s}
.main{margin-left:330px;width:calc(100% - 330px);padding:30px;max-width:1500px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}
.eyebrow{font-size:12px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
h2{font-size:32px;line-height:1.1;margin:5px 0 8px}
.subtitle{color:var(--muted);margin:0;max-width:850px;line-height:1.6}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 12px;border-radius:9px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.btn:hover{border-color:#c7cdfd}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:1.5fr .9fr;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:17px}
.hero{padding:25px;background:linear-gradient(135deg,#fff,#f3f2ff);border-color:#dddfff}
.hero .tag{display:inline-block;padding:5px 8px;border-radius:20px;background:var(--soft);color:var(--accent);font-size:11px;font-weight:800}
.hero p{line-height:1.65;color:#4e596e}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#f0f2f8;color:#586278;font-weight:700}
.summary{line-height:1.7;color:#3f495c}
.summary strong{color:#1c2434}
ul{padding-left:20px;line-height:1.65}
li{margin:3px 0}
.concept-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.concept{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.concept h4{margin:0 0 6px;font-size:14px}
.concept p{margin:0;color:#5d687b;font-size:13px;line-height:1.55}
.formula{font-family:"SFMono-Regular",Consolas,monospace;background:#f5f6fa;border:1px solid #e4e7ef;border-radius:10px;padding:11px;margin:8px 0;color:#252b3b;overflow:auto}
.alert{border-left:4px solid var(--warn);background:#fff8ed;padding:12px 14px;border-radius:8px;color:#62420d;font-size:13px;line-height:1.55}
.tip{border-left:4px solid var(--good);background:#eefaf6;padding:12px 14px;border-radius:8px;color:#155844;font-size:13px;line-height:1.55}
.interview{border-left:4px solid var(--accent);background:#f1f1ff;padding:12px 14px;border-radius:8px;color:#343476;font-size:13px;line-height:1.55}
.checklist{display:grid;gap:8px}
.check{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.45}
.check input{margin-top:3px;accent-color:var(--accent)}
.mindmap{min-height:700px;position:relative;overflow:auto;background:radial-gradient(circle at center,#f9f9ff 0,#fff 55%);border:1px solid var(--line);border-radius:14px}
.mindmap svg{width:100%;min-width:1100px;height:auto;min-height:700px}
.node rect{fill:#fff;stroke:#d9deea;stroke-width:1.5}
.node text{fill:#263047;font-size:12px;font-weight:700}
.node.center rect{fill:#5b5bd6;stroke:#5b5bd6}
.node.center text{fill:#fff}
.branch{stroke:#cdd3e3;stroke-width:2}
.node.branch1 rect{fill:#f1f1ff;stroke:#bdbdf4}
.node.branch2 rect{fill:#eefaf6;stroke:#b7e5d6}
.node.branch3 rect{fill:#fff6e9;stroke:#efd4a7}
.node.branch4 rect{fill:#f7f0ff;stroke:#ddc5f4}
.node.conceptNode rect{fill:#fbfcff;stroke:#d9deea}
.node.formulaNode rect{fill:#fff9ed;stroke:#efd39d}
.node.interviewNode rect{fill:#f1f1ff;stroke:#c9c9f4}
.node.checklistNode rect{fill:#eefaf6;stroke:#b8e2d4}
.node.footerNode rect{fill:#f7f8fb;stroke:#dce1ea}
.footer{margin:22px 0;color:#8a93a5;font-size:11px;text-align:center}
.mobile-toggle{display:none}
@media(max-width:1050px){
  .grid{grid-template-columns:1fr}
}
@media(max-width:800px){
  .sidebar{transform:translateX(-100%);transition:.25s;width:300px}
  .sidebar.open{transform:none}
  .main{margin-left:0;width:100%;padding:18px}
  .mobile-toggle{display:block}
  h2{font-size:26px}
  .concept-grid,.stats{grid-template-columns:1fr}
}
@media print{
  .sidebar,.actions,.mobile-toggle{display:none!important}
  .main{margin:0;width:100%;padding:0}
  .card{box-shadow:none}
}

.study-canvas{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.canvas-header{
  padding:18px 20px 12px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--card),var(--soft));
}
.canvas-kicker{
  font-size:10px;
  font-weight:800;
  letter-spacing:.12em;
  color:var(--accent);
  margin-bottom:4px;
}
.canvas-header h3{
  margin:0;
  font-size:22px;
}
.canvas-header p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:12px;
}
.study-canvas .mindmap{
  margin:0;
  border:0;
  border-radius:0;
  min-height:820px;
  overflow:auto;
}
.nav{
  overflow-y:auto;
  padding-bottom:20px;
}
.nav button{
  min-height:42px;
}



#quizBtn.quiz-on{
  font-weight:800;
  box-shadow:0 0 0 2px var(--accent);
}


/* ===== Layout estilo ficha/mapa de revisão ===== */
.study-canvas{
  width:100%;
  min-height:100%;
  padding:18px;
  box-sizing:border-box;
}
.mindmap-board{
  width:100%;
  max-width:1480px;
  margin:0 auto;
}
.map-hero{
  border:1px solid #c7d0f5;
  border-radius:16px;
  padding:16px 24px 14px;
  margin-bottom:14px;
  background:linear-gradient(135deg,#edf1ff,#fafaff);
  box-shadow:0 3px 12px rgba(30,40,90,.07);
  text-align:center;
}
.map-hero-title{
  font-size:29px;
  line-height:1.1;
  font-weight:900;
  letter-spacing:-.035em;
  color:#17205d;
}
.map-hero-subtitle{
  margin-top:6px;
  font-size:12.5px;
  line-height:1.4;
  color:#4b5563;
}
.map-columns{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  align-items:start;
}
.map-column{
  display:flex;
  flex-direction:column;
  gap:14px;
  min-width:0;
}
.map-card{
  position:relative;
  border:1.5px solid #d7dce8;
  border-radius:14px;
  padding:14px 16px 16px;
  box-sizing:border-box;
  min-width:0;
  box-shadow:0 3px 10px rgba(31,41,55,.055);
  overflow:hidden;
  transition:transform .15s ease,box-shadow .15s ease,outline .15s ease;
}
.map-card:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 16px rgba(31,41,55,.09);
}
.map-card.topic{min-height:125px}
.map-card.concept{min-height:142px}
.map-card.special{min-height:155px}
.map-card-title{
  font-size:14.5px;
  line-height:1.2;
  font-weight:850;
  color:#172554;
  margin-bottom:9px;
}
.map-card-body .card-visual{display:block;width:100%;height:auto;margin:0 0 12px;border-radius:10px;background:rgba(127,127,127,.05)}
.map-card-body{
  color:#1f2937;
  font-size:12.1px;
  line-height:1.55;
  white-space:pre-line;
}
.formula-body{
  font-family:Georgia,"Times New Roman",serif;
  font-size:14px;
  line-height:1.7;
}
.map-bottom{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-top:14px;
}
.checklist-body{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.check-item{
  font-size:11.5px;
  line-height:1.38;
}

/* Pastéis próximos ao visual de referência. */
.tone-0{background:#edf4ff;border-color:#a9c7f3}
.tone-1{background:#eef9f4;border-color:#a8dccb}
.tone-2{background:#f3efff;border-color:#c8b9ed}
.tone-3{background:#fff4df;border-color:#f0c77f}
.tone-4{background:#fff0f7;border-color:#edb5d1}

/* Quiz: a caixa e o título ficam; apenas o conteúdo é ofuscado. */
.quiz-active .map-card{cursor:pointer}
.quiz-active .map-card-body{
  filter:blur(7px);
  opacity:.14;
  user-select:none;
}
.quiz-active .map-card.quiz-revealed .map-card-body{
  filter:none;
  opacity:1;
}
.quiz-active .map-card:hover{
  outline:2px solid var(--accent);
  outline-offset:1px;
}
#quizBtn.quiz-on{
  font-weight:800;
  box-shadow:0 0 0 2px var(--accent);
}
@media (max-width:1050px){
  .map-columns,.map-bottom{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  .study-canvas{padding:9px}
  .map-columns,.map-bottom{grid-template-columns:1fr}
  .map-hero-title{font-size:25px}
}


/* ===== Quiz: flashcard feedback ===== */
.quiz-feedback{
  display:none;
  gap:7px;
  justify-content:flex-end;
  align-items:center;
  margin-top:11px;
  padding-top:9px;
  border-top:1px solid rgba(80,90,110,.16);
}
.quiz-active .quiz-feedback{
  display:flex;
}
.quiz-feedback button{
  border:1px solid rgba(80,90,110,.22);
  background:rgba(255,255,255,.72);
  border-radius:9px;
  min-width:38px;
  height:32px;
  font-size:17px;
  cursor:pointer;
  transition:transform .12s ease, background .12s ease, border-color .12s ease;
}
.quiz-feedback button:hover{
  transform:scale(1.06);
}
.quiz-feedback button.selected-correct{
  background:#dcfce7;
  border-color:#6fc48a;
}
.quiz-feedback button.selected-wrong{
  background:#fee2e2;
  border-color:#e58b8b;
}
.quiz-active .map-card.feedback-correct{
  box-shadow:0 0 0 2px rgba(54,160,91,.42), 0 5px 14px rgba(31,41,55,.07);
}
.quiz-active .map-card.feedback-wrong{
  box-shadow:0 0 0 2px rgba(210,70,70,.42), 0 5px 14px rgba(31,41,55,.07);
}
.quiz-active.review-wrong .map-card:not(.feedback-wrong){
  display:none;
}
#reviewWrongBtn{
  display:none;
}
#reviewWrongBtn.has-errors{
  display:inline-flex;
}
#reviewWrongBtn.reviewing{
  font-weight:800;
  box-shadow:0 0 0 2px var(--accent);
}
.quiz-feedback .feedback-label{
  font-size:10px;
  color:#6b7280;
  margin-right:2px;
}


/* ===== Revisão por tópico no menu ===== */
.nav-row{
  display:flex;
  align-items:center;
  gap:5px;
  width:100%;
}
.nav-row > button:first-child{
  flex:1;
  min-width:0;
}
.nav-row.active-row > button:first-child{
  background:#26304e;
}
.navtitle{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.review-check{
  flex:0 0 29px;
  width:29px !important;
  height:29px;
  padding:0 !important;
  display:flex !important;
  align-items:center;
  justify-content:center;
  border:1px solid #56617f !important;
  border-radius:8px !important;
  background:#171d32 !important;
  color:#dce7ff !important;
  font-size:17px !important;
  font-weight:900;
  cursor:pointer;
}
.review-check:hover{
  border-color:#8ea7e8 !important;
  background:#222b48 !important;
}
.review-check.checked{
  background:#4565b7 !important;
  border-color:#7895e8 !important;
  color:#fff !important;
}
.progress{
  margin-top:14px;
  margin-bottom:14px;
}


.map-visual-card{
  margin-top:14px;
  border:1.5px solid #d7dce8;
  border-radius:14px;
  padding:13px 16px 12px;
  background:#f8fafc;
  box-shadow:0 3px 10px rgba(31,41,55,.045);
}
.visual-wrap{
  width:100%;
  min-height:145px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.visual-wrap svg{
  width:100%;
  max-width:650px;
  height:155px;
}

</style>
</head>

const topics = [
{"id":"topicos_introdutorios","title":"Tópicos introdutórios","section":"Tópicos introdutórios","cards":[["O que é Inteligência Artificial (IA)?","É o campo que desenvolve sistemas capazes de executar tarefas que normalmente exigiriam capacidades associadas à inteligência humana, como percepção, raciocínio, planejamento, linguagem e tomada de decisão, usando regras lógicas e matemáticas, que pode envolver desde automações até modelos sofisticados."],["O que é Machine Learning?","É uma subárea da IA em que algoritmos aprendem padrões a partir de dados para fazer previsões, classificações, decisões ou descobrir estruturas, em vez de depender apenas de regras explicitamente programadas."],["Qual é a diferença entre IA, Machine Learning e Deep Learning?","IA é o campo mais amplo. Machine Learning é uma abordagem dentro de IA baseada em aprendizado a partir de dados. Deep Learning é uma subárea de ML que usa redes neurais com múltiplas camadas para aprender representações hierárquicas."],["Quais tipos de problemas existem em Machine Learning?","Os principais paradigmas são aprendizado supervisionado, não supervisionado e por reforço. Em supervisionado temos principalmente classificação e regressão; em não supervisionado, tarefas como clusterização e redução de dimensionalidade. Também existem problemas de detecção de anomalias, recomendação e previsão temporal, entre outros."],["Qual é a diferença entre aprendizado supervisionado e não supervisionado?","No supervisionado existe uma variável-alvo conhecida durante o treinamento. No não supervisionado não há target explícito; o objetivo é descobrir estrutura, como grupos, componentes ou padrões de densidade."],["O que caracteriza um problema de classificação?","O target é categórico. O modelo aprende uma função que atribui uma classe a cada observação. Pode ser binário, quando há duas classes, ou multiclasse, quando há mais de duas."],["O que caracteriza um problema de regressão?","O target é quantitativo e o objetivo é estimar um valor numérico contínuo, como receita, preço ou demanda."],["O que é aprendizado não supervisionado na prática?","É quando não temos um target rotulado e buscamos estrutura nos dados. Exemplos incluem K-means para clusterização, PCA para redução de dimensionalidade e métodos de detecção de anomalias."],["O que é overfitting?","É quando o modelo aprende não apenas o padrão generalizável, mas também ruído ou particularidades da amostra de treinamento. O resultado costuma ser desempenho muito melhor no treino do que em dados não vistos."],["O que é underfitting?","É quando o modelo é simples ou restrito demais para capturar a estrutura relevante dos dados. Nesse caso, o desempenho tende a ser ruim tanto no treinamento quanto na validação."],["O que significa generalização em Machine Learning?","É a capacidade de o modelo manter bom desempenho em dados novos, não utilizados no treinamento. O objetivo de ML não é memorizar a amostra, mas aprender padrões que se mantenham fora dela."],["Por que separar treino, validação e teste?","Treino é usado para ajustar parâmetros; validação é usada para selecionar modelo e hiperparâmetros; teste deve permanecer separado até a avaliação final para fornecer uma estimativa mais honesta da generalização."],["O que são parâmetros e hiperparâmetros?","Parâmetros são aprendidos pelo modelo durante o treinamento, como os coeficientes da regressão. Hiperparâmetros são definidos antes ou durante o processo de seleção, como profundidade de uma árvore, número de vizinhos ou força de regularização."],["O que é uma feature e o que é o target?","Features são as variáveis de entrada usadas para gerar a previsão. Target, ou variável-alvo, é aquilo que queremos prever ou explicar no aprendizado supervisionado."],["O que é uma baseline e por que ela é importante?","É uma referência simples de desempenho, como prever a classe majoritária ou a média. Ela permite verificar se um modelo sofisticado realmente agrega valor e ajuda a contextualizar métricas."],["Por que o problema de negócio deve ser definido antes do modelo?","Porque a escolha do target, horizonte, métrica, threshold e custo dos erros depende do objetivo. Um modelo tecnicamente bom pode não gerar valor se estiver otimizando a variável ou métrica errada."],["O que é data leakage?","É quando informações que não estariam disponíveis no momento real da previsão entram no treinamento ou no processo de validação. Isso produz uma estimativa de desempenho artificialmente otimista e pode comprometer o modelo em produção."],["Por que a métrica precisa estar alinhada ao negócio?","Porque diferentes erros têm custos diferentes. Em fraude, por exemplo, perder uma fraude pode ser muito mais caro que gerar um falso positivo; em outros problemas, precisão ou custo operacional podem ser prioritários. A métrica deve refletir o objetivo real."],["O que significa colocar um modelo em produção?","Significa integrar o modelo a um processo real para gerar previsões de forma reproduzível, observável e sustentável, considerando versionamento, dados de entrada, latência, monitoramento, drift, segurança e re-treinamento quando necessário."], ["O que é Model Drift?", "É a degradação do desempenho de um modelo ao longo do tempo, geralmente porque os dados ou as relações entre as variáveis mudaram em relação ao cenário em que o modelo foi treinado."], ["O que é Data Drift?", "Data drift é a mudança na distribuição das variáveis de entrada dos dados ao longo do tempo em relação aos dados usados para treinar o modelo. Exemplo: um modelo foi treinado com clientes cuja idade média era 35 anos, mas meses depois a idade média passou para 45 anos. Isso é data drift e pode prejudicar a performance do modelo."]]},

 subtitle:"Base matemática para inferência, incerteza, distribuições e testes.",
 summary:"",
 branches:[["O que é estatística descritiva?","É o conjunto de técnicas para organizar, resumir e descrever dados observados, usando tabelas, gráficos e medidas como média, mediana, moda, quartis e dispersão."],["O que é estatística inferencial?","É o conjunto de métodos para tirar conclusões sobre uma população a partir de uma amostra, quantificando a incerteza por meio de estimação, intervalos de confiança e testes de hipóteses."],["Quais são as principais medidas descritivas?","Média, mediana e moda são medidas de tendência central; quartis e percentis são medidas de posição."],["Quais são as principais medidas de variabilidade?","Variância, desvio padrão, amplitude, amplitude interquartil (IQR) e coeficiente de variação. Variância e desvio padrão são sensíveis a extremos; o IQR é mais robusto."],["O que é um teste de hipóteses e quando usar?","É um procedimento para avaliar evidência contra H0 em favor de H1. É usado para testar afirmações sobre uma população ou comparar grupos."],["Como estruturar um teste de hipóteses?","Defino H0 e H1, escolho a estatística e α, verifico as condições, calculo a estatística e o p-valor e tomo a decisão. A conclusão deve ser contextualizada."],["O que é um intervalo de confiança e quando usar?","É um intervalo produzido por um procedimento que, em repetidas amostragens, captura o parâmetro verdadeiro em uma proporção determinada de amostras. Serve para estimar parâmetros e comunicar incerteza."],["O que significa um intervalo de confiança de 95%?","Em interpretação frequentista, se o procedimento fosse repetido muitas vezes, aproximadamente 95% dos intervalos conteriam o parâmetro verdadeiro. Não significa 95% de probabilidade para o parâmetro neste intervalo específico."],["O que é um p-valor?","É a probabilidade, assumindo H0 verdadeira, de observar uma estatística tão extrema quanto ou mais extrema que a observada. Não é a probabilidade de H0 ser verdadeira."],["O que é nível de significância?","É o limite α definido antes do teste para controlar o erro tipo I. 5% é comum, mas a escolha deve considerar o contexto."],["O que são erro tipo I e erro tipo II?","Tipo I é rejeitar H0 quando ela é verdadeira. Tipo II é não rejeitar H0 quando ela é falsa. O poder do teste é 1−β."],["O que é poder estatístico?","É a probabilidade de rejeitar H0 quando uma alternativa específica é verdadeira. Em geral aumenta com tamanho amostral e tamanho do efeito e diminui com maior variabilidade."],["O que é máxima verossimilhança e quando usar?","É um método que escolhe os parâmetros que maximizam a verossimilhança dos dados observados sob o modelo. É usado na estimação de distribuições e em modelos como regressão logística."],["Qual é a diferença entre probabilidade e verossimilhança?","Na probabilidade, os parâmetros são fixos e descrevemos a chance dos dados. Na verossimilhança, os dados observados são fixos e avaliamos quais parâmetros tornam esses dados mais plausíveis."],["O que é uma distribuição de probabilidade?","É uma função que descreve como a probabilidade ou densidade se distribui sobre os possíveis valores de uma variável aleatória. Discretas usam função de massa; contínuas usam função densidade."],["Quais tipos de variáveis existem?","Categóricas podem ser nominais ou ordinais; quantitativas podem ser discretas ou contínuas."],["Quais são as principais distribuições de probabilidade?","Normal, Bernoulli, Binomial, Poisson, Exponencial, Uniforme, t de Student, Qui-quadrado e F são algumas das principais em ciência de dados e inferência."],["Quais são as suposições da distribuição Normal?","É contínua e simétrica em torno da média, definida por μ e σ². Em inferência, a normalidade pode ser uma hipótese sobre dados ou erros; não é uma exigência universal de machine learning."],["Quando usar a distribuição Bernoulli?","Quando cada experimento tem exatamente dois resultados possíveis, como sucesso/fracasso ou 0/1, com probabilidade de sucesso p."],["Quando usar a distribuição Binomial?","Quando contamos sucessos em n ensaios Bernoulli independentes e com a mesma probabilidade p de sucesso."],["Quando usar a distribuição Poisson?","Para modelar contagens de eventos em um intervalo quando os eventos são aproximadamente independentes e a taxa média λ é estável. Na Poisson clássica, média e variância são iguais."],["Quando usar a distribuição Exponencial?","Para modelar tempos de espera entre eventos em um processo de Poisson sob taxa constante. Possui a propriedade de falta de memória."],["Quando usar a distribuição t de Student?","Principalmente para inferência sobre médias quando a variância populacional é desconhecida, especialmente em amostras pequenas sob condições adequadas."],["Quando usar as distribuições Qui-quadrado e F?","A Qui-quadrado aparece em inferência para variâncias e testes de independência/homogeneidade. A F aparece em comparações de variâncias, ANOVA e testes conjuntos em regressão."],["O que é um teste paramétrico?","É um teste que assume uma forma paramétrica para a distribuição dos dados ou erros e testa parâmetros dessa distribuição. Exemplos: teste t e ANOVA, sob suas condições."],["O que é um teste não paramétrico?","É um teste que exige menos suposições distribucionais e frequentemente trabalha com postos. Exemplos: Mann-Whitney, Wilcoxon e Kruskal-Wallis."],["Quando escolher um teste paramétrico ou não paramétrico?","Depende da pergunta, desenho do estudo, escala dos dados, tamanho da amostra e plausibilidade das suposições. Não paramétrico não significa ausência de suposições."],["O que é correlação e qual a diferença entre Pearson e Spearman?","Correlação mede associação, não causalidade. Pearson mede principalmente associação linear e é sensível a outliers; Spearman usa postos e mede associação monotônica."],["O que é o Teorema Central do Limite?","Sob condições apropriadas, a distribuição da média amostral tende a uma Normal quando o tamanho da amostra cresce, mesmo que a população original não seja Normal."],["Qual é a diferença entre população, amostra e parâmetro?","População é o conjunto de interesse; amostra é o subconjunto observado; parâmetro é uma característica numérica da população. Uma estatística é calculada na amostra e usada para estimar o parâmetro."],["Por que a amostragem importa em ciência de dados?","Porque uma amostra enviesada pode produzir estimativas e modelos que não generalizam para a população de interesse. O processo de coleta determina quais conclusões são justificáveis."], ["O que é Boostrap?", "É uma técnica de reamostragem com reposição que cria várias amostras a partir da amostra original para estimar a distribuição de uma estatística e, consequentemente, sua incerteza, como erro padrão e intervalo de confiança."]],
 concepts:[],
 formula:"Bayes: P(A|B) = P(B|A)P(A) / P(B)   |   Variância: Var(X)=E[X²]−E[X]²",
 checklist:["Sei diferenciar PMF, PDF e CDF?","Sei explicar média, mediana, moda, quartis e variância?","Sei interpretar p-valor sem dizer que ele é a probabilidade da hipótese?","Sei aplicar Bayes em um exemplo de classificação?","Sei diferenciar erro tipo I e tipo II?"],

{
 id:"avaliacao", num:"4", title:"Avaliação de Modelos",
 subtitle:"Métricas para classificação e regressão e leitura da matriz de confusão.",
 summary:"A métrica deve refletir o objetivo do problema e o custo dos erros. Não existe uma métrica universalmente melhor. Em classificação, pense em matriz de confusão, precision, recall, F1, ROC-AUC, KS e Gini. Em regressão, MAE, MSE, RMSE e R² são fundamentais.",
 branches:[["Quais são as principais métricas de regressão?","As principais são MAE, MSE, RMSE, MAPE e R². MAE mede o erro absoluto médio; MSE penaliza mais os erros grandes; RMSE mantém a unidade da variável-alvo; MAPE expressa erro percentual, mas é problemático quando o valor real é zero ou próximo de zero; R² compara a variabilidade explicada pelo modelo com o baseline da média."],["O que é MAE?","MAE (Mean Absolute Error) é a média dos erros absolutos. MAE = (1/n) · Σ |yᵢ − ŷᵢ|. É fácil de interpretar na unidade da variável-alvo e menos sensível a outliers do que MSE/RMSE."],["Por que MAE não é diferenciável em zero?","Porque a função |e| tem uma quina em e = 0: a derivada pela esquerda é −1 e pela direita é +1. Portanto, não existe uma única derivada nesse ponto. Em otimização, podem ser usados subgradientes ou perdas alternativas."],["O que é MSE?","MSE (Mean Squared Error) é a média dos erros ao quadrado.MSE = (1/n) · Σ (yᵢ − ŷᵢ)²</div>Como o erro é elevado ao quadrado, erros grandes recebem peso muito maior. É diferenciável, mas sensível a outliers."],["O que é RMSE e qual a diferença para MSE?","RMSE = √MSE. Fica na mesma unidade da variável-alvo, facilitando a interpretação. Assim como MSE, penaliza fortemente erros grandes."],["O que é MAPE e quais são suas limitações?","MAPE é o erro percentual absoluto médio. MAPE = (100/n) · Σ |(yᵢ − ŷᵢ) / yᵢ|. É intuitivo por ser percentual, mas fica indefinido quando y = 0 e instável quando y está próximo de zero."],["O que significa R²?","R² mede a proporção da variabilidade de y explicada pelo modelo em relação ao baseline que sempre prevê a média. R² = 1- [Σ(yᵢ − ŷᵢ)² / Σ(yᵢ − ȳ)²]. Se < 0 é pior que prever a média e quanto mais próximo de 1 melhor que a média."],["R² alto significa necessariamente que o modelo é bom?","Não. R² alto não garante generalização, ausência de overfitting, causalidade ou baixo erro em termos práticos. Deve ser analisado junto a outras métricas e ao contexto."],["Quais são as principais métricas de classificação?","Acurácia, precisão (precision), recall, especificidade, F1-score, balanced accuracy, ROC-AUC e PR-AUC são algumas das principais. A escolha depende do custo dos falsos positivos e falsos negativos e do balanceamento das classes."],["Quando usar acurácia e quando não usar?","Acurácia é adequada quando as classes são relativamente balanceadas e os erros têm custos semelhantes. Em dados muito desbalanceados, pode ser enganosa: prever sempre a classe majoritária pode gerar alta acurácia e desempenho ruim na classe minoritária."],["Qual métrica usar em dados desbalanceados?","Depende do objetivo. Recall e PR-AUC são úteis quando detectar positivos é importante; F1 quando se quer equilibrar precision e recall; balanced accuracy quando se quer considerar as classes de forma mais equilibrada. ROC-AUC também pode ser usada, mas PR-AUC costuma ser mais informativa quando a classe positiva é rara."],["O que significa precisão (precision)?","Precision mede, entre as observações classificadas como positivas, quantas realmente são positivas. Precision = TP / (TP + FP). É importante quando falsos positivos são especialmente custosos."],["O que significa recall?","Recall mede, entre os positivos reais, quantos foram identificados pelo modelo. Recall = TP / (TP + FN). É importante quando falsos negativos são especialmente custosos."],["Qual é a diferença entre precisão e recall?","Precision olha para a qualidade dos positivos previstos; recall olha para a cobertura dos positivos reais. Alterar o threshold geralmente cria um trade-off entre essas métricas."],["O que é especificidade?","Especificidade mede a proporção de negativos reais corretamente identificados. Specificity = TN / (TN + FP). É relevante quando evitar falsos positivos é importante."],["O que é F1-score e quando usar?","F1 é a média harmônica entre precision e recall. F1 = 2 · (Precision · Recall) / (Precision + Recall). É útil quando se quer equilibrar essas duas dimensões, especialmente quando a classe positiva é importante."],["O que é matriz de confusão?","É uma tabela que cruza classe real e classe prevista. Em classificação binária contém TP, TN, FP e FN. A partir dela são calculadas métricas como accuracy, precision, recall e specificity."],["Como interpretar TP, TN, FP e FN?","TP: positivo corretamente previsto. TN: negativo corretamente previsto. FP: negativo previsto como positivo. FN: positivo previsto como negativo. O significado prático de FP e FN depende do problema."],["O que é a curva ROC e quando usar?","A curva ROC mostra TPR (recall) no eixo y contra FPR no eixo x para vários thresholds. FPR = FP / (FP + TN. Ela avalia a capacidade de separação em diferentes limiares."],["O que é AUC e quando usar?","AUC é a área sob a curva ROC. AUROC de 0,5 corresponde aproximadamente a discriminação aleatória; valores maiores indicam melhor capacidade de ordenar positivos acima de negativos. Não informa sozinho o threshold operacional."],["Qual é a diferença entre ROC-AUC e PR-AUC?","ROC-AUC considera TPR e FPR; PR-AUC considera precision e recall. Em problemas com classe positiva rara, PR-AUC frequentemente fornece uma visão mais informativa do desempenho sobre a classe positiva."],["Em um problema desbalanceado de spam, o que recall e precisão significariam?","Imagine que a classe positiva seja \"spam\". Recall responde: entre todos os e-mails que realmente são spam, quantos o modelo conseguiu bloquear/classificar como spam? Recall = TP / (TP + FN). Um recall baixo significa que muitos spams estão escapando (falsos negativos). Precisão responde: entre todos os e-mails que o modelo marcou como spam, quantos realmente eram spam? Precision = TP / (TP + FP). Uma precisão baixa significa que muitos e-mails legítimos estão sendo classificados como spam (falsos positivos). Na prática, existe um trade-off: aumentar o recall pode capturar mais spam, mas também pode aumentar os falsos positivos e prejudicar a experiência de quem usa o e-mail."],["Em um problema de detecção de fraude, você priorizaria precisão ou recall?","Depende do custo dos erros. Se deixar uma fraude passar for muito mais prejudicial, o recall tende a ser prioritário, porque queremos minimizar falsos negativos. Se bloquear uma transação legítima for muito custoso, precision ganha importância."],["Em um modelo médico de triagem, o que representa um falso negativo?","É um paciente que possui a condição, mas o modelo classifica como negativo. Em uma situação de triagem, esse erro pode ser especialmente crítico porque uma pessoa que deveria ser investigada pode não receber o encaminhamento adequado. Por isso, recall costuma ser uma métrica importante quando o custo de perder um caso positivo é alto."],["Se uma empresa disser que \"99% de acurácia\" é excelente, qual pergunta você faria antes de concordar?","Eu perguntaria qual é a distribuição das classes e qual é o custo dos erros. Se apenas 1% dos casos forem positivos, um modelo que sempre prevê a classe negativa pode atingir 99% de acurácia e ainda ter recall igual a zero para a classe de interesse. Portanto, a acurácia isoladamente pode esconder um modelo inútil para o objetivo de negócio."],["O que é threshold em classificação e como ele afeta as métricas?","É o limite usado para transformar score ou probabilidade em classe. Ao mudar o threshold, TP, TN, FP e FN mudam, alterando precision, recall, specificity e outras métricas."],["Como escolher entre precision e recall em um problema de negócio?","Se falsos positivos são mais custosos, tende-se a priorizar precision; se falsos negativos são mais custosos, tende-se a priorizar recall. A escolha deve considerar custos e consequências de cada erro."],["Quais métricas são usadas em clusterização?","Silhouette Score, Calinski-Harabasz e Davies-Bouldin são métricas internas comuns. Quando existem rótulos reais, podem ser usados Adjusted Rand Index (ARI), Normalized Mutual Information (NMI) e outras métricas externas."],["O que é Silhouette Score?","Compara a distância média de um ponto aos elementos do próprio cluster com a menor distância média a outro cluster. Varia de −1 a 1; valores maiores indicam, em geral, melhor coesão e separação."],["O que é Davies-Bouldin Index?","É baseado na relação entre dispersão intra-cluster e separação entre clusters. Valores menores indicam clusters mais compactos e bem separados."],["O que é Calinski-Harabasz?","É uma razão entre dispersão entre clusters e dispersão dentro dos clusters, ajustada pelo número de clusters. Valores maiores indicam maior separação relativa e coesão."],["Por que não se deve escolher um modelo apenas pela métrica no conjunto de treino?","Porque o modelo pode memorizar particularidades do treino e sofrer overfitting. A seleção deve usar validação ou cross-validation e o teste deve permanecer separado para estimar a generalização final."],["Como escolher uma métrica de avaliação?","Começo pelo objetivo do problema e pelo custo dos erros. Depois considero tipo de tarefa, distribuição da target, necessidade de ranking ou probabilidades, outliers e interpretabilidade. A métrica deve representar o que importa na aplicação."], ["O que é Elbow (método do cotovelo)?", "É uma técnica para auxiliar na escolha do número de clusters no K-Means. Ele plota a inércia em função de K e procura o ponto de cotovelo, onde o ganho obtido ao aumentar o número de clusters deixa de ser significativo."]],
 concepts:[ ],
 formula:"Accuracy=(TP+TN)/N | Precision=TP/(TP+FP) | Recall=TP/(TP+FN) | F1=2PR/(P+R)",
 checklist:["Sei explicar TP, TN, FP e FN?","Sei quando recall é prioritário?","Sei por que accuracy pode enganar em classes desbalanceadas?","Sei relacionar AUC e Gini?","Sei explicar diferença entre MAE e RMSE?"],
 interview:"Em dados desbalanceados, não olhe apenas accuracy. Analise matriz de confusão, precision/recall, PR-AUC quando apropriado e a métrica ligada ao custo do negócio."
},
{
 id:"cv", num:"6", title:"Validação Cruzada",
 subtitle:"Estratégias para estimar generalização e comparar modelos sem contaminar o teste.",
 summary:"Validação cruzada divide os dados de treino em múltiplas partes. O modelo é treinado em algumas partes e validado na parte restante, repetindo o processo. O conjunto de teste final deve permanecer intocado para a avaliação final.",
 branches:[["O que é validação cruzada?","É uma técnica para estimar como um modelo tende a generalizar para dados não vistos. O conjunto de treino é dividido em partes, o modelo é treinado em algumas partes e validado em outra. O processo é repetido e os resultados são agregados. Os tipos mais comuns são: K-Fold, Stratified K-Fold, LOOCV, Group K-Fold, Time Series Cross-Validation e Nested Cross-Validation."],["Por que usar validação cruzada?","Principalmente para obter uma estimativa mais robusta do desempenho e para comparar modelos ou hiperparâmetros sem depender de uma única divisão treino/validação. Ela ajuda a reduzir a variabilidade da estimativa de desempenho."],["Como funciona o K-Fold Cross-Validation?","Divido os dados em K folds aproximadamente iguais. Em cada rodada, uso K−1 folds para treinamento e 1 fold para validação. Repito K vezes, de modo que cada observação seja usada uma vez como validação. No final, agrego as métricas, normalmente pela média e pelo desvio padrão."],["O que significa escolher K no K-Fold?","K controla o número de divisões. K maior significa conjuntos de treino maiores e conjuntos de validação menores, mas aumenta o custo computacional. K menor reduz o custo, porém cada estimativa usa menos dados para treinamento. Valores como 5 ou 10 são comuns, mas não existe um K universalmente correto."],["Qual é a diferença entre K-Fold e Leave-One-Out Cross-Validation?","No Leave-One-Out (LOOCV), K é igual ao número de observações: treinamos com n−1 observações e validamos com uma observação, repetindo n vezes. Ele usa quase todos os dados para treino em cada rodada, mas pode ser muito mais caro computacionalmente e sua estimativa pode ter alta variância."],["O que é Stratified K-Fold?","É uma variação do K-Fold usada principalmente em classificação, na qual cada fold tenta preservar aproximadamente a proporção das classes presente no conjunto original. Isso evita folds com composição de classes muito diferente, especialmente em problemas desbalanceados."],["Quando usar Stratified K-Fold?","Quando a variável-alvo é categórica, especialmente quando as classes são desbalanceadas ou algumas são raras. A estratificação ajuda cada fold a representar melhor a distribuição da target."],["O que é Group K-Fold?","É uma estratégia usada quando existem grupos de observações relacionadas, como vários registros do mesmo cliente, paciente ou equipamento. O mesmo grupo não pode aparecer simultaneamente em treino e validação, evitando vazamento de informação."],["O que é Time Series Cross-Validation?","É uma validação que respeita a ordem temporal. O treinamento usa apenas informações disponíveis antes do período de validação. Não devemos embaralhar livremente uma série temporal porque isso pode permitir que informações do futuro influenciem o treinamento."],["Por que não devo usar K-Fold aleatório tradicional em séries temporais?","Porque uma divisão aleatória pode colocar observações futuras no treinamento e observações passadas na validação. Isso gera leakage temporal e uma estimativa de desempenho artificialmente otimista."],["O que é data leakage durante a validação cruzada?","É quando informações que deveriam estar disponíveis apenas depois ou fora do conjunto de treino influenciam o treinamento. Isso pode acontecer ao calcular estatísticas de pré-processamento usando todos os dados antes do split ou ao permitir que grupos relacionados apareçam em treino e validação."],["Como evitar leakage ao fazer scaling?","O scaler deve ser ajustado apenas nos dados de treinamento de cada fold e depois aplicado ao fold de validação. Na prática, uso um Pipeline que encapsula pré-processamento e modelo para que cada etapa seja ajustada dentro do fold corretamente."],["Como evitar leakage ao fazer imputação de valores ausentes?","A estratégia de imputação deve ser aprendida somente com o treino de cada fold. Por exemplo, se uso a mediana, calculo a mediana no treino daquele fold e aplico essa mediana na validação. Nunca calculo a mediana usando o dataset inteiro antes da validação."],["O que é Nested Cross-Validation?","É uma validação cruzada em dois níveis. O loop interno é usado para seleção de hiperparâmetros e o loop externo estima o desempenho de generalização. Isso reduz o viés que ocorre quando usamos os mesmos dados para escolher hiperparâmetros e avaliar o desempenho final."],["Qual é a diferença entre validação cruzada para seleção e para avaliação?","Quando uso CV para selecionar hiperparâmetros, estou usando os dados para tomar decisões sobre o modelo. Para obter uma avaliação final mais imparcial, mantenho um conjunto de teste completamente separado ou uso nested CV."],["Devo fazer o train-test split antes da validação cruzada?","Se tenho um conjunto de teste final, sim. Primeiro separo o teste, que permanece intocado. Depois faço a validação cruzada somente no conjunto de desenvolvimento para escolher modelo e hiperparâmetros. Por fim, treino no conjunto de desenvolvimento completo e avalio uma única vez no teste."],["O que significa o score médio e o desvio padrão na validação cruzada?","A média dos scores representa o desempenho médio entre os folds. O desvio padrão mostra quanto esse desempenho varia de uma divisão para outra. Uma média alta com grande variabilidade merece investigação porque o desempenho pode depender muito da amostra."],["Como escolher um modelo usando validação cruzada?","Defino previamente a métrica alinhada ao objetivo de negócio, calculo a métrica em cada fold, comparo média e variabilidade e considero também custo computacional e complexidade. Não devo olhar apenas para o maior score médio sem considerar a incerteza da estimativa."],["A validação cruzada evita overfitting?","Não. Ela ajuda a detectar e comparar capacidade de generalização, mas não impede que um processo de seleção excessivamente adaptado aos resultados da CV também se ajuste ao conjunto de validação. Por isso, um teste final separado ou nested CV é importante."],["Qual é o custo computacional do K-Fold?","Aproximadamente K treinamentos do modelo para uma configuração de hiperparâmetros. Se eu testar H combinações, o custo pode chegar a aproximadamente K×H treinamentos, além do custo de pré-processamento. Para modelos caros, isso pode ser significativo."],["Como a validação cruzada se relaciona com Grid Search e Random Search?","Grid Search e Random Search são estratégias para explorar hiperparâmetros; a validação cruzada é o mecanismo usado para avaliar cada configuração. Por exemplo, RandomizedSearchCV pode testar várias combinações e usar K-Fold para calcular o score de cada uma."],["Quando a validação cruzada pode ser inadequada?","Quando a estrutura dos dados não é respeitada. Exemplos: séries temporais tratadas como dados IID, grupos relacionados separados entre treino e validação ou amostras com dependência que exige uma estratégia específica. O método de CV precisa refletir o processo de geração dos dados."],["O que significa assumir que as observações são IID?","IID significa independent and identically distributed: as observações são consideradas independentes e provenientes da mesma distribuição. O K-Fold tradicional funciona melhor quando essa hipótese é razoável. Dependência temporal ou entre grupos exige estratégias específicas."],["Como interpretar um modelo que tem 0,90 de score em todos os folds?","Sugere desempenho consistente entre os folds, mas não prova generalização perfeita. Eu verificaria como o score foi calculado, se houve leakage, se os folds representam o cenário de produção e se a métrica é adequada ao problema."],["Por que o pré-processamento deve estar dentro do Pipeline?","Porque o Pipeline garante que transformações como scaling, imputação e seleção de variáveis sejam ajustadas apenas no treino de cada fold. Isso evita leakage e torna o processo de validação reproduzível e consistente."],["Em um problema de fraude, como eu estruturaria a validação cruzada?","Primeiro separaria um teste final representativo. No conjunto de desenvolvimento, usaria Stratified K-Fold se as observações fossem independentes e escolheria métricas alinhadas ao negócio, como recall, precision ou PR-AUC. Se houver múltiplas transações por cliente, consideraria GroupKFold para impedir que o mesmo cliente apareça nos dois lados."],["Em um problema de previsão de demanda, como eu estruturaria a validação?","Usaria uma estratégia temporal, como TimeSeriesSplit ou uma janela temporal de treino e validação. O treino de cada rodada deve conter somente períodos anteriores ao período validado, evitando usar informações futuras."],["Qual é a diferença entre validação cruzada e bootstrap?","Cross-validation divide os dados em folds para avaliar o desempenho de modelos. Bootstrap faz reamostragem com reposição e é muito usado para estimar a distribuição e a incerteza de estatísticas ou parâmetros. São técnicas relacionadas à avaliação da incerteza, mas têm objetivos e mecanismos diferentes."],  ["O que são Grid Search e Random Search?", "Grid Search realiza uma busca exaustiva e determinística sobre todas as combinações de hiperparâmetros especificadas. Já o Random Search seleciona aleatoriamente um número definido de combinações. Geralmente usam validação cruzada para avaliar cada combinação e selecionar aquela que apresenta o melhor desempenho."]],

{
 id:"prep", num:"7", title:"Preparação de Dados",
 subtitle:"Preparação dos dados antes da modelagem.",
 summary:"Data preparation transforma dados brutos em uma representação adequada para análise e ML. Inclui missing values, outliers, encoding, scaling, redução de dimensionalidade e análise de associação. A ordem das etapas importa para evitar leakage.",
 branches:[
  ["O que é Preparação de Dados e qual é o objetivo dessa etapa?","É o conjunto de transformações que leva os dados brutos a uma representação adequada para análise e modelagem. Inclui diagnóstico de qualidade, tratamento de missing values e outliers, encoding, scaling, seleção ou criação de features e, quando necessário, redução de dimensionalidade. Deve respeitar a separação entre treino, validação e teste para evitar data leakage."],
  ["Qual deve ser a ordem geral de um pipeline de preparação de dados?","Uma estrutura segura é: separar treino e teste; identificar as transformações necessárias usando apenas o treino; ajustar imputadores, encoders e scalers no treino; aplicar essas transformações aos demais conjuntos; e só então treinar o modelo. Em produção, o mesmo pipeline ajustado no treino deve ser aplicado aos novos dados. A ordem exata pode variar conforme o problema, mas o princípio é não deixar informação de validação ou teste influenciar o ajuste."],
  ["Como identificar e tratar valores ausentes?","Primeiro investigue quantidade, proporção, padrão e possível mecanismo de ausência. Remover linhas ou colunas pode ser adequado quando a perda de informação é pequena e justificável. Para imputação, média é simples para distribuições aproximadamente simétricas, mediana é mais robusta a assimetria e outliers, e moda é comum em categóricas. Também existem imputações por grupos, KNN e modelos. A técnica deve ser ajustada somente no treino dentro do pipeline."],
  ["O que são MCAR, MAR e MNAR e por que isso importa?","MCAR significa que a ausência não depende de nenhuma variável observada ou não observada; MAR significa que ela pode ser explicada por variáveis observadas; MNAR significa que a ausência depende de informação não observada, possivelmente relacionada ao próprio valor ausente. Essa distinção ajuda a avaliar o risco de viés e a escolher estratégias de tratamento."],
  ["O que é um outlier e como decidir se ele deve ser tratado?","Outlier é uma observação muito distante do padrão dos demais dados, mas não necessariamente um erro. Primeiro investigue sua origem: erro de medição, cadastro, evento raro ou comportamento legítimo. Depois avalie o impacto no modelo. Dependendo do caso, pode-se manter o valor, transformar a variável, usar métodos robustos, winsorizar ou remover observações comprovadamente inválidas. Remover automaticamente outliers pode eliminar justamente os casos importantes, como fraude."],
  ["Como detectar outliers usando IQR e z-score?","Pelo IQR, calcula-se IQR = Q3 − Q1 e costuma-se sinalizar como candidatos a outlier valores abaixo de Q1 − 1,5·IQR ou acima de Q3 + 1,5·IQR. Pelo z-score, mede-se a distância em desvios-padrão da média: z = (x − μ)/σ; valores com |z| elevado podem ser investigados. O z-score é menos apropriado quando a distribuição é muito assimétrica ou possui caudas pesadas."],
  ["O que é encoding de variáveis categóricas e quais estratégias existem?","Encoding transforma categorias em representação numérica utilizável pelo algoritmo. One-hot encoding cria uma variável binária por categoria; ordinal encoding atribui valores ordenados e só faz sentido quando existe uma ordem real; frequency encoding usa a frequência da categoria; target encoding usa informação do target e, por isso, exige muito cuidado com leakage. A escolha depende do algoritmo, cardinalidade e semântica da variável."],
  ["Quando usar One-Hot Encoding e quando evitar?","One-hot é uma escolha segura quando as categorias são nominais e a cardinalidade é administrável. Ele não impõe uma ordem artificial entre categorias. Pode gerar muitas colunas quando a cardinalidade é alta, aumentando memória e custo computacional."],
  ["Por que target encoding pode causar data leakage?","Porque o encoding usa estatísticas do target para representar uma categoria. Se a média do target for calculada usando a própria observação que está sendo avaliada, ou usando dados de validação/teste, o pré-processamento terá acesso à informação que deveria estar indisponível. A solução é calcular o encoding dentro do treino de cada fold e aplicar a transformação aprendida ao conjunto de validação/teste."],
  ["O que é scaling e por que ele é necessário em alguns modelos?","Scaling coloca features em escalas comparáveis. É importante para métodos que dependem de distância, magnitude dos coeficientes ou otimização por gradiente. Sem scaling, uma variável com valores numericamente maiores pode dominar a distância ou dificultar a otimização. Os principais métodos de scaling são StandardScaler, Min-Max, RobustScaler e MaxAbsScaler. A escolha depende das características dos dados, principalmente da presença de outliers e da distribuição das variáveis."],
  ["Qual é a diferença entre padronização, Min-Max e Robust Scaling?","Padronização transforma aproximadamente para média 0 e desvio-padrão 1: z = (x − μ)/σ. Min-Max leva os valores para um intervalo, frequentemente [0,1]: x' = (x − min)/(max − min), mas é sensível a extremos. Robust Scaling usa estatísticas robustas, normalmente mediana e IQR, sendo mais resistente a outliers. O scaler deve ser ajustado apenas no treino."],
  ["Scaling resolve outliers?","Não. Scaling transforma a escala, mas não corrige necessariamente valores extremos. Em Min-Max, um único outlier pode comprimir grande parte dos demais valores em uma faixa pequena. StandardScaler também é influenciado por média e desvio-padrão. Quando outliers são relevantes, pode ser melhor investigar sua causa, aplicar transformação, usar RobustScaler ou escolher um algoritmo menos sensível."],
  ["O que é feature engineering e quais cuidados existem?","Feature engineering é a criação ou transformação de variáveis para representar melhor o fenômeno estudado. Exemplos incluem razão entre variáveis, agregações por cliente, indicadores temporais e transformações logarítmicas. O principal cuidado é não criar features usando informação que não estaria disponível no momento da previsão. Toda transformação aprendida a partir dos dados deve respeitar o treino e o fluxo temporal do problema."],
  ["O que é feature selection e qual a diferença para feature engineering?","Feature selection escolhe um subconjunto das variáveis existentes; feature engineering cria ou transforma variáveis. A seleção pode reduzir dimensionalidade, ruído, custo e risco de overfitting. Métodos podem ser filter, como correlação e testes estatísticos; wrapper, como RFE; ou embedded, como regularização L1 e importância de modelos. A seleção também precisa ocorrer dentro do processo de validação para evitar leakage."],
  ["Quando PCA é útil no Data Prep?","PCA pode ser útil quando existem muitas features numéricas correlacionadas e se deseja uma representação de menor dimensão. Ele cria componentes ortogonais que capturam progressivamente a variância dos dados. É comum fazer scaling antes do PCA quando as variáveis estão em escalas diferentes. A principal desvantagem é a perda de interpretabilidade, pois os componentes são combinações das variáveis originais."],
  ["PCA deve ser aplicado antes ou depois do scaling?","Em geral, depois do scaling quando as variáveis possuem escalas diferentes. Sem isso, uma variável com variância numericamente maior pode dominar os primeiros componentes mesmo sem carregar mais informação relevante. Tanto o scaler quanto o PCA devem ser ajustados apenas no conjunto de treino e, durante cross-validation, dentro do Pipeline de cada fold."],
  ["Como evitar data leakage durante o Data Prep?","Qualquer transformação que aprenda parâmetros com os dados deve ser ajustada somente no treino. Isso inclui imputação, scaling, seleção de features, PCA, target encoding e outras transformações baseadas em estatísticas dos dados. Em cross-validation, o ideal é encapsular essas etapas em um Pipeline, fazendo com que cada fold ajuste o pré-processamento apenas com sua parte de treino."],
  ["O que deve ficar dentro de um Pipeline de machine learning?","Devem ficar dentro do Pipeline as etapas que precisam ser aprendidas a partir dos dados, como imputação, encoding, scaling, PCA, seleção de features e o próprio estimador. Isso garante que Grid Search, Random Search e cross-validation refaçam corretamente o fit dessas etapas em cada fold. Também reduz diferenças entre treinamento e inferência em produção."],
  ["Como você estruturaria o Data Prep para um problema real de fraude?","Eu começaria entendendo a unidade de análise e o momento em que cada informação fica disponível. Depois faria diagnóstico de missing, duplicidades, outliers e distribuição das classes. Evitaria features que usam eventos posteriores à transação, faria encoding e scaling apenas quando necessários e escolheria uma validação compatível com o tempo e possíveis grupos. Por fim, colocaria o pré-processamento em Pipeline e avaliaria o impacto das transformações nas métricas relevantes ao negócio."],
  ["Quando usar padronização e quando usar normalização?", "A padronização transforma os dados para terem média 0 e desvio padrão 1, sendo útil quando as variáveis possuem escalas diferentes e não há necessidade de limitar seus valores. Já a normalização, geralmente pelo Min-Max, transforma os valores para um intervalo definido, como [0, 1], sendo adequada quando o modelo se beneficia de uma escala limitada e os dados não possuem muitos outliers."]
 ],
 concepts:[],
 formula:"Ordem segura: split → fit do pré-processamento no treino → transform treino/validação/teste → fit modelo.",
 checklist:["Sei diferenciar padronização de normalização Min-Max?","Sei por que outlier não é sinônimo de erro?","Sei quando PCA pode ser útil?","Sei evitar leakage em imputação/encoding/scaling?"],
 interview:"Pergunta clássica: “Precisa fazer scaling para árvore?” Em geral, árvores não dependem de distância nem da escala como KNN/PCA/SVM linear, então scaling normalmente não é necessário para árvores."
},
{
 id:"gd", num:"06", title:"Gradient Descendente", subtitle:"O algoritmo de otimização por gradiente usado para minimizar funções de perda.",
 summary:"Gradient Descent é um método iterativo de otimização que ajusta parâmetros na direção oposta ao gradiente da função objetivo. É fundamental para treinar regressão, redes neurais e muitos outros modelos, e exige atenção a learning rate, escala das features, convexidade e critérios de parada.",
 branches:[["O que é Gradient Descent?","É um algoritmo iterativo de otimização que busca minimizar uma função objetivo atualizando os parâmetros na direção oposta ao gradiente. A ideia central é mover os parâmetros para uma região de menor perda."],["Qual é a ideia matemática do Gradient Descent?","Em cada iteração, calculamos o gradiente da função de perda em relação aos parâmetros e fazemos uma atualização na direção oposta: θ ← θ − η∇J(θ), em que η é a taxa de aprendizado."],["O que é o gradiente de uma função?","É o vetor formado pelas derivadas parciais da função em relação aos parâmetros. Ele aponta para a direção de maior crescimento local da função; por isso, usamos o sentido oposto para buscar redução da loss."],["Por que a atualização usa o gradiente negativo?","Porque o gradiente aponta para a direção de maior aumento local da função. Caminhar na direção oposta tende a reduzir a função, desde que o passo seja adequado."],["O que é learning rate?","É o tamanho do passo dado a cada atualização. Um learning rate muito pequeno pode tornar a convergência lenta; um muito grande pode fazer o algoritmo oscilar ou até divergir."],["O que acontece se o learning rate for muito pequeno?","As atualizações ficam pequenas, tornando o treinamento lento e podendo exigir muitas iterações para chegar a uma região próxima do mínimo."],["O que acontece se o learning rate for muito grande?","O algoritmo pode ultrapassar repetidamente o mínimo, oscilar ou divergir em vez de convergir para uma solução adequada."],["O que significa convergência no Gradient Descent?","Significa que as atualizações deixam de produzir mudanças relevantes na função objetivo ou nos parâmetros, indicando que o algoritmo chegou a uma região estável segundo o critério de parada adotado."],["O que é Batch Gradient Descent?","É a versão que calcula o gradiente usando todas as observações do conjunto de treinamento antes de cada atualização. Produz um gradiente mais estável, mas cada passo pode ser computacionalmente caro em bases grandes."],["O que é Stochastic Gradient Descent (SGD)?","É a versão que atualiza os parâmetros usando uma única observação por vez. As atualizações são mais rápidas e ruidosas, podendo ajudar a escapar de regiões problemáticas, mas a trajetória é mais instável."],["O que é Mini-Batch Gradient Descent?","É a abordagem intermediária: cada atualização usa um pequeno lote de observações. É muito usada na prática porque equilibra eficiência computacional, estabilidade do gradiente e uso de hardware paralelo."],["Qual é a diferença entre Batch, Stochastic e Mini-Batch Gradient Descent?","Batch usa todo o dataset por atualização; SGD usa uma observação; Mini-Batch usa pequenos subconjuntos. A principal diferença está no custo, no ruído do gradiente e na eficiência computacional."],["Qual é o papel do scaling no Gradient Descent?","Scaling pode ser muito importante porque features em escalas muito diferentes podem deixar a superfície de otimização mal condicionada. Padronização costuma tornar os passos mais equilibrados e acelerar a convergência."],["O Gradient Descent sempre encontra o mínimo global?","Não. Em funções convexas, como a perda quadrática sob condições adequadas, um mínimo global pode ser encontrado. Em funções não convexas, como as de redes neurais, o algoritmo pode encontrar mínimos locais ou pontos de sela, e a garantia global não existe em geral."],["Qual é a diferença entre mínimo local e mínimo global?","Mínimo local é uma região em que pequenas perturbações não reduzem a função. Mínimo global é o menor valor da função em todo o domínio."],["O que é uma função convexa e por que isso importa?","Em uma função convexa, qualquer mínimo local também é global. Isso torna a otimização mais previsível. Em problemas convexos, a escolha adequada do passo pode levar ao mínimo global."],["Como o Gradient Descent é usado na regressão linear?","A loss, normalmente MSE, é definida em função dos coeficientes. O algoritmo calcula as derivadas da loss em relação aos coeficientes e os atualiza iterativamente até atingir um critério de convergência."],["Como o Gradient Descent aparece na regressão logística?","Os coeficientes são ajustados para minimizar uma loss de classificação, normalmente a log-loss/cross-entropy. O gradiente indica como cada coeficiente deve ser alterado para reduzir essa perda."],["Como o Gradient Descent aparece nas redes neurais?","A backpropagation calcula os gradientes da loss em relação aos pesos usando a regra da cadeia. O Gradient Descent ou uma variante usa esses gradientes para atualizar os pesos."],["O que é a regra da cadeia no contexto do Gradient Descent?","É a regra de cálculo diferencial que permite propagar derivadas através de funções compostas. Em redes neurais, ela permite calcular como cada peso influencia a loss, etapa fundamental do backpropagation."],["Quais são critérios de parada comuns no Gradient Descent?","Pode-se parar após um número máximo de épocas/iterações, quando a redução da loss fica abaixo de um limite, quando a norma do gradiente fica pequena ou quando uma métrica de validação deixa de melhorar."],["O que é early stopping?","É interromper o treinamento quando o desempenho em um conjunto de validação deixa de melhorar por determinado número de iterações. Pode reduzir custo computacional e ajudar a evitar overfitting."],["Quais problemas podem ocorrer durante a otimização?","Learning rate inadequado, gradientes muito pequenos ou grandes, superfície mal condicionada, oscilações, convergência lenta e, em problemas não convexos, pontos de sela ou mínimos locais são exemplos de dificuldades."],["O que são vanishing e exploding gradients?","Vanishing gradients ocorrem quando os gradientes ficam muito pequenos e as atualizações se tornam lentas ou praticamente param. Exploding gradients ocorrem quando os gradientes ficam muito grandes, causando atualizações instáveis."],["Como podemos melhorar a convergência do Gradient Descent?","Podemos ajustar o learning rate, fazer scaling, escolher mini-batches adequados e usar otimizadores adaptativos ou com momentum, como Momentum, RMSProp e Adam, dependendo do problema."],["O que é Momentum no Gradient Descent?","É uma técnica que acumula parte do movimento das atualizações anteriores, ajudando a acelerar a trajetória em direções consistentes e reduzir oscilações em direções com gradientes conflitantes."],["O que é Adam?","Adam é um otimizador que combina ideias de momentum e adaptação da taxa de aprendizado por parâmetro, usando estimativas dos primeiros e segundos momentos dos gradientes. É muito usado no treinamento de redes neurais."],["Qual é o custo computacional do Gradient Descent?","Depende do número de observações, features, parâmetros e tamanho dos batches. Batch pode ser caro por atualização; SGD faz atualizações baratas, mas em maior número; mini-batch permite explorar paralelismo e costuma ser um compromisso eficiente."],["Como escolher o learning rate na prática?","Pode-se testar uma faixa de valores em validação, usar um learning-rate scheduler ou estratégias de busca. O valor adequado depende da escala dos dados, arquitetura/modelo, loss e otimizador."],["Como explicar o que é Gradient Descent de forma simples?","É um algoritmo de otimização que ajusta os parâmetros iterativamente na direção oposta ao gradiente da loss. O learning rate controla o tamanho do passo, e a escolha da estratégia de atualização influencia velocidade, estabilidade e convergência."]],
