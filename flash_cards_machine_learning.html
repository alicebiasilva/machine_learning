 formula:"θₜ₊₁ = θₜ − η∇J(θₜ)",
 checklist:["Sei explicar o que é gradiente?","Sei explicar o efeito do learning rate?","Sei diferenciar Batch, SGD e Mini-Batch?","Sei explicar por que scaling pode ajudar?","Sei diferenciar mínimo local de global?"],
 interview:"Em uma sabatina, destaque que Gradient Descent é um algoritmo de otimização, não um modelo preditivo. Ele é usado para encontrar parâmetros que minimizam uma função de perda."
},
{"id":"regularizacao","num":"07","title":"Regularização","subtitle":"Técnicas para controlar a complexidade e melhorar a generalização dos modelos.","summary":"Regularização adiciona uma penalização à função objetivo para restringir soluções excessivamente complexas. Ridge usa L2 e Lasso usa L1; a escolha da força da penalização é feita por validação.","branches":[["O que é regularização em Machine Learning?","É uma técnica que adiciona uma penalização à função objetivo para controlar a complexidade do modelo e reduzir overfitting, aceitando algum aumento de viés em troca de menor variância."],["Por que a regularização pode reduzir overfitting?","Ela restringe soluções excessivamente complexas, reduzindo a sensibilidade do modelo ao ruído e a particularidades da amostra de treinamento."],["O que é a Ridge Regression?","É uma regressão linear regularizada com penalização L2. Ela adiciona ao erro de treinamento a soma dos quadrados dos coeficientes, fazendo com que sejam encolhidos em direção a zero."],["Qual é a fórmula da Ridge Regression?","β̂ = argminβ [ Σᵢ(yᵢ − xᵢᵀβ)² + λΣⱼβⱼ² ]. O primeiro termo mede o erro de ajuste e o segundo penaliza a magnitude dos coeficientes. λ controla a força da regularização."],["Como interpretar o parâmetro λ na Ridge?","λ = 0 recupera a regressão sem regularização. À medida que λ aumenta, os coeficientes sofrem maior shrinkage."],["O que acontece com os coeficientes quando λ aumenta na Ridge?","Eles tendem a se aproximar de zero, mas normalmente não são exatamente zerados. Por isso, Ridge não é um método de seleção esparsa de variáveis."],["O que é a Lasso Regression?","É uma regressão linear regularizada com penalização L1. A penalização usa o valor absoluto dos coeficientes e pode fazer alguns deles chegarem exatamente a zero."],["Qual é a fórmula da Lasso Regression?","β̂ = argminβ [ Σᵢ(yᵢ − xᵢᵀβ)² + λΣⱼ|βⱼ| ]. O termo Σ|βⱼ| é a penalização L1 e λ determina sua intensidade."],["Por que a Lasso pode fazer seleção de variáveis?","A penalização L1 favorece soluções esparsas. Alguns coeficientes podem ser exatamente iguais a zero, fazendo com que essas features deixem de contribuir diretamente para o modelo."],["Qual é a diferença entre Ridge e Lasso?","Ridge usa uma penalização L2, cuja derivada é proporcional ao próprio coeficiente e tende suavemente a zero. Já o Lasso usa L1, que possui uma não diferenciabilidade em zero e um subgradiente que permite que o ótimo ocorra exatamente em β = 0. Por isso, Lasso pode realizar seleção de variáveis, enquanto Ridge normalmente apenas reduz os coeficientes."],["Como a geometria explica a diferença entre Ridge e Lasso?","Na formulação equivalente com restrição, Ridge possui uma região aproximadamente circular, enquanto Lasso possui uma região com cantos. Esses cantos favorecem soluções em que alguns coeficientes ficam exatamente em zero."],["O que o gráfico de Ridge e Lasso representa?","Ridge é representada por uma fronteira arredondada associada à penalização L2, favorecendo shrinkage contínuo. Lasso possui cantos associados à penalização L1, favorecendo soluções esparsas com coeficientes zerados."],["Por que o scaling é importante em Ridge e Lasso?","A penalização atua sobre os coeficientes. Se as features estiverem em escalas muito diferentes, a regularização pode afetá-las de forma desigual. Por isso, é comum padronizar as features antes do modelo."],["O intercepto deve ser regularizado?","Normalmente não. Em implementações usuais, o intercepto não entra no termo de penalização."],["Como Ridge e Lasso lidam com multicolinearidade?","Ridge tende a ser útil porque reduz conjuntamente coeficientes de variáveis correlacionadas. Lasso pode selecionar uma variável e zerar outras correlacionadas, e essa seleção pode ser instável."],["Como escolher λ?","λ é um hiperparâmetro e deve ser escolhido usando validação, normalmente cross-validation, com uma métrica alinhada ao objetivo."],["O que acontece se λ for muito pequeno?","A penalização terá pouca influência e o modelo se aproxima da solução sem regularização, podendo não controlar suficientemente a variância."],["O que acontece se λ for muito grande?","Os coeficientes são fortemente encolhidos e o modelo pode ficar simples demais, levando a underfitting."],["Qual é a relação entre regularização e o trade-off entre viés e variância?","A regularização normalmente aumenta o viés e reduz a variância. O objetivo é encontrar um nível de complexidade que minimize o erro de generalização, não o erro de treino."],["Quando usar Elastic Net?","Quando queremos combinar características de Ridge e Lasso. Ele utiliza uma combinação das penalizações L1 e L2 e pode ser útil com muitas features correlacionadas."],["Qual é a fórmula do Elastic Net?","Uma forma de escrever é: β̂ = argminβ [ Loss(β) + λ(αΣⱼ|βⱼ| + (1−α)Σⱼβⱼ²) ]. α controla a mistura entre L1 e L2."],["Regularização é a mesma coisa que reduzir features?","Não. Regularização modifica a função objetivo para controlar os parâmetros. Lasso pode produzir seleção de features como consequência de zerar coeficientes, mas isso é diferente de remover variáveis antes do treinamento."],["Como a regularização afeta a interpretabilidade?","Ridge mantém mais variáveis, mas reduz a magnitude dos coeficientes. Lasso pode produzir modelos mais esparsos, embora a seleção possa ser instável quando existem features fortemente correlacionadas."],["Como implementar Ridge e Lasso de forma segura?","Use um Pipeline com o pré-processamento, como StandardScaler, seguido do estimador regularizado. A escolha de λ deve ocorrer dentro da validação para evitar leakage."],["Como escolher entre Ridge, Lasso e Elastic Net?","Ridge é uma opção natural quando queremos shrinkage e estabilidade diante de multicolinearidade; Lasso quando esparsidade é desejada; Elastic Net quando queremos combinar L1 e L2. A decisão final deve ser validada empiricamente."],["O que é shrinkage?", "É o processo de reduzir (“encolher”) os valores dos coeficientes de um modelo em direção a zero, geralmente por meio de regularização."]],"formula":"Ridge: Loss + λΣβⱼ²   |   Lasso: Loss + λΣ|βⱼ|   |   Elastic Net: Loss + λ[αΣ|βⱼ| + (1−α)Σβⱼ²]","checklist":["Sei explicar a diferença entre L1 e L2?","Sei explicar por que Lasso pode zerar coeficientes?","Sei explicar o efeito de λ?","Sei explicar por que scaling é importante?"],"interview":"Na sabatina, destaque que regularização altera a função objetivo para controlar a magnitude dos parâmetros e melhorar a generalização."},
{
 id:"naivebayes", num:"12", title:"Naive Bayes", subtitle:"Classificador probabilístico baseado no Teorema de Bayes e na hipótese de independência condicional.",
 summary:"Naive Bayes calcula a probabilidade posterior de cada classe a partir do prior e da verossimilhança das features. É simples, rápido e especialmente útil em texto e alta dimensionalidade.",
 branches:[
  ["O que é o Naive Bayes e em que tipo de problema ele é usado?","É um modelo probabilístico de classificação. Para cada classe, estima a probabilidade posterior P(y|x) e escolhe a classe com maior probabilidade. É usado principalmente em classificação, não em regressão."],
  ["O que é o Teorema de Bayes?","É uma forma de atualizar uma probabilidade após observar evidências: P(A|B)=P(B|A)P(A)/P(B). No modelo, usamos evidências das features para atualizar a probabilidade das classes."],
  ["Qual é a lógica do Naive Bayes?","Para cada classe, combina o prior P(y) com as probabilidades das features condicionadas à classe. A classe escolhida é a que maximiza P(y|x)."],
  ["Por que o modelo é chamado de 'Naive'?","Porque assume que as features são condicionalmente independentes entre si dado o target: P(x₁,...,xₚ|y)=ΠⱼP(xⱼ|y). É uma simplificação forte, mas torna o cálculo muito mais simples."],
  ["O que são prior, likelihood e posterior no Naive Bayes?","Prior é P(y), a probabilidade da classe antes das features. Likelihood é P(x|y), a compatibilidade das features com a classe. Posterior é P(y|x), a probabilidade atualizada após observar as features."],
  ["Por que a hipótese de independência pode funcionar mesmo sendo irrealista?","A independência pode ser violada e ainda assim a ordem relativa entre as classes permanecer correta. Assim, as probabilidades podem não ser perfeitamente calibradas, mas a classificação pode funcionar bem."],
  ["Quais são as principais variações do Naive Bayes?","GaussianNB, para features contínuas modeladas por distribuição Normal; MultinomialNB, para contagens ou frequências; BernoulliNB, para features binárias. Há ainda variantes para outros tipos de distribuição."],
  ["Quando usar Gaussian Naive Bayes?","Quando as features são contínuas e a hipótese de uma distribuição aproximadamente Normal dentro de cada classe é razoável. É uma opção rápida para dados numéricos."],
  ["Quando usar Multinomial Naive Bayes?","É muito usado com contagens ou frequências não negativas, especialmente classificação de texto com bag-of-words ou TF-IDF, dependendo da representação adotada."],
  ["Quando usar Bernoulli Naive Bayes?","Quando cada feature representa presença/ausência ou outro indicador binário. Em texto, pode representar se uma palavra apareceu ou não no documento."],
  ["Qual é a fórmula central do Naive Bayes?","Sob a hipótese de independência condicional, P(y|x) ∝ P(y) × ΠⱼP(xⱼ|y). O termo P(x) é comum às classes e pode ser omitido na comparação."],
  ["O que é Laplace smoothing e por que ele é importante?","É uma técnica de suavização que adiciona uma pequena quantidade às contagens. Evita probabilidades zero quando uma combinação feature-classe não apareceu no treino."],
  ["Como a máxima verossimilhança aparece no Naive Bayes?","No treinamento, estimamos os parâmetros das distribuições condicionais P(xⱼ|y) por máxima verossimilhança. Em outras palavras, escolhemos os parâmetros que tornam os dados observados mais prováveis sob cada classe. Por exemplo, no GaussianNB estimamos média e variância de cada feature dentro de cada classe; no MultinomialNB, as probabilidades das categorias/termos a partir das contagens. A suavização pode ser usada para evitar estimativas problemáticas, como probabilidades zero."] ,

  ["O Naive Bayes precisa de tratamento de dados?","Sim. O tratamento depende da variante: verificar tipos, valores ausentes, representação das categóricas, valores negativos quando a variante não os aceita e escala/distribuição quando relevante. Não é correto assumir que o modelo dispensa preparação."],
  ["Como o Naive Bayes lida com valores faltantes?","Em geral, não se deve simplesmente passar NaNs sem verificar a implementação. Pode ser necessário imputar, remover observações ou usar uma estratégia compatível com a variante. A imputação deve ser aprendida apenas no treino para evitar leakage."],
  ["Como o Naive Bayes lida com outliers?","Depende da variante. GaussianNB pode ser afetado porque a estimativa de média e variância por classe pode sofrer influência de valores extremos. Vale investigar outliers e, quando fizer sentido, tratá-los ou usar transformações robustas."],
  ["Como o Naive Bayes lida com dados categóricos?","Categóricas precisam ser representadas de forma compatível com o modelo. One-Hot pode ser usado em algumas variantes, enquanto categorias discretas podem ser tratadas diretamente por modelos como CategoricalNB."],
  ["O que é Categorical Naive Bayes e quando usar?","CategoricalNB é apropriado quando as features são categóricas discretas. Ele estima a distribuição das categorias por classe, evitando transformar necessariamente cada categoria em uma coluna binária."],
  ["O Naive Bayes precisa de scaling?","Normalmente não. Como o modelo não calcula distâncias, não existe a mesma necessidade de padronização que há em KNN ou SVM. Entretanto, transformações podem ser úteis conforme a distribuição e a variante utilizada."],
  ["Como o Naive Bayes lida com dados desbalanceados?","Ele incorpora as frequências das classes no prior, portanto uma classe majoritária pode receber maior probabilidade inicial. Em cenários desbalanceados, é importante avaliar métricas adequadas e, se necessário, ajustar priors, amostragem ou estratégia de decisão."],
  ["O Naive Bayes tende a overfitting ou underfitting?","Por ter uma estrutura simples e uma hipótese forte de independência, frequentemente apresenta baixo custo computacional e boa capacidade de generalização, mas pode sofrer underfitting quando as dependências entre features são importantes. Overfitting pode ocorrer, embora seja menos comum que em modelos muito flexíveis."],
  ["Quais são as principais vantagens do Naive Bayes?","É simples, rápido para treinar e prever, funciona bem com alta dimensionalidade, requer poucos dados para estimar parâmetros e costuma ser uma ótima baseline. Também é especialmente eficiente em algumas aplicações de texto."],
  ["Quais são as principais desvantagens do Naive Bayes?","A hipótese de independência pode ser inadequada, probabilidades podem ser mal calibradas e o modelo pode perder desempenho quando interações entre features são essenciais. A qualidade também depende da distribuição assumida pela variante."],
  ["Quando o Naive Bayes é uma boa escolha?","Quando há alta dimensionalidade, necessidade de treinamento rápido, poucos recursos computacionais, dados de texto ou uma baseline probabilística simples. É útil quando a simplicidade e a velocidade são importantes."],
  ["Quando evitar o Naive Bayes?","Quando as relações entre features são fortemente dependentes e essas interações são essenciais para a decisão, ou quando probabilidades muito bem calibradas são requisito sem uma etapa adicional de calibração."],
  ["Como o Naive Bayes se comporta em alta dimensionalidade?","Costuma lidar bem com muitas features porque estima distribuições de forma relativamente simples e não precisa estimar interações entre todas elas. Por isso é tradicionalmente forte em classificação de texto."],
  ["Como avaliar um Naive Bayes em um problema desbalanceado?","Além da acurácia, analisar matriz de confusão, precision, recall, F1, PR-AUC e métricas por classe. A escolha depende do custo de falsos positivos e falsos negativos."],
  ["Qual seria um exemplo de aplicação do Naive Bayes?","Classificação de spam, categorização de documentos, análise de texto e classificação rápida de tickets. Em texto, as variantes Multinomial e Bernoulli são especialmente conhecidas."],
  ["Qual é a principal diferença entre Naive Bayes e regressão logística?","Naive Bayes modela a distribuição das features condicionada à classe e aplica Bayes. A regressão logística modela diretamente o log-odds da classe como função das features. Ambos podem ser fortes em classificação, mas fazem suposições diferentes."],
 ],
 concepts:[ ],
 formula:"P(y|x) = P(x|y)P(y)/P(x)  |  P(y|x) ∝ P(y) Πⱼ P(xⱼ|y)",
 checklist:["Sei explicar o Teorema de Bayes?","Sei explicar por que o modelo é 'naive'?","Sei diferenciar Gaussian, Multinomial, Bernoulli e Categorical NB?","Sei explicar Laplace smoothing?","Sei discutir missing, outliers e desbalanceamento?"],
 interview:"Na sabatina, destaque que a hipótese naive é uma simplificação computacional: mesmo quando a independência é falsa, a regra de decisão pode continuar funcionando bem. O modelo costuma ser rápido, escalável e competitivo como baseline, especialmente em texto."

{"id":"linear","num":"09","title":"Regressão Linear","subtitle":"Modelo supervisionado para regressão contínua e base para modelos lineares.","summary":"A Regressão Linear modela um target contínuo como combinação linear dos preditores. O OLS estima os coeficientes minimizando a soma dos quadrados dos resíduos. Para inferência e diagnóstico, é essencial avaliar linearidade, independência, homoscedasticidade, multicolinearidade e a influência de outliers.","branches":[["O que é Regressão Linear?","É um modelo supervisionado que estima uma variável-alvo contínua como uma combinação linear dos preditores. Na regressão linear múltipla, a previsão pode ser escrita como ŷ = β₀ + β₁x₁ + ... + βₚxₚ."],["Qual é o formato da função de Regressão Linear?","A função assume a forma ŷ = β₀ + β₁x₁ + ... + βₚxₚ. O modelo é linear nos parâmetros β, mesmo que seja possível incluir transformações das features, como x² ou log(x), desde que os parâmetros continuem entrando linearmente."],["O que representam β₀ e βⱼ na Regressão Linear?","β₀ é o intercepto: o valor esperado de y quando os preditores são zero, desde que essa interpretação faça sentido no domínio. βⱼ representa a variação esperada de y associada a uma unidade adicional em xⱼ, mantendo os demais preditores constantes."],["Como os coeficientes são estimados pelo método dos mínimos quadrados?","O Ordinary Least Squares (OLS) escolhe os coeficientes que minimizam a soma dos quadrados dos resíduos: Σᵢ(yᵢ − ŷᵢ)². A ideia é encontrar a reta ou hiperplano que produz o menor erro quadrático total no conjunto de treino."],["Por que o erro é elevado ao quadrado no OLS?","O quadrado torna erros positivos e negativos comparáveis, penaliza mais fortemente erros grandes e produz uma função objetivo diferenciável e convexa no caso linear, permitindo uma solução ótima global sob as condições usuais."],["Quais são as principais premissas da Regressão Linear?","Para o modelo e, principalmente, para a inferência clássica, é importante avaliar: relação linear nos parâmetros, independência das observações/erros, ausência de multicolinearidade perfeita, homoscedasticidade e, para inferência exata em pequenas amostras, normalidade dos erros. A normalidade não é necessária para obter coeficientes OLS."],["O que significa linearidade na Regressão Linear?","Significa que a esperança condicional de y pode ser representada linearmente nos parâmetros. Não significa necessariamente que cada relação individual precise ser uma reta: transformações e termos polinomiais podem representar relações curvas mantendo o modelo linear nos coeficientes."],["O que significa independência dos erros?","Os resíduos de uma observação não devem depender sistematicamente dos resíduos de outras observações. Dependência temporal, espacial ou por grupos pode invalidar erros-padrão usuais e prejudicar a generalização."],["O que é homoscedasticidade?","É a condição em que a variância dos erros é aproximadamente constante ao longo dos valores previstos ou das features. Heteroscedasticidade não necessariamente torna os coeficientes OLS enviesados sob condições adequadas, mas pode tornar os erros-padrão e testes de hipótese usuais incorretos."],["O que é normalidade dos resíduos e quando ela é necessária?","A normalidade dos erros é uma suposição útil para inferência exata de coeficientes, especialmente em amostras pequenas. Ela não é uma exigência para usar OLS como método preditivo, e grandes amostras podem permitir inferência aproximada por resultados assintóticos."],["O que é multicolinearidade e por que ela é um problema?","É a presença de forte dependência linear entre preditores. Ela aumenta a variância das estimativas dos coeficientes, pode torná-las instáveis e dificulta a interpretação individual das features. Correlação entre features e VIF podem ajudar no diagnóstico."],["O que acontece quando há multicolinearidade perfeita?","A matriz de desenho deixa de ter posto completo e os coeficientes não são identificáveis de forma única pelo OLS. É necessário remover, combinar ou transformar variáveis, ou utilizar métodos regularizados."],["Como os outliers afetam a Regressão Linear?","Como o OLS minimiza erros ao quadrado, observações com resíduos muito grandes podem exercer influência desproporcional sobre a estimação. Um outlier em x também pode ter alta alavancagem. É importante distinguir erro de medição de observação legítima."],["Qual é a diferença entre outlier, leverage e ponto influente?","Outlier é uma observação com valor atípico, frequentemente no eixo da resposta. Leverage é uma observação com valores de preditores muito afastados do centro dos demais. Um ponto influente é aquele cuja presença pode alterar significativamente os coeficientes ou as previsões."],["Como fazer análise de resíduos em uma Regressão Linear?","Eu avaliaria resíduos versus valores ajustados, resíduos versus cada preditor, distribuição dos resíduos e, quando necessário, autocorrelação. Procuro padrões, curvatura, variância crescente e pontos influentes. O objetivo é verificar se há estrutura que o modelo deixou de explicar."],["O que um gráfico de resíduos versus valores ajustados pode revelar?","Uma nuvem aproximadamente aleatória em torno de zero é compatível com um bom ajuste estrutural. Curvatura sugere não linearidade; formato de funil sugere heteroscedasticidade; grupos ou padrões podem indicar variáveis omitidas, dependência ou especificação inadequada."],["Como detectar heteroscedasticidade nos resíduos?","Além da inspeção gráfica, testes como Breusch-Pagan ou White podem ser usados. Também posso considerar erros-padrão robustos ou transformar a variável/respecificar o modelo, dependendo da causa e do objetivo."],["Como detectar autocorrelação dos resíduos?","Em séries temporais, posso analisar ACF/PACF dos resíduos e usar testes como Durbin-Watson em contextos apropriados. Se houver dependência temporal, a validação também precisa respeitar a ordem do tempo."],["O que significa alto viés em uma Regressão Linear?","Um modelo linear pode apresentar alto viés quando a relação real é mais complexa do que a estrutura que ele consegue representar. Isso aparece como erro elevado tanto no treino quanto na validação. Transformações, interações ou um modelo mais flexível podem reduzir esse viés."],["Como identificar underfitting em Regressão Linear?","Um sinal é desempenho ruim no treino e também em validação/teste. Pode ocorrer quando a relação real é não linear, faltam features relevantes ou o modelo está excessivamente restrito."],["A Regressão Linear pode sofrer overfitting?","Sim. Apesar de ser simples, pode overfit quando há muitas features em relação ao número de observações, features muito flexíveis/derivadas, interações ou alta dimensionalidade. Regularização pode ajudar."],["Como a regularização é aplicada à Regressão Linear?","Ridge adiciona uma penalização L2 aos coeficientes; Lasso adiciona L1; Elastic Net combina as duas. Essas penalizações restringem a magnitude dos coeficientes e podem melhorar a generalização."],["Qual é a diferença entre Ridge e Lasso na Regressão Linear?","Ridge tende a encolher os coeficientes sem zerá-los, sendo útil em presença de multicolinearidade. Lasso pode zerar coeficientes e produzir um modelo esparso, funcionando também como seleção de variáveis."],["A Regressão Linear precisa de scaling?","OLS sem regularização não exige scaling para produzir as mesmas previsões, embora a escala altere a magnitude e a interpretação dos coeficientes. Scaling é especialmente importante quando usamos regularização, porque a penalização depende da escala dos coeficientes."],["Como tratar variáveis categóricas na Regressão Linear?","Variáveis categóricas precisam ser representadas numericamente. Para categorias nominais, One-Hot Encoding é uma opção comum, escolhendo uma referência para evitar redundância perfeita. O encoding deve ser ajustado apenas no treino."],["Como tratar valores ausentes?","O OLS tradicional não aceita missing values diretamente. É necessário remover ou imputar os valores de acordo com o contexto, ajustando qualquer imputador somente no treino para evitar leakage."],["Qual é a diferença entre correlação e coeficiente da regressão?","Correlação mede associação entre duas variáveis em uma escala padronizada. O coeficiente de regressão representa o efeito estimado de uma feature sobre o target mantendo as demais constantes. Nenhum deles, por si só, estabelece causalidade."],["Como validar uma Regressão Linear corretamente?","Separaria um conjunto de teste final e usaria validação cruzada no conjunto de desenvolvimento quando apropriado. O pré-processamento deve estar dentro de um Pipeline. Para séries temporais, usaria validação temporal em vez de embaralhamento aleatório."],["Como interpretar um modelo com bom R² no treino e ruim no teste?","É um sinal de possível overfitting, leakage no processo de desenvolvimento, mudança de distribuição ou amostra de teste pouco representativa. Eu investigaria a separação dos dados, a estabilidade das features e a estratégia de validação."],["Quando a Regressão Linear é uma boa escolha?","Quando a relação pode ser aproximada adequadamente por uma função linear nos parâmetros, quando interpretabilidade é importante e quando o custo computacional baixo é uma vantagem. Também é um excelente baseline."],["Quais são as principais vantagens da Regressão Linear?","É simples, rápida, interpretável, possui solução bem estudada, permite inferência sob hipóteses adequadas e funciona muito bem como baseline quando a estrutura linear é razoável."],["Quais são as principais limitações da Regressão Linear?","Pode apresentar alto viés quando a relação é não linear, é sensível a outliers, sofre com multicolinearidade e depende de cuidados com a estrutura dos resíduos para inferência. Também pode exigir engenharia de features para representar interações e não linearidades."]],"formula":"ŷ = β₀ + β₁x₁ + ... + βₚxₚ   |   OLS: minβ Σᵢ(yᵢ − ŷᵢ)²","checklist":["Sei explicar as premissas da Regressão Linear?","Sei interpretar os coeficientes?","Sei analisar resíduos e identificar heteroscedasticidade?","Sei diferenciar MAE, MSE e RMSE?","Sei explicar Ridge e Lasso?","Sei explicar o efeito de outliers e multicolinearidade?"],"interview":"Na sabatina, não basta dizer que a regressão linear minimiza o erro: explique OLS, premissas, resíduos, outliers, multicolinearidade, alto viés, regularização, scaling e escolha da métrica."},
{
 id:"logistica", num:"11", title:"Regressão Logística", subtitle:"Modelo supervisionado para classificação binária e extensões multiclasses.", summary:"Modelo probabilístico discriminativo que relaciona as features aos log-odds da classe positiva e transforma esse valor em probabilidade por meio da função logística.", branches:[
  ["O que é regressão logística e qual problema ela resolve?","É um modelo supervisionado usado principalmente para classificação. Na versão binária, estima P(y=1|x) entre 0 e 1 e depois um threshold transforma a probabilidade em classe. Apesar do nome, não é um modelo de regressão de variável contínua."],
  ["O modelo lida com problemas de classificação ou regressão?","Classificação. Pode ser usada para classificação binária e, por extensões como multinomial/softmax ou estratégias one-vs-rest, para múltiplas classes. Não deve ser confundida com regressão linear."],
  ["Como funciona matematicamente a regressão logística?","Primeiro calcula z = β₀ + βᵀx. Depois aplica a função sigmoide σ(z)=1/(1+e^(−z)), obtendo uma probabilidade entre 0 e 1 para a classe positiva."],

  ["Qual é o papel da função sigmoide na regressão logística?","A sigmoide transforma o valor linear z = β₀ + βᵀx em um número entre 0 e 1, permitindo interpretá-lo como probabilidade da classe positiva. Ela também faz a ponte entre o preditor linear e os log-odds: p = σ(z) e log(p/(1−p)) = z."],
  ["Por que não podemos modelar as probabilidades diretamente com uma regressão linear?","Porque uma regressão linear pode produzir valores menores que 0 ou maiores que 1, que não são probabilidades válidas. Além disso, a variância de uma variável binária depende da própria probabilidade. A regressão logística resolve isso modelando linearmente o logit e depois transformando-o em uma probabilidade válida."],
  ["O que são log-odds?","Odds são p/(1−p), isto é, a razão entre a chance do evento ocorrer e não ocorrer. Log-odds, ou logit, é log(p/(1−p)). Na regressão logística, o logit é modelado linearmente pelas features."],
  ["Por que usar log-odds no modelo?","Porque a probabilidade está limitada entre 0 e 1, enquanto os log-odds variam de −∞ a +∞. Isso permite representar a relação linear entre as features e o logit e depois retornar ao espaço de probabilidades pela sigmoide."],
  ["Como interpretar um coeficiente βⱼ?","Mantendo as demais variáveis constantes, βⱼ representa a variação esperada nos log-odds quando xⱼ aumenta uma unidade. βⱼ positivo aumenta a chance da classe positiva; βⱼ negativo reduz."],
  ["Como interpretar exp(βⱼ) em regressão logística?","exp(βⱼ) é a razão de chances (odds ratio) associada ao aumento de uma unidade em xⱼ, mantendo as demais variáveis constantes. Valor >1 aumenta as odds; <1 reduz; =1 indica ausência de efeito nas odds."],
  ["Quais são as premissas da regressão logística sobre os dados?","Não exige normalidade dos preditores nem homocedasticidade como a regressão linear. Pressupõe observações independentes, relação aproximadamente linear entre cada preditor contínuo e o logit, ausência de multicolinearidade severa e ausência de pontos excessivamente influentes."],
  ["O que significa linearidade no logit?","A relação que precisa ser aproximadamente linear não é entre x e a probabilidade diretamente, mas entre os preditores e o logit: log(p/(1−p)) = β₀ + βᵀx. Relações não lineares podem exigir transformações, splines ou termos polinomiais."],
  ["Há necessidade de tratamento de dados antes da regressão logística?","Sim. É necessário avaliar missing values, categorias, outliers, duplicidades, escalas, multicolinearidade e qualidade das variáveis. Também é importante separar treino e teste antes de ajustar transformações para evitar leakage."],
  ["A regressão logística precisa de scaling?","Não é matematicamente obrigatório, mas frequentemente é recomendado, principalmente quando as features estão em escalas muito diferentes, há regularização ou se deseja melhorar a estabilidade numérica e tornar a comparação dos coeficientes mais coerente."],
  ["Como a regressão logística lida com variáveis categóricas?","Não recebe categorias nominais diretamente. É necessário codificá-las, normalmente com One-Hot Encoding. Para categorias ordinais, uma codificação ordinal pode ser adequada quando a ordem tem significado real. O encoding deve ser ajustado somente no treino."],
  ["Como o modelo lida com valores faltantes?","A regressão logística não trata missing values automaticamente. É necessário imputar ou tratar esses valores antes do treinamento."],
  ["Como a regressão logística lida com outliers?","Pode ser sensível a outliers e principalmente a pontos de alta alavancagem/influência, porque eles podem alterar significativamente os coeficientes. É necessário investigar se são erros, casos raros legítimos ou sinais importantes; não se deve removê-los automaticamente."],
  ["Existe problema de underfitting ou overfitting na regressão logística?","Sim. Por ser um modelo relativamente simples, pode sofrer underfitting quando a fronteira real é muito complexa. Também pode sofrer overfitting, especialmente com muitas features, poucos dados, multicolinearidade ou classes separáveis, situação em que a regularização ajuda."],
  ["A regressão logística precisa de regularização?","Não obrigatoriamente, mas regularização é muito útil para controlar complexidade e melhorar generalização. L2 reduz os coeficientes e é uma escolha comum; L1 pode zerar coeficientes e produzir seleção esparsa de features. A intensidade deve ser ajustada por validação."],
  ["Como a regressão logística é treinada?","Tipicamente por máxima verossimilhança, que equivale a minimizar a log-loss ou cross-entropy. Algoritmos numéricos como Newton-Raphson, L-BFGS ou métodos baseados em gradiente podem ser usados para encontrar os coeficientes."],
  ["O que é o threshold e qual seu impacto?","É o limite usado para transformar a probabilidade estimada em classe. Com threshold 0,5, probabilidades acima desse valor são classificadas como positivas. Reduzi-lo tende a aumentar recall e FP; aumentá-lo tende a reduzir FP e aumentar FN, dependendo dos dados."],
  ["Como escolher o threshold em um problema de negócio?","Não deveria ser escolhido automaticamente como 0,5. Deve considerar custos de falsos positivos e falsos negativos, capacidade operacional e objetivo do negócio. Pode ser definido usando uma métrica ou função de custo validada em dados que não participaram do treinamento."],
  ["Como avaliar uma regressão logística em dados desbalanceados?","Acurácia isolada pode ser enganosa. É importante analisar matriz de confusão, precision, recall, F1, PR-AUC e ROC-AUC, escolhendo as métricas conforme o custo de FP e FN. O threshold também deve ser avaliado explicitamente."],
  ["O que é separação perfeita e por que ela é um problema?","Acontece quando uma combinação das features separa perfeitamente as classes. Os coeficientes podem crescer muito em magnitude e a estimativa por máxima verossimilhança não converge para valores finitos. Regularização ou revisão das features pode ajudar."],
  ["Como a multicolinearidade afeta a regressão logística?","Features muito correlacionadas tornam os coeficientes instáveis, aumentam sua variância e dificultam a interpretação individual. Regularização pode reduzir o problema, mas também é importante avaliar redundância, VIF e conhecimento de negócio."],
  ["Quais são as principais vantagens da regressão logística?","É interpretável, estima probabilidades, treina rapidamente, funciona bem como baseline, permite regularização e tem boa transparência para explicar decisões. Seus coeficientes também permitem analisar a associação entre features e o log-odds da classe positiva."],
  ["Quais são as principais desvantagens da regressão logística?","A fronteira de decisão é linear no espaço das features e o modelo depende de uma relação aproximadamente linear entre as features e o logit. Também pode sofrer com multicolinearidade, outliers influentes, separação perfeita e necessidade de engenharia de features para relações não lineares."],
  ["Em que situação você escolheria regressão logística em vez de um modelo mais complexo?","Quando interpretabilidade, transparência, velocidade e uma relação aproximadamente linear no logit são importantes. É um excelente baseline e pode ser preferível quando o ganho de modelos mais complexos não compensa a perda de interpretabilidade ou o custo operacional."],

{
 id:"arvore", num:"14", title:"Árvore de Decisão", subtitle:"Modelo baseado em divisões recursivas do espaço de features.",
 summary:"Árvores aprendem regras do tipo 'feature ≤ limiar' para particionar os dados. Podem resolver classificação e regressão, capturam não linearidades e interações e são fáceis de visualizar, mas podem sofrer overfitting.",
 branches:[["O que é uma Árvore de Decisão e como ela faz previsões?","É um modelo que particiona recursivamente o espaço de features por regras do tipo feature ≤ limiar. Cada observação percorre os nós até uma folha, e a folha fornece a previsão: classe/probabilidade em classificação ou um valor numérico, normalmente a média dos alvos, em regressão."],["Como uma Árvore de Decisão escolhe o primeiro split?","Ela avalia candidatos de feature e ponto de corte e escolhe aquele que mais melhora um critério de divisão. Em classificação, busca reduzir a impureza; em regressão, busca reduzir o erro ou a variância dentro dos nós."],["O que é impureza em uma Árvore de Decisão?","É uma medida de quão misturadas estão as classes em um nó. Um nó puro contém essencialmente uma única classe. Critérios comuns são Gini e entropia."],["Como funciona o índice Gini?","Para um nó com proporções p_k das classes, Gini = 1 − Σ p_k². Quanto menor o Gini, mais puro é o nó; ele é zero quando todas as observações pertencem à mesma classe."],["Como funciona a entropia em uma Árvore de Decisão?","Entropia = −Σ p_k log₂(p_k). Ela mede a incerteza do nó: é zero quando o nó é puro e aumenta quando as classes ficam mais misturadas."],["Qual é a diferença entre Gini e entropia?","Ambas medem impureza e geralmente produzem splits semelhantes. Gini tende a ser um pouco mais simples computacionalmente; entropia usa logaritmos. Na prática, a escolha costuma ter impacto menor do que hiperparâmetros e qualidade dos dados."],["O que é ganho de informação e como ele é usado?","É a redução da entropia causada por um split. O algoritmo compara a impureza antes da divisão com a impureza média ponderada dos filhos e prefere divisões que produzam maior redução."],["Como a Árvore de Decisão funciona em problemas de regressão?","Em cada split, procura reduzir uma medida de erro, frequentemente a soma dos erros quadráticos ou a variância dentro dos nós. Na folha, a previsão usual é a média dos valores-alvo das observações que chegaram ali."],["Como a profundidade da árvore afeta o modelo?","Maior profundidade permite regras mais específicas e maior complexidade, reduzindo o viés mas aumentando o risco de overfitting. Profundidade muito pequena pode gerar underfitting."],["Quais são os principais hiperparâmetros de uma Árvore de Decisão?","max_depth limita a profundidade; min_samples_split define o mínimo de amostras para dividir um nó; min_samples_leaf define o mínimo por folha; max_features limita as features consideradas; criterion define o critério de divisão; e ccp_alpha controla poda por complexidade."],["Como controlar overfitting em uma Árvore de Decisão?","Posso limitar max_depth, aumentar min_samples_leaf ou min_samples_split, limitar max_features e usar pruning, como cost-complexity pruning com ccp_alpha. A escolha deve ser validada em dados não vistos."],["O que é pruning e por que ele é importante?","Pruning remove partes da árvore que agregam pouco poder preditivo em relação à complexidade adicionada. Isso reduz a capacidade de memorizar ruído e pode melhorar a generalização."],["Árvores de Decisão precisam de scaling?","Em geral, não. Como a árvore toma decisões por limiares de uma feature, transformar a escala de uma variável normalmente não altera a ordem dos valores nem os splits possíveis. Por isso, StandardScaler ou MinMaxScaler não são necessários por causa do algoritmo."],["Como uma Árvore de Decisão lida com variáveis categóricas?","Depende da implementação. Algumas bibliotecas suportam categorias diretamente; em outras, é necessário codificá-las. One-Hot Encoding pode funcionar, mas deve ser aplicado dentro do Pipeline para evitar inconsistências e leakage."],["Como uma Árvore de Decisão lida com valores ausentes?","Depende da implementação. Algumas árvores suportam missing values diretamente; outras exigem imputação. Quando imputar, a estratégia deve ser aprendida apenas no treino para evitar leakage."],["Como uma Árvore de Decisão lida com outliers?","É relativamente robusta a outliers nas features porque trabalha com pontos de corte, e não com distâncias ou médias globais para definir a escala. Porém, outliers podem influenciar splits e, principalmente em regressão, podem afetar fortemente a média prevista nas folhas."],["Como uma Árvore de Decisão lida com dados desbalanceados?","O critério de impureza pode favorecer a classe majoritária, fazendo a árvore produzir folhas com pouca representação da classe rara. Posso usar class_weight, amostragem, critérios e métricas adequadas, além de ajustar o threshold quando a saída probabilística permitir."],["Como interpretar as probabilidades de uma Árvore de Decisão de classificação?","Em uma implementação típica, a probabilidade de uma classe em uma folha é a proporção de observações daquela classe na folha. Essas probabilidades podem ser pouco calibradas, especialmente em árvores muito pequenas ou muito profundas, então calibração deve ser avaliada quando probabilidades forem usadas para decisão."],["Como avaliar a importância das features em uma Árvore de Decisão?","A feature importance por redução de impureza soma a contribuição dos splits daquela variável, ponderada pelo tamanho dos nós. Ela é útil, mas pode favorecer variáveis contínuas ou de alta cardinalidade. Permutation importance e SHAP podem complementar a interpretação."],["Qual é a complexidade computacional de treinar uma Árvore de Decisão?","Depende de n, número de features, profundidade e estratégia de busca dos splits. De forma aproximada, o custo cresce com o número de amostras e features, e árvores profundas ou dados de alta dimensão podem ficar mais caras. A implementação concreta determina a complexidade exata."],["Quais são as principais vantagens das Árvores de Decisão?","Capturam relações não lineares e interações, exigem pouco pré-processamento, são fáceis de visualizar e interpretar em árvores pequenas e funcionam para classificação e regressão. Também não dependem de scaling."],["Quais são as principais desvantagens das Árvores de Decisão?","Árvores individuais podem ter alta variância, sofrer overfitting e ser instáveis: pequenas mudanças nos dados podem gerar estruturas diferentes. Também podem produzir fronteiras em degraus e ficar difíceis de interpretar quando muito profundas."],["Uma Árvore de Decisão faz seleção de features automaticamente?","Sim, porque somente features escolhidas para splits aparecem na árvore. Isso pode gerar uma forma de seleção implícita, mas não significa que as features não escolhidas sejam irrelevantes: elas podem ser redundantes, ter pouco ganho marginal ou não terem sido selecionadas naquela amostra."],["Como a Árvore de Decisão captura interações entre variáveis?","As próprias divisões sequenciais criam interações. Por exemplo, depois de dividir por renda, a árvore pode fazer uma segunda divisão por idade somente dentro de uma determinada faixa de renda, representando uma regra condicional entre as duas features."],["Qual é a diferença entre uma árvore para classificação e uma para regressão?","A estrutura é semelhante, mas o critério de split e a previsão da folha mudam. Classificação busca separar classes usando medidas como Gini ou entropia e prevê classes/probabilidades; regressão reduz erro ou variância e prevê valores numéricos."],["Como eu escolheria os hiperparâmetros de uma Árvore de Decisão em um projeto real?","Definiria uma métrica alinhada ao objetivo, criaria uma validação adequada ao processo de geração dos dados e buscaria hiperparâmetros como max_depth, min_samples_leaf e ccp_alpha. Também compararia a complexidade e a estabilidade do modelo, não apenas o melhor score médio."],["Em um problema de fraude, como eu usaria uma Árvore de Decisão?","Primeiro trataria o desbalanceamento e definiria custos para falso positivo e falso negativo. Avaliaria precision, recall, PR-AUC e a matriz de confusão, ajustaria o threshold se necessário e controlaria a profundidade para evitar uma árvore que memorize transações do treino."],["Quando uma Árvore de Decisão é uma boa escolha e quando eu consideraria outro modelo?","É uma boa opção quando interpretabilidade, regras condicionais e pouca necessidade de preprocessing são importantes. Se uma única árvore apresentar alta variância ou desempenho instável, ensembles como Random Forest ou Gradient Boosting podem ser considerados, comparando desempenho, custo e interpretabilidade."]],

{
 id:"randomforest", num:"12", title:"Ensembles", subtitle:"Combinação de modelos para melhorar generalização, reduzir variância ou corrigir erros sistemáticos.",
 summary:"Ensembles combinam múltiplos modelos para obter uma previsão mais robusta. Bagging explora diversidade para reduzir variância; boosting constrói modelos sequencialmente para corrigir erros; stacking aprende como combinar modelos diferentes.",
 branches:[
  ["O que é um ensemble em Machine Learning?","É uma estratégia que combina previsões de vários modelos para produzir uma previsão final potencialmente mais robusta, estável ou precisa do que um único modelo."],
  ["Por que usar ensembles em vez de um único modelo?","O objetivo é explorar modelos complementares ou diversas versões de um modelo para reduzir variância, reduzir viés, melhorar generalização ou aproveitar diferentes padrões dos dados."],
  ["Quais são os principais tipos de ensemble?","Os principais são bagging, boosting e stacking. Também existem estratégias como voting e blending para combinar modelos."],
  ["O que é Bagging?","Bagging treina vários modelos de forma independente em diferentes amostras bootstrap e agrega suas previsões. O foco principal é reduzir variância."],
  ["O que o Bagging busca resolver?","Principalmente alta variância e instabilidade de modelos sensíveis ao conjunto de treinamento, como árvores de decisão profundas."],
  ["Como o bootstrap aparece no Bagging?","Cada modelo é treinado em uma amostra do treino obtida com reposição. Assim, cada estimador recebe uma composição ligeiramente diferente dos dados."],
  ["Por que a agregação reduz a variância no Bagging?","Quando os modelos não são perfeitamente correlacionados, parte dos erros individuais se compensa ao fazer média ou votação."],
  ["O que é Boosting?","É uma estratégia em que modelos fracos são treinados sequencialmente, e cada novo modelo busca melhorar a previsão combinada corrigindo erros ou resíduos anteriores."],
  ["O que o Boosting busca resolver?","Busca principalmente reduzir viés e construir um modelo forte a partir de vários modelos simples, embora também possa controlar variância dependendo da configuração."],
  ["Por que o Boosting é sequencial?","Porque o modelo seguinte depende do desempenho dos anteriores: ele recebe informação sobre os erros ou sobre onde o ensemble ainda precisa melhorar."],
  ["Qual é a diferença central entre Bagging e Boosting?","Bagging treina estimadores predominantemente de forma independente e agrega para reduzir variância; Boosting os constrói sequencialmente para corrigir erros e reduzir viés."],
  ["O que é Stacking?","Stacking combina modelos diferentes em um segundo modelo, chamado meta-modelo, que aprende como ponderar ou combinar as previsões dos modelos base."],
  ["O que o Stacking busca resolver?","Busca explorar modelos com vieses e padrões diferentes, aprendendo uma combinação que aproveite os pontos fortes de cada modelo."],
  ["Como evitar leakage ao treinar um Stacking?","As previsões usadas para treinar o meta-modelo devem ser out-of-fold, geradas sem que o modelo base tenha treinado na observação cuja previsão está sendo usada."],
  ["O que é Random Forest e qual estratégia de ensemble ele utiliza?","É um ensemble de árvores baseado em bagging, bootstrap e seleção aleatória de features em cada split, buscando árvores diversas e menos correlacionadas."],
  ["O que o Random Forest busca resolver?","Principalmente a alta variância de árvores individuais, tornando a previsão mais estável por meio da diversidade e agregação de várias árvores."],
  ["Como o Random Forest faz classificação e regressão?","Na classificação, combina as classes ou probabilidades das árvores; na regressão, normalmente agrega as previsões numéricas por média."],
  ["O que é Out-of-Bag (OOB) no Random Forest?","São observações que ficaram fora do bootstrap de determinada árvore. Elas podem ser usadas para obter uma estimativa interna de erro sem usar essa árvore para treiná-las."],
  ["Por que o Random Forest seleciona aleatoriamente features em cada split?","Para reduzir a correlação entre árvores. Se todas vissem sempre as mesmas features, poderiam produzir árvores muito semelhantes e reduzir o benefício da agregação."],
  ["Quais são os principais hiperparâmetros do Random Forest?","n_estimators, max_depth, max_features, min_samples_split, min_samples_leaf, bootstrap e class_weight são alguns dos principais."],
  ["O Random Forest precisa de scaling?","Normalmente não. Como as árvores usam regras baseadas em limiares e não distância, a escala das features geralmente não altera a lógica dos splits."],
  ["Quais são as vantagens do Random Forest?","É robusto, captura não linearidades e interações, exige pouco preprocessing, permite paralelização e funciona bem como baseline em dados tabulares."],
  ["Quais são as desvantagens do Random Forest?","Pode ser grande e mais pesado para inferência, é menos interpretável que uma árvore única e pode não ser a melhor opção quando é necessário extrapolar ou otimizar muito o desempenho."],
  ["O que é AdaBoost?","AdaBoost combina modelos fracos sequencialmente, aumentando a importância das observações mal classificadas para que os próximos estimadores foquem nesses casos."],
  ["O que o AdaBoost busca resolver?","Busca transformar vários modelos fracos em um modelo forte, concentrando progressivamente o aprendizado nos exemplos mais difíceis."],
  ["Como o AdaBoost atualiza o foco nos exemplos difíceis?","Após cada estimador, aumenta o peso das observações mal classificadas e reduz relativamente o peso das bem classificadas; os modelos são então combinados por seus pesos."],
  ["Qual é a principal sensibilidade do AdaBoost?","Ele pode ser sensível a outliers e ruído, porque exemplos difíceis recebem mais peso e podem dominar etapas posteriores do treinamento."],
  ["O que é Gradient Boosting?","É um ensemble sequencial em que cada nova árvore é ajustada para reduzir a função de perda, aproximando o negativo do gradiente da loss em relação às previsões atuais."],
  ["O que o Gradient Boosting busca resolver?","Busca reduzir o viés de modelos simples adicionando árvores pequenas sequencialmente, cada uma melhorando a previsão do ensemble."],
  ["Como o Gradient Boosting usa o gradiente?","O gradiente da função de perda indica como a previsão atual deve ser corrigida. A nova árvore aproxima essa direção de correção e sua contribuição é adicionada ao ensemble."],
  ["Qual é o papel do learning_rate no Gradient Boosting?","Ele controla quanto cada nova árvore contribui para o ensemble. Valores menores exigem mais árvores, mas podem melhorar o controle da complexidade."],
  ["Como n_estimators e learning_rate interagem no Gradient Boosting?","Há um trade-off: reduzir learning_rate costuma exigir aumentar n_estimators para atingir capacidade semelhante, com possível ganho de generalização até certo ponto."],
  ["Como controlar overfitting no Gradient Boosting?","Pode-se reduzir profundidade das árvores, learning_rate, usar subsampling, regularização e early stopping, além de validar adequadamente o número de estimadores."],
  ["O que é XGBoost?","É uma implementação otimizada de gradient boosting com árvores que adiciona regularização explícita, tratamento eficiente de dados e várias otimizações computacionais."],
  ["O que o XGBoost busca melhorar em relação ao Gradient Boosting tradicional?","Busca combinar boa capacidade preditiva com regularização, eficiência computacional, paralelização de partes do treinamento e recursos de engenharia para dados tabulares."],
  ["Como a regularização aparece no XGBoost?","A função objetivo inclui penalizações relacionadas à complexidade das árvores, além de parâmetros como gamma, reg_alpha e reg_lambda para controlar o modelo."],
  ["Quais hiperparâmetros são importantes no XGBoost?","learning_rate, n_estimators, max_depth, min_child_weight, subsample, colsample_bytree, gamma, reg_alpha e reg_lambda são exemplos importantes."],
  ["O que é LightGBM?","É uma implementação de gradient boosting baseada em árvores otimizada para eficiência, usando estratégias como crescimento leaf-wise e técnicas de redução de dados/feature bins."],
  ["O que o LightGBM busca resolver?","Busca reduzir custo de treinamento e memória em datasets grandes, mantendo alta capacidade preditiva por meio de otimizações específicas para boosting com árvores."],
  ["Qual é uma diferença importante do crescimento leaf-wise do LightGBM?","Em vez de crescer todas as folhas de um nível de forma uniforme, ele expande a folha que mais reduz a perda, podendo alcançar maior ganho com menos folhas, mas aumentando risco de overfitting."],
  ["Como controlar overfitting no LightGBM?","Parâmetros como num_leaves, max_depth, min_data_in_leaf, learning_rate, feature_fraction, bagging_fraction e regularização ajudam a controlar complexidade."],
  ["Qual é a diferença conceitual entre XGBoost e LightGBM?","Ambos são gradient boosting eficientes, mas usam estratégias de crescimento e otimizações diferentes. LightGBM prioriza eficiência e crescimento leaf-wise; XGBoost usa crescimento por nível por padrão."],
  ["O que é CatBoost e quando ele pode ser interessante?","É uma implementação de gradient boosting especialmente projetada para lidar bem com variáveis categóricas, reduzindo a necessidade de one-hot encoding em muitos cenários."],
  ["Quando eu escolheria Bagging em vez de Boosting?","Bagging é particularmente interessante quando o problema principal é alta variância e instabilidade. Boosting tende a ser explorado quando se busca maior capacidade de reduzir viés."],
  ["Quando ensembles de árvores são uma boa escolha?","São fortes candidatos em dados tabulares com relações não lineares e interações, especialmente quando modelos lineares são restritivos e há dados suficientes para validar a complexidade."],
  ["Quando um ensemble pode ser uma escolha ruim?","Quando latência, memória, interpretabilidade extrema ou extrapolação são prioridades, ou quando a complexidade adicionada não gera ganho relevante sobre um modelo mais simples."],
  ["Como comparar Random Forest, AdaBoost e Gradient Boosting?","Compararia objetivo, comportamento de bias-variance, sensibilidade a ruído, custo, interpretabilidade, hiperparâmetros e desempenho em validação adequada ao problema."],
  ["Como comparar XGBoost e LightGBM em um projeto real?","Usaria validação consistente e compararia desempenho, tempo de treino, memória, latência, estabilidade e complexidade de tuning, sem assumir que um é sempre superior."],
  ["Como ensembles lidam com o trade-off entre viés e variância?","Bagging tende a reduzir variância; boosting tende a reduzir viés adicionando modelos sequencialmente; stacking busca combinar erros complementares de modelos diferentes."],

{
 id:"redes", num:"16", title:"Redes Neurais", subtitle:"Modelos multicamadas treinados por otimização e backpropagation.",
 summary:"Redes neurais aprendem representações por meio de camadas de transformações parametrizadas. O treinamento combina forward pass, função de perda, backpropagation e um otimizador para ajustar os pesos. O comportamento depende da arquitetura, ativação, inicialização, regularização, dados e processo de otimização.",
 branches:[
  ["O que é uma rede neural artificial?","É um modelo composto por camadas de neurônios artificiais conectados por pesos. Cada neurônio calcula uma combinação ponderada das entradas, adiciona um bias e aplica uma função de ativação. Com várias camadas, a rede consegue aprender representações hierárquicas e relações não lineares."],
  ["Como funciona um neurônio artificial?","O neurônio calcula primeiro uma combinação linear das entradas: z = wᵀx + b. Em seguida aplica uma função de ativação: a = f(z). Os pesos determinam a contribuição das entradas e o bias desloca a função de ativação."],
  ["Por que uma rede neural precisa de funções de ativação não lineares?","Sem uma ativação não linear, a composição de várias camadas lineares continua sendo equivalente a uma única transformação linear. A não linearidade permite que a rede represente relações complexas e fronteiras de decisão não lineares."],
  ["Como funciona o forward pass?","Os dados percorrem a rede camada por camada. Cada camada calcula z = Wx + b e depois aplica sua função de ativação. A saída da última camada produz o score, probabilidade ou valor previsto pelo modelo."],
  ["Qual é o papel da função de perda em uma rede neural?","A loss quantifica o erro entre a previsão e o target. Ela fornece o objetivo que será minimizado durante o treinamento. Exemplos incluem cross-entropy para classificação e MSE ou MAE para regressão."],
  ["Como a rede neural aprende os pesos?","O treinamento calcula a loss, obtém os gradientes da loss em relação aos pesos por backpropagation e atualiza os parâmetros com um algoritmo de otimização, como SGD ou Adam. Esse ciclo é repetido por várias iterações."],
  ["O que é backpropagation?","É o algoritmo usado para calcular eficientemente os gradientes da função de perda em relação aos parâmetros da rede. Ele propaga o erro da saída para as camadas anteriores aplicando a regra da cadeia."],
  ["Como a regra da cadeia aparece no backpropagation?","Como a saída de uma camada depende das anteriores, a derivada da loss em relação a um parâmetro é obtida multiplicando as derivadas ao longo do caminho. Isso permite calcular gradientes de todas as camadas de forma eficiente."],
  ["O gradiente encontra diretamente o ótimo global?","Não. O gradiente fornece informação local sobre a direção de maior crescimento da função. O otimizador usa essa informação para atualizar os parâmetros na direção de redução da loss. Em redes profundas, a função objetivo pode ser não convexa e possuir múltiplos pontos estacionários."],
  ["Como funciona o Gradient Descent?","Em cada atualização, os parâmetros são movidos na direção oposta ao gradiente: θ ← θ − η∇L(θ). η é a learning rate. A atualização busca reduzir a função de perda."],
  ["O que é learning rate e por que ela é importante?","É o tamanho do passo usado nas atualizações dos parâmetros. Muito alta pode causar instabilidade ou impedir convergência; muito baixa pode tornar o treinamento lento. Pode ser ajustada ou reduzida por schedulers durante o treinamento."],
  ["Como Adam se diferencia do SGD?","Adam adapta a taxa de atualização de cada parâmetro usando estimativas do primeiro e segundo momentos dos gradientes, além de usar uma learning rate base. Geralmente converge rapidamente e exige menos ajuste inicial, embora SGD com momentum possa generalizar muito bem em alguns cenários."],
  ["Qual é a diferença entre época, batch e iteração?","Uma época corresponde a uma passagem pelo conjunto de treinamento. Um batch é o subconjunto usado em uma atualização. Uma iteração normalmente corresponde a uma atualização dos parâmetros; com N amostras e batch size B, há aproximadamente N/B iterações por época."],
  ["Como escolher a função de ativação da camada de saída?","Depende do problema. Em regressão, uma saída linear é comum. Em classificação binária, sigmoid produz uma probabilidade para uma classe. Em classificação multiclasse mutuamente exclusiva, softmax produz probabilidades que somam 1."],
  ["Qual é o papel da sigmoid?","Sigmoid transforma um valor real em um número entre 0 e 1: σ(z)=1/(1+e⁻ᶻ). É comum na saída de classificação binária porque pode ser interpretada como probabilidade sob a modelagem apropriada."],
  ["Qual é o papel da softmax?","Softmax transforma scores em probabilidades que somam 1: pᵢ=eᶻⁱ/Σⱼeᶻʲ. É comum na saída de classificação multiclasse quando cada observação pertence a uma única classe."],
  ["Por que ReLU é tão usada em redes profundas?","ReLU(x)=max(0,x) é simples, barata e mantém gradiente igual a 1 para entradas positivas. Isso ajuda a reduzir o problema de saturação observado em algumas ativações tradicionais, embora possa produzir neurônios mortos quando ficam persistentemente no lado negativo."],
  ["Qual é a diferença entre ReLU, sigmoid e tanh?","ReLU é não saturante no lado positivo e muito usada em camadas ocultas. Sigmoid produz valores entre 0 e 1, mas pode saturar e gerar gradientes pequenos. Tanh produz valores entre −1 e 1 e também pode saturar, embora seja centrada em zero."],
  ["O que é o problema de vanishing gradient?","É quando os gradientes ficam extremamente pequenos ao atravessar muitas camadas durante o backpropagation. As primeiras camadas recebem atualizações muito pequenas e aprendem lentamente. Ativações saturantes, arquiteturas profundas e certas inicializações podem contribuir para o problema."],
  ["O que é exploding gradient?","É quando os gradientes crescem excessivamente durante o backpropagation, produzindo atualizações instáveis e podendo levar a NaNs. Pode ser mitigado com inicialização adequada, normalização, arquitetura apropriada e gradient clipping."],
  ["Por que inicializar os pesos aleatoriamente?","Se todos os neurônios de uma camada começassem com os mesmos pesos, receberiam gradientes iguais e aprenderiam a mesma representação. A quebra de simetria permite que neurônios aprendam características diferentes."],
  ["Por que os pesos não devem ser inicializados todos como zero?","Porque a simetria entre os neurônios seria preservada: eles receberiam atualizações equivalentes e tenderiam a aprender a mesma função. Inicializações como Xavier/Glorot e He são usadas para manter variâncias adequadas ao longo da rede."],
  ["Qual é a diferença entre inicialização Xavier e He?","Xavier/Glorot é projetada para manter a escala das ativações e gradientes adequada, sendo comum com ativações como tanh. He considera a característica da ReLU de zerar metade dos valores e costuma ser apropriada para redes com ReLU."],
  ["Por que o scaling das features é importante em redes neurais?","Escalas muito diferentes podem dificultar a otimização porque os gradientes ficam mal condicionados e algumas variáveis dominam as atualizações. Padronização ou outra transformação adequada geralmente torna o treinamento mais estável e eficiente."],
  ["Como tratar variáveis categóricas em redes neurais?","Para baixa cardinalidade, one-hot encoding é uma opção. Para alta cardinalidade, embeddings podem representar categorias em um espaço contínuo de menor dimensão. A escolha depende da cardinalidade, estrutura dos dados e arquitetura."],
  ["Como tratar valores ausentes em redes neurais?","Redes neurais não tratam automaticamente missing values de forma universal. É comum imputar os valores e, quando a ausência pode carregar informação, adicionar uma variável indicadora de missing. O método de imputação deve ser ajustado apenas no treino."],
  ["Como redes neurais lidam com outliers?","Depende da função de perda e da arquitetura. Losses como MSE penalizam fortemente erros grandes, tornando o treinamento sensível a outliers; MAE ou Huber podem ser mais robustas. Também é necessário investigar se o outlier é erro ou um evento legítimo."],
  ["Como lidar com classes desbalanceadas em uma rede neural?","Posso usar class weights na loss, oversampling, undersampling ou técnicas específicas para o problema. Também devo avaliar métricas adequadas, como recall, precision, F1 ou PR-AUC, em vez de depender apenas da acurácia."],
  ["Como uma rede neural pode sofrer overfitting?","Ela pode ter capacidade suficiente para memorizar padrões específicos do treino, especialmente com poucos dados ou uma arquitetura muito grande. O desempenho de treino continua melhorando enquanto o de validação piora."],
  ["Quais técnicas ajudam a reduzir overfitting em redes neurais?","Dropout, weight decay, early stopping, data augmentation, redução da arquitetura e mais dados são estratégias comuns. A escolha depende do tipo de dado e do motivo do overfitting."],
  ["O que é Dropout?","Durante o treinamento, Dropout desativa aleatoriamente uma fração dos neurônios ou ativações. Isso reduz a dependência excessiva entre unidades e funciona como uma forma de regularização. Na inferência, o comportamento é ajustado para usar a rede completa."],
  ["O que é weight decay e como ele se relaciona à regularização L2?","Weight decay penaliza pesos grandes durante a otimização, incentivando soluções com parâmetros menores. Em implementações clássicas de SGD, é equivalente à regularização L2 sob determinadas condições; em AdamW, o weight decay é desacoplado da atualização adaptativa."],
  ["O que é early stopping?","É interromper o treinamento quando uma métrica de validação deixa de melhorar por determinado número de épocas. Ajuda a evitar que a rede continue ajustando ruído do conjunto de treino."],
  ["O que é Batch Normalization?","É uma normalização aplicada às ativações usando estatísticas dos mini-batches durante o treinamento, seguida de parâmetros aprendíveis. Pode estabilizar e acelerar o treinamento, embora seu comportamento dependa do batch size e da arquitetura."],
  ["Qual é a diferença entre Batch Normalization e Layer Normalization?","BatchNorm calcula estatísticas principalmente ao longo do batch para cada feature/canal; LayerNorm normaliza as features dentro de cada exemplo. LayerNorm é particularmente comum em arquiteturas como Transformers, nas quais o batch pode variar ou ser pequeno."],
  ["Como escolher a arquitetura de uma rede neural?","Começo pelo tipo e volume dos dados e pela complexidade do problema. Depois defino número de camadas, unidades, ativações e regularização por experimentação controlada e validação. A arquitetura deve ter capacidade suficiente sem introduzir complexidade desnecessária."],
  ["Mais camadas sempre significam um modelo melhor?","Não. Mais profundidade aumenta a capacidade de representação, mas também pode aumentar custo, dificuldade de otimização e overfitting. Arquitetura, quantidade de dados, regularização e qualidade das features precisam ser considerados conjuntamente."],
  ["Como avaliar uma rede neural para classificação?","Uso métricas coerentes com o problema, como precision, recall, F1, ROC-AUC ou PR-AUC, além da matriz de confusão. Se as probabilidades forem usadas para decisão, também avalio calibração e escolho o threshold considerando custos de negócio."],
  ["Como avaliar uma rede neural para regressão?","MAE, MSE, RMSE e R² são opções comuns. A escolha depende da penalização desejada para erros grandes, unidade de medida, presença de outliers e objetivo de negócio. A avaliação deve ser feita em dados não utilizados no treinamento."],
  ["O que é transfer learning e quando usar?","É reutilizar uma rede pré-treinada em uma tarefa ou dataset relacionado e adaptá-la ao novo problema. É especialmente útil quando o novo dataset é menor e existe um modelo pré-treinado em dados representativos."],
  ["O que é data augmentation e por que pode ajudar?","É gerar variações plausíveis dos exemplos de treinamento, como rotações ou cortes em imagens ou pequenas transformações em outros tipos de dados. Aumenta a diversidade efetiva do treino e pode melhorar generalização, desde que as transformações preservem o significado do target."],
  ["Como explicar uma previsão de uma rede neural para uma área de negócio?","Posso usar métodos de explicabilidade como SHAP, Integrated Gradients, saliency maps ou técnicas específicas do domínio. É importante diferenciar explicação local de comportamento global e deixar claro que uma explicação do modelo não prova causalidade."],
  ["Quais são as principais vantagens das redes neurais?","Alta capacidade de representar relações não lineares, aprendizado de representações e excelente desempenho em problemas complexos e dados não estruturados quando há dados e recursos suficientes. Também permitem arquiteturas especializadas para imagens, texto, áudio e séries temporais."],
  ["Quais são as principais desvantagens das redes neurais?","Podem exigir muitos dados e recursos computacionais, são sensíveis à configuração do treinamento, podem sofrer overfitting e geralmente são menos interpretáveis que modelos simples. O custo de treinamento e manutenção também pode ser elevado."],
  ["Como explicar o treinamento completo de uma rede neural em uma sabatina?","Eu resumiria como: os dados entram no forward pass, a rede produz uma previsão, a loss mede o erro, o backpropagation calcula os gradientes pela regra da cadeia e o otimizador atualiza os pesos. Esse processo se repete em mini-batches e épocas até atingir um critério de parada."]
